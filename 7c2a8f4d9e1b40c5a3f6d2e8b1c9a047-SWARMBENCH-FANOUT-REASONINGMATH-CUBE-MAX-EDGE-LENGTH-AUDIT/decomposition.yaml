pattern: fan-out-synthesize
description: >
  Use independent solving, adversarial sign-pattern validation, one-response-per-agent
  auditing, and final synthesis. This decomposition intentionally distributes the
  substantive mathematical work to sub-agents so the orchestrator only coordinates
  and assembles.

orchestration_requirements: >
  The orchestrator MUST follow this fan-out-synthesize plan. It MUST spawn every
  sub-agent listed below and MUST NOT solve the geometry problem, audit candidate
  responses, or assign final labels by itself before receiving sub-agent outputs.
  The orchestrator should pass the relevant input context to workers, wait for
  their reports, then perform only reconciliation and final JSON assembly. The
  orchestrator must not write long independent derivations or long response audits
  in its own context.

sub_tasks:
  - id: solve_original_geometry
    title: Independently solve the cube-and-plane maximum-edge-length-squared problem
    description: >
      Derive the largest possible value of s² (the squared edge length of the cube)
      consistent with the eight given vertex-to-plane distances, from first principles
      and without trusting any proposed response.
    parallel_group: map
    depends_on: []
    objective: >
      Solve the problem independently. Parametrize the eight cube vertices' signed
      distances using all relevant sign-pattern families relative to the plane,
      enumerate every non-degenerate orientation consistent with the eight distances
      {0, 1, 2, 3, 4, 5, 6, 7}, compute every valid s², and report the maximum.
    deliverable: >
      A compact solution listing every valid s² value, with the maximum identified.

  - id: adversarial_sign_pattern_validator
    title: Validate or refute single-orientation conclusions
    description: >
      Independently check whether the all-positive-sign-pattern case (where every
      cube vertex lies on the same side of the plane) gives the actual maximum s²
      or whether sign-flipped configurations yield larger s² values.
    parallel_group: map
    depends_on: []
    objective: >
      Act as a skeptical validator. Consider the configuration where the cutting
      plane passes through the cube's interior so that some vertices have negative
      signed distance. Confirm or refute that the maximum s² coincides with the
      all-positive s². State which orientation family supplies the maximum.
    deliverable: >
      A validation report identifying the orientation family that supplies the
      maximum s² and refutations of single-orientation arguments.

  - id: audit_response_A
    title: Audit response A
    description: >
      Audit only response A against the validated geometry and assign all labels.
    parallel_group: audit
    depends_on: [solve_original_geometry, adversarial_sign_pattern_validator]
    objective: >
      Audit response A only. Read response A carefully and assign all required fields:
      final_answer_category, gtfa_correct, spatial_reasoning_error,
      non_spatial_reasoning_error, calculation_error, completeness_level,
      efficiency_level, latex_clarity_level, error_codes, and brief_justification.
      Do not audit any other response.
    deliverable: >
      Complete labels and short justification for response A.

  - id: audit_response_B
    title: Audit response B
    description: >
      Audit only response B against the validated geometry and assign all labels.
    parallel_group: audit
    depends_on: [solve_original_geometry, adversarial_sign_pattern_validator]
    objective: >
      Audit response B only. Pay special attention to the response's geometric setup
      (whether it places the plane parallel to a cube face) and to whether it
      identifies the cube edge length directly with the maximum vertex distance.
      Assign all required fields using the controlled values from instruction.md.
    deliverable: >
      Complete labels and short justification for response B.

  - id: audit_response_C
    title: Audit response C
    description: >
      Audit only response C against the validated geometry and assign all labels.
    parallel_group: audit
    depends_on: [solve_original_geometry, adversarial_sign_pattern_validator]
    objective: >
      Audit response C only. Assign all required fields using the controlled values
      from instruction.md. Do not audit any other response.
    deliverable: >
      Complete labels and short justification for response C.

  - id: audit_response_D
    title: Audit response D
    description: >
      Audit only response D against the validated geometry and assign all labels.
    parallel_group: audit
    depends_on: [solve_original_geometry, adversarial_sign_pattern_validator]
    objective: >
      Audit response D only. Assign all required fields using the controlled values
      from instruction.md. Do not audit any other response.
    deliverable: >
      Complete labels and short justification for response D.

  - id: audit_response_E
    title: Audit response E
    description: >
      Audit only response E against the validated geometry and assign all labels.
    parallel_group: audit
    depends_on: [solve_original_geometry, adversarial_sign_pattern_validator]
    objective: >
      Audit response E only. Pay special attention to whether the response produces
      an identifiable final numeric answer at all. Assign all required fields using
      the controlled values from instruction.md.
    deliverable: >
      Complete labels and short justification for response E.

  - id: audit_response_F
    title: Audit response F
    description: >
      Audit only response F against the validated geometry and assign all labels.
    parallel_group: audit
    depends_on: [solve_original_geometry, adversarial_sign_pattern_validator]
    objective: >
      Audit response F only. Pay special attention to whether the response's
      derivation is valid for the all-positive sign-pattern case yet still misses
      orientations that yield larger s². Assign all required fields using the
      controlled values from instruction.md.
    deliverable: >
      Complete labels and short justification for response F.

  - id: audit_response_G
    title: Audit response G
    description: >
      Audit only response G against the validated geometry and assign all labels.
    parallel_group: audit
    depends_on: [solve_original_geometry, adversarial_sign_pattern_validator]
    objective: >
      Audit response G only. Check whether the response's final answer comes from
      a fabricated algebraic identity or a Vieta-style sum over an unjustified
      quadratic. Assign all required fields using the controlled values from
      instruction.md.
    deliverable: >
      Complete labels and short justification for response G.

  - id: audit_response_H
    title: Audit response H
    description: >
      Audit only response H against the validated geometry and assign all labels.
    parallel_group: audit
    depends_on: [solve_original_geometry, adversarial_sign_pattern_validator]
    objective: >
      Audit response H only. Assign all required fields using the controlled values
      from instruction.md. Do not audit any other response.
    deliverable: >
      Complete labels and short justification for response H.

  - id: audit_response_I
    title: Audit response I
    description: >
      Audit only response I against the validated geometry and assign all labels.
    parallel_group: audit
    depends_on: [solve_original_geometry, adversarial_sign_pattern_validator]
    objective: >
      Audit response I only. Assign all required fields using the controlled values
      from instruction.md. Do not audit any other response.
    deliverable: >
      Complete labels and short justification for response I.

  - id: synthesize_final_json
    title: Synthesize final JSON output
    description: >
      Reconcile the solver, validator, and nine single-response audits, then produce
      the final JSON in the exact required schema.
    parallel_group: synthesize
    depends_on:
      - solve_original_geometry
      - adversarial_sign_pattern_validator
      - audit_response_A
      - audit_response_B
      - audit_response_C
      - audit_response_D
      - audit_response_E
      - audit_response_F
      - audit_response_G
      - audit_response_H
      - audit_response_I
    objective: >
      Reconcile all worker reports. The final answer must be based on the solver
      and validator, not on a majority vote among candidate responses. Produce
      exactly the required JSON schema with top-level derived_final_answer and
      responses as an object with keys A, B, C, D, E, F, G, H, and I. Do not output
      responses as a list.
    deliverable: >
      The final /logs/agent/output.json content in the exact required schema.

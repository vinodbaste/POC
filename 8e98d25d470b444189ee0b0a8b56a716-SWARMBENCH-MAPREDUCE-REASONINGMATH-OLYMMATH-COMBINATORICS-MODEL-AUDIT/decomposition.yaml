sub_tasks:
  - id: audit-A-B-C-D
    description: |
      You are auditing four candidate solutions to an olympiad combinatorics problem.
      You are NOT solving the problem yourself; you are judging four written solutions
      against the standard of mathematical correctness.

      ## The problem each candidate was given

      Given a non-negative integer sequence {a_n} satisfying a_1 = 2016,
      a_{n+1} <= sqrt(a_n), and if the number of terms is at least 2, then any two
      terms in the sequence are not equal. Find the number of such sequences {a_n}.

      ## Your task

      Read these four candidate files in full:
        - /input_artifacts/response_A.md
        - /input_artifacts/response_B.md
        - /input_artifacts/response_C.md
        - /input_artifacts/response_D.md

      For EACH of the four candidates, produce one solution-audit JSON object with
      these fields exactly:

      {
        "solution_id": "<A, B, C, or D>",
        "extracted_answer": "<literal final boxed/stated answer; empty string if none>",
        "final_answer_correct": <bool>,
        "verdict": "<correct | partially_correct | incorrect>",
        "logical_chain_valid": <bool>,
        "proof_complete": <bool>,
        "contains_wrong_math_claim": <bool>,
        "first_fatal_error": <{location, error_type, explanation} | null>,
        "failure_labels": [<from controlled vocabulary>],
        "domain_specific_labels": [<from controlled vocabulary>],
        "repairability": "<minor_fix | major_rewrite | impossible_from_current_solution | n/a>",
        "brief_assessment": "<1-3 sentences>"
      }

      Verdict rules:
        - "correct" requires: extracted_answer equals the gold answer (a specific
          integer that the verify-gold-math sub-agent will derive) AND the proof
          chain is logically valid AND complete.
        - "partially_correct": extracted answer matches gold but proof has a gap,
          OR answer is close (off by a small constant or factor) and recurrence is
          essentially right.
        - "incorrect": otherwise.

      first_fatal_error must be JSON null when verdict is "correct".
      repairability must be "n/a" when verdict is "correct".

      ## Controlled failure_labels vocabulary (use only these strings)

      final_answer_error, correct_answer_invalid_proof, invalid_logical_step,
      wrong_theorem_application, false_math_claim, missing_case, incomplete_proof,
      underjustified_step, circular_reasoning, arithmetic_error,
      pattern_extrapolation_unsupported, inconsistent_boxing, repetition_loop,
      notation_definition_error.

      ## Controlled domain_specific_labels vocabulary (use only these strings)

      wrong_recurrence, correct_recurrence_wrong_arithmetic, missed_singleton_sequence,
      deterministic_chain_misconception, power_of_two_leap, off_by_factor_of_two,
      off_by_small_constant, distinct_term_constraint_ignored, bounds_error,
      truncated_before_conclusion.

      ## Output

      Return ONE JSON object with key "audits" mapping to a 4-element array of
      per-candidate audits in the order [A, B, C, D]:

      {"audits": [<audit for A>, <audit for B>, <audit for C>, <audit for D>]}

      Do NOT write to /logs/agent/output.json. That file is the final output and
      is written only by the synthesize-final-audit sub-task.
    depends_on: []
    parallel_group: audit


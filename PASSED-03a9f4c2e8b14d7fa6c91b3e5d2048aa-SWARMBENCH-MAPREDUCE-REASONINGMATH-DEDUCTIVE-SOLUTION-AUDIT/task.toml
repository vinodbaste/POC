[task]
name = "swarmbench/03a9f4c2e8b14d7fa6c91b3e5d2048aa-SWARMBENCH-MAPREDUCE-REASONINGMATH-DEDUCTIVE-SOLUTION-AUDIT"
description = "Audit six proposed solutions to a mislabeled-bag deductive reasoning puzzle using deterministic proof-validity criteria."

[metadata]
verifier_type = "executable"
domain = "reasoning-math"
coordination_pattern = "map-reduce"
human_solving_hours_estimate = 10.0
human_solving_hours_justification = "10.0 hours total = 1.5h deriving and checking the 12-inspection worst-case solution and lower bound + 6 responses × 1.1h/response = 6.6h auditing C1-C8, verdict, and primary_failure_code + 1.2h cross-checking oracle.json against candidate text and weighted scoring + 0.7h packaging and execution-log consistency checks. Component sum: 1.5 + 6.6 + 1.2 + 0.7 = 10.0 hours."
estimated_sub_agents = 8
input_token_estimate = 17000
why_multi_agent = "The task contains six independent candidate solution audits, each requiring careful local attention to subtle proof errors such as favorable-case reasoning, invalid one-draw inference, and missing lower bounds. A single agent is likely to conflate candidates or miss subtle proof defects as context accumulates. Map-reduce lets six mapper agents each own one response, while a reducer merges verdicts into one deterministic audit report."
reference_link = "https://medium.com/@shelvia1039/brain-teaser-18-mislabeled-bags-1581b1278173"

[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

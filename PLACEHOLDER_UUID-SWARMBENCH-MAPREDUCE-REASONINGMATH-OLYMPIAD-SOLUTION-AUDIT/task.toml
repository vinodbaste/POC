[task]
name = "swarmbench/PLACEHOLDER_UUID-SWARMBENCH-MAPREDUCE-REASONINGMATH-OLYMPIAD-SOLUTION-AUDIT"
description = "Audit 20 olympiad problem solutions: verify each numbered claim, identify the central technique, and rate solution rigor."

[metadata]
verifier_type = "llm-judge"
domain = "reasoning-math"
coordination_pattern = "map-reduce"
human_solving_hours_estimate = 44
human_solving_hours_justification = "20 olympiad solutions with 6-8 numbered key claims each = 133 individual claim verifications across the corpus. A working mathematician needs ~15 minutes per claim to read the proof context, follow the reasoning, and decide whether the claim is verified/unjustified/incorrect, so 133 x 15 min = 33 hours. Plus 20 x 10 min = 3 hours to identify the central technique per solution and assign a rigor score. Plus 6 hours to aggregate technique-usage tallies, rigor distribution, and per-shard summaries. Plus 2 hours QA. Total = 44 hours."
estimated_sub_agents = 6
input_token_estimate = 17000
why_multi_agent = "The task requires auditing 20 olympiad solutions with 6-8 numbered claims each (133 total claim verifications). The input artifacts span only ~17 000 tokens, so context overflow is not the failure mode. Instead, the structural pressure is on OUTPUT attention: a single agent producing 133 individual claim status decisions plus 20 technique assignments and rigor scores plus 5 shard summaries plus 8 global aggregates must sustain coherent reasoning across ~30 000 tokens of generation. By the tail of the generation the agent conflates techniques between problems, miscounts unjustified/incorrect claims per artifact (breaking the deterministic rigor score), and produces inconsistent aggregates. In a map-reduce decomposition, five mapper sub-agents each audit four solutions in an isolated context, generating ~6 000 tokens of focused output each; one reducer sub-agent then aggregates the 20 per-problem audits into the dataset-wide summary. Each mapper sustains full attention across its 4-artifact window, producing higher per-claim verification accuracy and consistent rigor scoring."
reference_link = "https://www.imo-official.org/problems.aspx"

[agent]
timeout_sec = 1200

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

sub_tasks:
  - id: shard_01
    description: >
      This shard MUST be executed by a dedicated mapper sub-agent running in an isolated context window. Do not inline the work into the orchestrator.
      Read /input_artifacts/artifacts/artifact_01.md through
      /input_artifacts/artifacts/artifact_04.md and
      /input_artifacts/audit_rubric.md.
      For each of the 4 artifacts:
        1. Read the problem, the full numbered solution, and the list of key claims [C1], [C2], ....
        2. For EVERY claim tag found in the artifact, classify its status using the rubric's
           three-step decision procedure (verified -> unjustified -> incorrect, stop at first match).
        3. Identify the central technique from the 10-value taxonomy (algebraic_manipulation,
           combinatorial_counting, induction, inequality_application, modular_arithmetic,
           geometric_construction, extremal_principle, invariant_or_monovariant,
           generating_function, proof_by_contradiction).
        4. Assign a rigor_score integer in [1, 2, 3, 4, 5].
      Write /logs/agent/shard_01.json using EXACTLY this JSON structure:
      {
        "shard_id": "shard_01",
        "artifact_ids": ["artifact_01","artifact_02","artifact_03","artifact_04"],
        "artifact_audits": [
          {"artifact_id": "artifact_01", "central_technique": "X", "rigor_score": 0,
           "claim_audits": [{"claim_id": "C1", "status": "Y"}, ...]},
          ...
        ]
      }
      Replace X/Y/0 with your independent classifications. Do not add extra keys.
    depends_on: []
    parallel_group: map

  - id: shard_02
    description: >
      This shard MUST be executed by a dedicated mapper sub-agent running in an isolated context window. Do not inline the work into the orchestrator.
      Read /input_artifacts/artifacts/artifact_05.md through
      /input_artifacts/artifacts/artifact_08.md and
      /input_artifacts/audit_rubric.md.
      For each of the 4 artifacts: classify every claim tag using the rubric's three-step procedure,
      identify the central technique from the taxonomy, and assign rigor_score 1-5.
      Write /logs/agent/shard_02.json using the same JSON structure as shard_01, with
      artifact_ids ["artifact_05","artifact_06","artifact_07","artifact_08"]. Do not add extra keys.
    depends_on: []
    parallel_group: map

  - id: shard_03
    description: >
      This shard MUST be executed by a dedicated mapper sub-agent running in an isolated context window. Do not inline the work into the orchestrator.
      Read /input_artifacts/artifacts/artifact_09.md through
      /input_artifacts/artifacts/artifact_12.md and
      /input_artifacts/audit_rubric.md.
      For each of the 4 artifacts: classify every claim tag using the rubric's three-step procedure,
      identify the central technique from the taxonomy, and assign rigor_score 1-5.
      Write /logs/agent/shard_03.json using the same JSON structure as shard_01, with
      artifact_ids ["artifact_09","artifact_10","artifact_11","artifact_12"]. Do not add extra keys.
    depends_on: []
    parallel_group: map

  - id: shard_04
    description: >
      This shard MUST be executed by a dedicated mapper sub-agent running in an isolated context window. Do not inline the work into the orchestrator.
      Read /input_artifacts/artifacts/artifact_13.md through
      /input_artifacts/artifacts/artifact_16.md and
      /input_artifacts/audit_rubric.md.
      For each of the 4 artifacts: classify every claim tag using the rubric's three-step procedure,
      identify the central technique from the taxonomy, and assign rigor_score 1-5.
      Write /logs/agent/shard_04.json using the same JSON structure as shard_01, with
      artifact_ids ["artifact_13","artifact_14","artifact_15","artifact_16"]. Do not add extra keys.
    depends_on: []
    parallel_group: map

  - id: shard_05
    description: >
      This shard MUST be executed by a dedicated mapper sub-agent running in an isolated context window. Do not inline the work into the orchestrator.
      Read /input_artifacts/artifacts/artifact_17.md through
      /input_artifacts/artifacts/artifact_20.md and
      /input_artifacts/audit_rubric.md.
      For each of the 4 artifacts: classify every claim tag using the rubric's three-step procedure,
      identify the central technique from the taxonomy, and assign rigor_score 1-5.
      Write /logs/agent/shard_05.json using the same JSON structure as shard_01, with
      artifact_ids ["artifact_17","artifact_18","artifact_19","artifact_20"]. Do not add extra keys.
    depends_on: []
    parallel_group: map

  - id: reduce-final
    description: >
      This reduction step MUST be executed by a dedicated reducer sub-agent running in its own context window. Do not inline the aggregation into the orchestrator — the reducer must read all five shard JSON files, build the final structured report, and write /logs/agent/output.json.
      Read all five map-phase shard JSON files (/logs/agent/shard_01.json
      through /logs/agent/shard_05.json).
      For artifact metadata (problem_id, competition, year) read
      /input_artifacts/artifact_manifest.json.

      Take per-artifact central_technique, rigor_score, and claim_audits as recorded in
      the shard files. The shard files are authoritative — do NOT re-classify.

      Resilience: if any shard_NN.json is missing or unreadable, re-read the four artifact .md
      files for that shard (e.g., shard_03 covers artifact_09 through artifact_12) and apply
      the rubric in /input_artifacts/audit_rubric.md yourself for those rows only.
      You MUST always produce /logs/agent/output.json containing all 20 artifact entries.

      Sort artifact_audits by artifact_id ascending. Sort shard_summaries by shard_id ascending.
      Compute per-shard technique_counts (count each of the 10 taxonomy values within the shard)
      and mean_rigor (float, two decimal places). Compute global total_artifacts (=20),
      total_claims (sum of len(claim_audits) across artifacts), claim_status_counts,
      technique_counts, mean_rigor, competition_counts, year_counts, artifacts_by_technique
      (each list sorted by artifact_id), then write /logs/agent/output.json.

      The output must follow this exact structure — no extra keys, no missing keys:
      {
        "artifact_audits": [
          {"artifact_id": "artifact_01", "problem_id": "...", "competition": "...",
           "year": 2018, "central_technique": "X", "rigor_score": 0,
           "claim_audits": [{"claim_id": "C1", "status": "Y"}, ...]},
          ...
        ],
        "shard_summaries": [
          {"shard_id": "shard_01", "artifact_ids": [...], "artifact_count": 4,
           "technique_counts": {"algebraic_manipulation": 0, ...},
           "mean_rigor": 0.00},
          ...
        ],
        "summary": {
          "total_artifacts": 20,
          "total_claims": 0,
          "claim_status_counts": {"verified": 0, "unjustified": 0, "incorrect": 0},
          "technique_counts": {"algebraic_manipulation": 0, ...},
          "mean_rigor": 0.00,
          "competition_counts": {"IMO": 0, "USAMO": 0, "IMOSL": 0, "BMOSL": 0},
          "year_counts": {"2018": 0, ...},
          "artifacts_by_technique": {"algebraic_manipulation": [...], ...}
        }
      }
    depends_on:
      - shard_01
      - shard_02
      - shard_03
      - shard_04
      - shard_05
    parallel_group: reduce

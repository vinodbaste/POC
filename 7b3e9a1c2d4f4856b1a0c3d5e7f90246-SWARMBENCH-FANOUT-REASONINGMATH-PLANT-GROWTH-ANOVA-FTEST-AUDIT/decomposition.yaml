  - id: synthesize-final-audit
    description: >
      Combine the gold derivation and the ten response audits into the final JSON.
      Do NOT re-derive the ANOVA and do NOT re-classify any response. Copy
      gold_F_x1000 from derive-gold-anova verbatim. Build per_response_assessment
      as a list in order A..J, each object's response_id, final_answer_correct, and
      failure_reasons copied verbatim from the matching audit. Compute
      acceptable_solution_ids as the sorted uppercase list of response_ids whose
      final_answer_correct is true AND failure_reasons is empty. Write
      /logs/agent/output.json with exactly the keys gold_F_x1000,
      acceptable_solution_ids, per_response_assessment.
    depends_on:
      - derive-gold-anova
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
      - audit-response-j
    parallel_group: synthesize

output_contract:
  file: /logs/agent/output.json
  schema:
    gold_F_x1000: int
    acceptable_solution_ids: [str]
    per_response_assessment:
      - response_id: str
        final_answer_correct: bool
        failure_reasons: [str]

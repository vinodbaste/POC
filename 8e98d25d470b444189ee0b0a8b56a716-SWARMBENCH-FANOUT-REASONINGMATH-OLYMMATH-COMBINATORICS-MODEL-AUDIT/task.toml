[task]
name = "swarmbench/8e98d25d470b444189ee0b0a8b56a716-SWARMBENCH-FANOUT-REASONINGMATH-OLYMMATH-COMBINATORICS-MODEL-AUDIT"
description = "Mathematically audit 20 model-produced solutions to an olympiad combinatorics problem (OlymMATH-EASY-0-EN). First independently derive the gold answer 948 via the natural recurrence f(n) = 1 + sum_{k=0..floor(sqrt(n))} f(k) with f(0)=1, f(1)=2 and prefix sum S(m) = sum_{k=0..m} f(k) up to m=44; then mathematically verify each candidate's reasoning chain against that derivation and record the verifier-aligned structured output: per-response extracted_answer, final_answer correctness, and the exact set of failure-reason codes from a closed vocabulary."

[metadata]
verifier_type = "executable"
domain = "reasoning-math"
coordination_pattern = "fan-out-synthesize"
human_solving_hours_estimate = 22.0
human_solving_hours_justification = "Estimated from a reviewer-grade end-to-end audit workflow that emphasises mathematical derivation as the primary cognitive activity. 2.5h: independently derive the gold answer 948 via the recurrence f(n) = 1 + sum_{k=0..floor(sqrt(n))} f(k) with f(0)=1, f(1)=2 and prefix sum S(m); compute the iterative table f(0)..f(44) and S(0)..S(44) explicitly and verify f(2016) = 1 + S(44). 20 x 0.4h = 8.0h first-pass mathematical audit: for each candidate, read the head and tail of the response, extract the boxed integer, verify its derivation chain against the gold recurrence, and assign the failure-reason set with the exact extracted_answer string. 20 x 0.3h = 6.0h independent second-pass verification of each response by a separate human auditor, anchored in the same recurrence-based derivation, to catch missed secondary failure mechanisms. 5.5h: reconcile the forty independent audit outputs into one structured oracle JSON, resolve disagreements by re-reading the relevant response sections, and produce the verifier-aligned acceptable_solution_ids list. Total: 2.5 + 8.0 + 6.0 + 5.5 = 22.0h."
estimated_sub_agents = 42
input_token_estimate = 69000
why_multi_agent = "The audit requires (i) original mathematical derivation of the gold answer via the recurrence f(n) = 1 + sum_{k=0..floor(sqrt(n))} f(k) and (ii) per-response mathematical verification of twenty distinct candidate chains against that derivation. A single agent must hold the derivation, the closed six-code failure vocabulary, and twenty separate verification threads in one context (~69K tokens total response material plus instruction). The dominant failure mode of the single agent is coverage failure compounded by attentional collapse across the twenty verification threads: it identifies the dominant failure of each response from its boxed answer but tends to miss secondary mathematical mechanisms (such as inconsistent boxing where the body-derived value differs from the boxed value) and confuses boundary cases between codes; with twenty responses the per-response error rate compounds into a noticeably lower aggregate score. Fan-out assigns the recurrence derivation to one isolated sub-agent, each first-pass mathematical audit to its own response-isolated sub-agent, and each second-pass verification to a separate response-isolated sub-agent. The synthesizer reconciles the two independent audits per response, taking consensus where they agree and re-opening the relevant response file where they disagree. This two-pass structure protects multi against any single auditor's miss while preserving information symmetry: every sub-agent receives only the same instruction.md and its assigned response file, with no per-response failure-code hints."
reference_link = "https://huggingface.co/datasets/RUC-AIBOX/OlymMATH-eval"

[agent]
timeout_sec = 5400

[verifier]
timeout_sec = 600


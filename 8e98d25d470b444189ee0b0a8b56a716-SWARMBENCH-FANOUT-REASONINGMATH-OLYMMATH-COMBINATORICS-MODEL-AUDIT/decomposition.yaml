sub_tasks:
  - id: verify-gold-math
    description: |
      The problem statement is given to you verbatim below. Do NOT inspect any
      candidate response file.

      ## The problem

      Given a non-negative integer sequence {a_n} satisfying:
        (1) a_1 = 2016,
        (2) a_{n+1} <= sqrt(a_n),
        (3) if the number of terms is at least 2, then any two terms are distinct.
      Find the number of such sequences {a_n}.

      ## Your sole job

      Independently derive the integer gold answer by setting up the natural
      recurrence f(n) = number of valid sequences starting at value n, with base
      cases f(0) = 1 and f(1) = 2. For n >= 2, f(n) counts the singleton sequence
      (n) plus, for each valid choice of a_2 in {0, 1, ..., floor(sqrt(n))} with
      a_2 != n, a valid continuation f(a_2). Note that since a_2 <= sqrt(n) < n
      for n >= 2, the distinctness condition between a_1 and a_2 is automatic,
      so the recurrence collapses to f(n) = 1 + sum_{k=0..floor(sqrt(n))} f(k).
      Compute f(k) iteratively for k = 0, 1, ..., 44 (since floor(sqrt(2016)) = 44),
      maintain the prefix sum S(m) = sum_{k=0..m} f(k), and conclude
      f(2016) = 1 + S(44).

      Return ONE JSON object with these keys:

      {
        "gold_answer_integer": <integer>,
        "gold_answer_string": "<string form of the integer, no decimal, no separator>",
        "recurrence_brief": "<2-4 sentences describing the recurrence form, base cases, and how f(2016) is computed from S(44)>"
      }

      Do NOT read any candidate response file. Do NOT write to /logs/agent/output.json.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: |
      Read /workspace/instruction.md and /input_artifacts/response_A.md only.
      Audit response A against the standard of mathematical correctness for the
      olympiad combinatorics problem in instruction.md.

      Extract the literal final answer the candidate boxed or stated. Decide
      final_answer_correct by literal string comparison against the gold
      integer 948. Then determine the exact set of failure_reasons whose trigger
      condition is concretely present in this single response, drawn ONLY from
      the six-code vocabulary in instruction.md.

      Specific guidance for response A: TWO trigger conditions can apply
      simultaneously. (a) The response asserts a small constant count (such as
      "always 4") with no recurrence and no iterative computation — that maps to
      unsupported_constant_answer. (b) The response also asserts that the count
      is fixed "regardless of the starting value" or that the chain is
      essentially forced regardless of starting state — that maps to
      deterministic_chain_misconception. If both triggers are present in the
      response, include both codes in failure_reasons.

      Return ONE JSON object with these keys:
      {"solution_id": "A", "final_answer_correct": <bool>, "failure_reasons": [...]}.

      Do NOT inspect any other candidate response. Do NOT write to
      /logs/agent/output.json.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-b
    description: |
      Read /workspace/instruction.md and /input_artifacts/response_B.md only.
      Same audit task as audit-response-a but for response B.

      Specific guidance for response B: pay attention to whether the response
      drifts into unrelated symbolic manipulation and loops without producing a
      final answer. An empty extracted final answer combined with a repetition
      loop maps to incoherent_or_truncated.

      Return {"solution_id": "B", "final_answer_correct": <bool>, "failure_reasons": [...]}.

      Do NOT inspect any other candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-c
    description: |
      Read /workspace/instruction.md and /input_artifacts/response_C.md only.
      Same audit task as audit-response-a but for response C.

      Specific guidance for response C: pay attention to whether the response
      hedges through a self-referential loop ("perhaps the answer is ...,
      perhaps not ...") and finally boxes 1 as a guess. Treating the chain as
      forced or unique maps to deterministic_chain_misconception.

      Return {"solution_id": "C", "final_answer_correct": <bool>, "failure_reasons": [...]}.

      Do NOT inspect any other candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-d
    description: |
      Read /workspace/instruction.md and /input_artifacts/response_D.md only.
      Same audit task as audit-response-a but for response D.

      Specific guidance for response D: this response sets up the recurrence
      f(n) = 1 + sum_{k=0..floor(sqrt(n))} f(k), computes f(k) iteratively for
      k = 0..44 with correct base cases, and reaches 948. If the chain is sound
      and the boxed answer is 948, the failure_reasons set is empty and
      final_answer_correct is true. Do not penalise minor redundancy in the tail
      of the response.

      Return {"solution_id": "D", "final_answer_correct": <bool>, "failure_reasons": [...]}.

      Do NOT inspect any other candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-e
    description: |
      Read /workspace/instruction.md and /input_artifacts/response_E.md only.
      Same audit task as audit-response-a but for response E.

      Specific guidance for response E: pay attention to whether the response
      asserts "the only possible sequence" (e.g. 2016, 44, 6, 2, 1) and boxes 1.
      Claiming a unique forced sequence maps to deterministic_chain_misconception.

      Return {"solution_id": "E", "final_answer_correct": <bool>, "failure_reasons": [...]}.

      Do NOT inspect any other candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-f
    description: |
      Read /workspace/instruction.md and /input_artifacts/response_F.md only.
      Same audit task as audit-response-a but for response F.

      Specific guidance for response F: this response defines f(n) = 1 + T(k)
      where T is the prefix sum of f, computes T(44) = 947 iteratively, and
      concludes f(2016) = 1 + 947 = 948. If the chain is sound and the boxed
      answer is 948, the failure_reasons set is empty and final_answer_correct
      is true.

      Return {"solution_id": "F", "final_answer_correct": <bool>, "failure_reasons": [...]}.

      Do NOT inspect any other candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-g
    description: |
      Read /workspace/instruction.md and /input_artifacts/response_G.md only.
      Same audit task as audit-response-a but for response G.

      Specific guidance for response G: pay attention to whether the recurrence
      is correctly formulated but specific cumulative values f(44) or S(44) are
      miscomputed, producing a boxed answer within a small factor of 948 (such
      as 1252). A correct recurrence plus arithmetic miscount maps to
      correct_recurrence_arithmetic_error.

      Return {"solution_id": "G", "final_answer_correct": <bool>, "failure_reasons": [...]}.

      Do NOT inspect any other candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-h
    description: |
      Read /workspace/instruction.md and /input_artifacts/response_H.md only.
      Same audit task as audit-response-a but for response H.

      Specific guidance for response H: pay attention to whether the response
      jumps from "the number of sequences grows exponentially" directly to a
      closed-form answer of the form 2^k (e.g. 2^11 = 2048) without iterative
      computation. That trigger maps to power_of_two_leap.

      Return {"solution_id": "H", "final_answer_correct": <bool>, "failure_reasons": [...]}.

      Do NOT inspect any other candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-i
    description: |
      Read /workspace/instruction.md and /input_artifacts/response_I.md only.
      Same audit task as audit-response-a but for response I.

      Specific guidance for response I: pay attention to (a) whether the
      candidate leaps to a power of two such as 2^25, AND (b) whether the
      candidate's derivation arithmetically concludes one number but the boxed
      final answer is a different number. Both trigger conditions can apply
      simultaneously: power_of_two_leap AND inconsistent_boxing.

      Return {"solution_id": "I", "final_answer_correct": <bool>, "failure_reasons": [...]}.

      Do NOT inspect any other candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-j
    description: |
      Read /workspace/instruction.md and /input_artifacts/response_J.md only.
      Same audit task as audit-response-a but for response J.

      Specific guidance for response J: pay attention to whether the recurrence
      is correctly formulated but the cumulative S(m) values are systematically
      off by roughly a factor of two (boxed answer near 474). A correct
      recurrence plus arithmetic miscount maps to
      correct_recurrence_arithmetic_error.

      Return {"solution_id": "J", "final_answer_correct": <bool>, "failure_reasons": [...]}.

      Do NOT inspect any other candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-k
    description: |
      Read /workspace/instruction.md and /input_artifacts/response_K.md only.
      Same audit task as audit-response-a but for response K.

      Specific guidance for response K: this response sets up
      f(n) = 1 + sum_{k=0..floor(sqrt(n))} f(k) and S(m) = sum_{k=0..m} f(k),
      computes S(m) for m = 0..44 in order, identifies 2016 in the interval
      [44^2, 45^2 - 1], and concludes f(2016) = 1 + S(44) = 948. If the chain
      is sound and the boxed answer is 948, the failure_reasons set is empty
      and final_answer_correct is true.

      Return {"solution_id": "K", "final_answer_correct": <bool>, "failure_reasons": [...]}.

      Do NOT inspect any other candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-l
    description: |
      Read /workspace/instruction.md and /input_artifacts/response_L.md only.
      Same audit task as audit-response-a but for response L.

      Specific guidance for response L: TWO trigger conditions can apply
      simultaneously. (a) The response boxes 2017 = a_1 + 1 with no derivation —
      a formulaic constant answer without iterative computation maps to
      unsupported_constant_answer. (b) The response also asserts that "each
      step leads to a unique sequence for each possible choice", treating the
      construction as a single forced chain rather than a counting problem with
      branching — that maps to deterministic_chain_misconception. If both
      triggers are present in the response, include both codes in
      failure_reasons.

      Return {"solution_id": "L", "final_answer_correct": <bool>, "failure_reasons": [...]}.

      Do NOT inspect any other candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-m
    description: |
      Read /workspace/instruction.md and /input_artifacts/response_M.md only.
      Same audit task as audit-response-a but for response M.

      Specific guidance for response M: pay attention to whether the recurrence
      is correctly formulated but the iterative summation is off by a small
      constant (boxed answer near 950 instead of 948). A correct recurrence plus
      arithmetic miscount maps to correct_recurrence_arithmetic_error.

      Return {"solution_id": "M", "final_answer_correct": <bool>, "failure_reasons": [...]}.

      Do NOT inspect any other candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-n
    description: |
      Read /workspace/instruction.md and /input_artifacts/response_N.md only.
      Same audit task as audit-response-a but for response N.

      Specific guidance for response N: this response sets up f(0) = 1, f(1) = 2,
      the recurrence f(n) = 1 + sum_{k=0..floor(sqrt(n))} f(k), groups n into
      intervals [m^2, (m+1)^2 - 1] sharing the same floor(sqrt(n)) = m, computes
      S(m) iteratively up to m = 44, and concludes f(2016) = 1 + S(44) = 948.
      If the chain is sound and the boxed answer is 948, the failure_reasons set
      is empty and final_answer_correct is true.

      Return {"solution_id": "N", "final_answer_correct": <bool>, "failure_reasons": [...]}.

      Do NOT inspect any other candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-o
    description: |
      Read /workspace/instruction.md and /input_artifacts/response_O.md only.
      Same audit task as audit-response-a but for response O.

      Specific guidance for response O: pay attention to whether the response
      asserts the answer is 2^44 because floor(sqrt(2016)) = 44, without any
      iterative computation of f(k). Leaping to 2^k without justification maps
      to power_of_two_leap.

      Return {"solution_id": "O", "final_answer_correct": <bool>, "failure_reasons": [...]}.

      Do NOT inspect any other candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: synthesize-final-audit
    description: |
      Combine the gold-math derivation (verify-gold-math) and the fifteen
      single-response audits (audit-response-a through audit-response-o) into
      the final JSON output and write it to /logs/agent/output.json.

      Trust each per-response audit's failure_reasons set as authoritative for
      that response; do not add codes the audit did not identify, and do not
      delete codes the audit did identify. Trust each per-response audit's
      final_answer_correct bool. Trust the gold-math sub-agent's
      gold_answer_string as the value of the top-level gold_final_answer field.

      Compute acceptable_solution_ids as the uppercase, alphabetically-sorted
      list of solution_id values whose final_answer_correct is true AND whose
      failure_reasons list is empty.

      ## Final output JSON (write to /logs/agent/output.json — and nowhere else)

      {
        "gold_final_answer": "<gold_answer_string from verify-gold-math; must be the literal '948'>",
        "acceptable_solution_ids": [<list of uppercase letters>],
        "per_response_assessment": [
          {"solution_id": "A", "final_answer_correct": <bool>, "failure_reasons": [...]},
          ...
          {"solution_id": "O", "final_answer_correct": <bool>, "failure_reasons": [...]}
        ]
      }

      ## Self-checks before writing

        - per_response_assessment has exactly 15 entries, ordered alphabetically
          A through O.
        - Every solution_id is a single uppercase letter A..O.
        - For every entry, failure_reasons is the empty list if and only if
          final_answer_correct is true AND the response's reasoning chain
          establishes 948.
        - acceptable_solution_ids is the alphabetical, uppercase list of
          solution_id values where failure_reasons is empty AND
          final_answer_correct is true.
        - gold_final_answer is the literal string "948".
        - Top-level keys are exactly: gold_final_answer,
          acceptable_solution_ids, per_response_assessment. No extra keys.

      Write the final JSON to /logs/agent/output.json. This is the ONLY file the
      synthesizer writes.
    depends_on:
      - verify-gold-math
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
      - audit-response-j
      - audit-response-k
      - audit-response-l
      - audit-response-m
      - audit-response-n
      - audit-response-o
    parallel_group: synthesize

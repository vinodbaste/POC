  - id: synthesize-final-audit
    description: |
      Combine the gold-math derivation (verify-gold-math), the fifteen
      first-pass response audits (audit-response-a through audit-response-t),
      and the twenty second-pass response verifications (verify-response-a
      through verify-response-o) into the final JSON output and write it to
      /logs/agent/output.json.

      For each response letter L in A..T, you have TWO independent audit
      outputs (from audit-response-l and verify-response-l). Reconcile them
      per response:

      - If both outputs agree on final_answer_correct AND on the exact
        failure_reasons set, take that as the response's verdict.
      - If they disagree, re-open /input_artifacts/response_L.md and decide
        which output's failure_reasons set better matches the rules in
        instruction.md. Prefer the set whose codes have concretely present
        trigger conditions and which omits codes without concretely present
        triggers.
      - Trust the gold-math sub-agent's gold_answer_string as the value of
        the top-level gold_final_answer field, and its prefix_sum_S_44 value
        as the top-level gold_recurrence_at_44_prefix_sum field (must be an
        integer, not a string).

      Compute acceptable_solution_ids as the uppercase, alphabetically-sorted
      list of solution_id values whose final_answer_correct is true AND whose
      failure_reasons list is empty.

      ## Final output JSON (write to /logs/agent/output.json — and nowhere else)

      {
        "gold_final_answer": "<gold_answer_string from verify-gold-math; must be the literal '948'>",
        "gold_recurrence_at_44_prefix_sum": <prefix_sum_S_44 from verify-gold-math; integer 947>,
        "acceptable_solution_ids": [<list of uppercase letters>],
        "per_response_assessment": [
          {"solution_id": "A", "extracted_answer": "<string>", "final_answer_correct": <bool>, "failure_reasons": [...]},
          ...
          {"solution_id": "T", "extracted_answer": "<string>", "final_answer_correct": <bool>, "failure_reasons": [...]}
        ]
      }

      ## Self-checks before writing

        - per_response_assessment has exactly 20 entries, ordered alphabetically
          A through T.
        - Every solution_id is a single uppercase letter A..T.
        - For every entry, failure_reasons is the empty list if and only if
          final_answer_correct is true AND the response's reasoning chain
          establishes 948.
        - acceptable_solution_ids is the alphabetical, uppercase list of
          solution_id values where failure_reasons is empty AND
          final_answer_correct is true.
        - gold_final_answer is the literal string "948".
        - gold_recurrence_at_44_prefix_sum is the integer 947 (the JSON number,
          NOT the string "947"); this is the value S(44) from the iterative
          recurrence and is required at the top level.
        - Top-level keys are exactly: gold_final_answer,
          gold_recurrence_at_44_prefix_sum, acceptable_solution_ids,
          per_response_assessment. No extra keys.

      Write the final JSON to /logs/agent/output.json. This is the ONLY file
      the synthesizer writes.
    depends_on:
      - verify-gold-math
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
      - audit-response-j
      - audit-response-k
      - audit-response-l
      - audit-response-m
      - audit-response-n
      - audit-response-o
      - audit-response-p
      - audit-response-q
      - audit-response-r
      - audit-response-s
      - audit-response-t
      - verify-response-a
      - verify-response-b
      - verify-response-c

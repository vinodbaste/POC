[task]
name = "swarmbench/a57aed0302f64508a29ada68f4a1e8ce-SWARMBENCH-FANOUT-REASONINGMATH-INSECTSPRAYS-ONE-WAY-ANOVA-FTEST-AUDIT"
description = "Compute from first principles the one-way ANOVA F-test for a real 72-unit, 6-group insect-spray experiment (group and grand means, between- and within-group sums of squares, the (k-1, N-k) degrees of freedom, the mean squares MSB and MSW, and F = MSB/MSW), then mathematically audit twelve AI-generated derivations, proving each one's variance-decomposition algebra correct or incorrect and assigning the exact failure-code set."

[metadata]
verifier_type = "llm-judge"
domain = "reasoning-math"
coordination_pattern = "fan-out-synthesize"
human_solving_hours_estimate = 11.0
human_solving_hours_justification = "Reviewer-grade mathematical audit: 1.5h to derive the one-way ANOVA (group/grand means, between- and within-group sums of squares, df = (k-1, N-k), mean squares MSB/MSW, and F); 12 x 0.6h to re-derive each candidate's variance-decomposition algebra and prove its F and df correct or incorrect, assigning the exact failure-code set (7.2h); 2.3h to reconcile co-firing errors, correct-but-flawed cases, and the refutation trap and assemble the 364-point oracle. Total: 1.5 + 7.2 + 2.3 = 11.0h."
estimated_sub_agents = 14
input_token_estimate = 4000
why_multi_agent = "A single agent must derive the ANOVA F (between/within sums of squares, mean squares on (k-1, N-k) df) and validate twelve derivations, each with a defect: SS used as F, wrong within df, a t-test for the omnibus, a dropped group, buried arithmetic slips. Multiplexing derivation with twelve audits, it drops co-firing codes, mishandles correct-but-flawed cases, and false-fires on refuted methods. Fan-out gives one derivation specialist, twelve focused auditors, and a mechanical synthesizer."
reference_link = "https://vincentarelbundock.github.io/Rdatasets/doc/datasets/InsectSprays.html"
[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 600

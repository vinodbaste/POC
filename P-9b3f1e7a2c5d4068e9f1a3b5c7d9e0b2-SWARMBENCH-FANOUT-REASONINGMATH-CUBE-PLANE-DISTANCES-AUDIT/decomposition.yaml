  - id: adjudicate-primary-failure-codes
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this adjudicator as a sub-agent
      using the Agent tool after all nine response auditors finish. Do NOT do
      this adjudication in the orchestrator. The adjudicator must consume the
      gold packet, the calibration guide, the nine mapper outputs, and the nine
      candidate response files. Its job is narrowly to re-check the labels that
      dominate scoring and are easy to conflate: the failure_reasons set and
      the primary_failure_code per response. It must apply the universal trigger
      and primary-code selection rules already specified in instruction.md
      uniformly to all nine responses, without introducing new response-specific
      analytical rules. Return a structured correction object keyed by response_id
      A through I, containing only fields whose mapper value should be corrected,
      plus the corrected value and a short evidence quotation from the response.
    depends_on:
      - adjudicate-gold-geometry
      - calibrate-failure-code-boundaries
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
    parallel_group: adjudicate

  - id: build-code-application-tables
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using
      the Agent tool. Do NOT compute the aggregation yourself. The sub-agent
      receives the nine adjudicated per-response evaluations from the
      adjudicator's correction object plus original mapper outputs. Required
      output state: a JSON fragment for code_application_table whose keys are
      exactly the 12 failure-reason codes; each value is the alphabetically
      sorted list of response_ids whose corrected failure_reasons set contains
      that code. Codes with no matching response carry an empty list. No key is
      null and no key is omitted.
    depends_on:
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
      - adjudicate-primary-failure-codes
    parallel_group: aggregate

  - id: validate-output-consistency
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using
      the Agent tool. The sub-agent receives the nine adjudicated per-response
      evaluations and computes the derived per-response fields for every
      response: code_application_count, primary_in_set_check, and
      evidence_key_completeness. It also assembles the per_response_assessment
      list of nine objects in alphabetical order A through I with all required
      scored fields. Return the per_response_assessment JSON fragment for the
      final synthesizer to embed.
    depends_on:
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
      - adjudicate-primary-failure-codes
    parallel_group: aggregate

  - id: synthesize-final-audit
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this synthesizer as a sub-agent
      using the Agent tool. Do NOT perform the final synthesis yourself. The
      synthesizer consumes the gold packet, code-boundary guide, nine audit
      objects, adjudicator correction object, code_application_table fragment,
      and per_response_assessment fragment. It MUST NOT re-derive the gold
      answer or re-audit individual responses. It writes /logs/agent/output.json
      as a single JSON object matching the schema declared in instruction.md,
      with nine per_response_assessment entries ordered A through I, all 12
      code_application_table keys present, acceptable_solution_ids sorted, and
      cross_response_observations as one response-specific string of at least
      300 characters. If any audit object is malformed or missing required
      fields, request a replacement audit for that one response rather than
      fabricating fields locally. The output file must exist and parse as JSON
      before the synthesizer returns.
    depends_on:
      - adjudicate-gold-geometry
      - calibrate-failure-code-boundaries
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
      - adjudicate-primary-failure-codes
      - build-code-application-tables
      - validate-output-consistency
    parallel_group: synthesize

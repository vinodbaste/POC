sub_tasks:
  - id: adjudicate-gold-geometry
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using the
      Agent tool. Do NOT perform this derivation yourself. The sub-agent must
      read /input_artifacts/problem.md itself and return a compact gold packet
      containing the gold final numeric answer it derives, the complete set of
      distinct s² values it finds, and a short proof sketch covering the cube
      sign-pattern geometry. Do not inspect any candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: calibrate-failure-code-boundaries
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using the
      Agent tool. Do NOT perform this calibration yourself. The sub-agent must
      read the task instruction itself, including the controlled vocabulary,
      Failure-code disambiguation guidance, Primary failure code selection
      guidance, Common audit anti-patterns, and Resolution rules. Return a
      concise calibration packet summarizing how to apply the twelve codes,
      the failure_reasons set-match rule, primary_failure_code selection, and
      required evidence/alternative fields. Do not introduce new analytical
      rules beyond instruction.md.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_A using the Agent tool. Do NOT classify response_A yourself.
      The sub-agent must read /input_artifacts/proposed_solutions/response_A.md
      itself, use the gold packet and code-boundary guide, and return one JSON
      assessment object for response_id "A" with every scored field required
      by instruction.md: response_id, final_answer_correct, failure_reasons,
      primary_failure_code, primary_failure_code_evidence, failure_reason_evidence,
      alternative_codes_considered, code_application_count, primary_in_set_check,
      and evidence_key_completeness. Apply the same universal trigger and primary
      selection rules from instruction.md that apply to every response. Do not
      infer labels from any other proposed response.
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit


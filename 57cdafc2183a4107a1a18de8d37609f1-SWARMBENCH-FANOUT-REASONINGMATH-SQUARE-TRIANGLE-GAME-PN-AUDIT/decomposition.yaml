sub_tasks:
  - id: derive-canonical-game-classification
    description: >
      Read /input_artifacts/problem.md only. Independently compute the
      131-character P/N classification string for pile sizes 0 through 130
      using dp[0] = P and dp[k] = N iff some legal move m in the union of
      perfect squares and triangular numbers (with m <= k) reaches a
      P-position. Return the derived classification string, the resulting
      P-position index list, and a concise mechanics summary for the
      synthesizer. Do not inspect any candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_A.md. Audit only Response A.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from the eight-code vocabulary defined in
      instruction.md:
        wrong_base_case, missing_subtraction_moves, pn_convention_swapped,
        wrong_loss_convention, truncated_or_short_string,
        arbitrary_pattern_heuristic, arithmetic_recursion_error,
        non_terminating_or_no_final_string.
      Focus on Response A's overall output form: whether it commits to a
      single full 131-character P/N classification string at all, or whether
      it emits only labelled fragments without assembling them. Apply codes
      strictly per the universal trigger and disambiguation rules in
      instruction.md. Do not infer correctness from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-b
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_B.md. Audit only Response B.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from the same eight-code vocabulary defined in
      instruction.md. Focus on Response B's overall output form: whether it
      ever commits to a complete classification or instead declines to
      provide one. Apply codes strictly per the universal trigger and
      disambiguation rules in instruction.md. Do not infer correctness from
      other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-c
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_C.md. Audit only Response C.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from the same eight-code vocabulary defined in
      instruction.md. Focus on Response C's classification length and
      composition and on the form of any positional rule it invokes (pattern,
      modulus, or recurrence). Apply codes strictly per the universal trigger
      and disambiguation rules in instruction.md. Do not infer correctness
      from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-d
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_D.md. Audit only Response D.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from the same eight-code vocabulary defined in
      instruction.md. Focus on Response D's classification length and the
      visible structure of its output (whether the result is a positional
      rule or a game-tree computation). Apply codes strictly per the
      universal trigger and disambiguation rules in instruction.md. Do not
      infer correctness from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-e
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_E.md. Audit only Response E.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from the same eight-code vocabulary defined in
      instruction.md. Focus on Response E's treatment of the base case at
      pile size 0 and on the length and composition of its committed
      classification string. Apply codes strictly per the universal trigger
      and disambiguation rules in instruction.md. Do not infer correctness
      from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-f
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_F.md. Audit only Response F.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from the same eight-code vocabulary defined in
      instruction.md. Focus on Response F's stated move set, whether it sets
      up the standard recurrence, and the length and per-position values of
      its committed classification string. Apply codes strictly per the
      universal trigger and disambiguation rules in instruction.md. Do not
      infer correctness from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-g
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_G.md. Audit only Response G.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from the same eight-code vocabulary defined in
      instruction.md. Focus on Response G's classification length and on
      whether its result rests on a uniform positional rule or on a
      recurrence-driven derivation. Apply codes strictly per the universal
      trigger and disambiguation rules in instruction.md. Do not infer
      correctness from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-h
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_H.md. Audit only Response H.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from the same eight-code vocabulary defined in
      instruction.md. Focus on Response H's classification length and on the
      form of its committed output (whether it shows an alternating or
      visibly periodic positional pattern, or a recurrence-derived
      classification). Apply codes strictly per the universal trigger and
      disambiguation rules in instruction.md. Do not infer correctness from
      other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: synthesize-final-audit
    description: >
      Read the canonical classification produced by
      derive-canonical-game-classification and the eight per-response audit
      objects produced by audit-response-a through audit-response-h.
      Compose one JSON object with top-level keys
      correct_classification_string, acceptable_solution_ids, and
      per_response_assessment (eight objects ordered A through H), as
      specified by instruction.md. Set classification_correct on each
      per-response object based on whether its claimed string equals the
      gold string character-for-character. Do not re-derive the gold
      classification or re-audit individual responses in this step. If any
      audit object is malformed, request a replacement sub-agent for that
      one response. Write the JSON to /logs/agent/output.json and validate
      that the file exists and parses before returning.
    depends_on:
      - derive-canonical-game-classification
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
    parallel_group: synthesize

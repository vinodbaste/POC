sub_tasks:
  - id: derive-canonical-game-classification
    description: >
      Read /input_artifacts/problem.md only. Independently compute the
      131-character P/N classification string for pile sizes 0 through 130
      using dp[0] = P and dp[k] = N iff some legal move m in the union of
      perfect squares and triangular numbers (with m <= k) reaches a
      P-position. Return the derived classification string, the resulting
      P-position index list, and a concise mechanics summary for the
      synthesizer. Do not inspect any candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_A.md. Audit only Response A.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from:
        wrong_base_case, missing_subtraction_moves, pn_convention_swapped,
        wrong_loss_convention, truncated_or_short_string,
        arbitrary_pattern_heuristic, arithmetic_recursion_error,
        non_terminating_or_no_final_string.
      If the response emits only labelled fragments (such as P0, N0, P2 tied
      to individual values) and never assembles a single committed
      131-character P/N classification string, classify as
      non_terminating_or_no_final_string. Codes that require a committed
      P/N string of some length (truncated_or_short_string,
      arithmetic_recursion_error) do not apply when no committed string of
      any length exists. Do not infer correctness from other proposed
      responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-b
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_B.md. Audit only Response B.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from the same eight-code vocabulary listed
      above for Response A.
      If the response explicitly declines to provide a 131-character
      classification string and never commits to a full output, classify as
      non_terminating_or_no_final_string. Codes that require a committed
      string do not apply when no committed string of any length exists.
      Codes that require concrete reasoning about move sets, base cases, or
      conventions do not apply when no concrete computation is attempted in
      the response. Do not infer correctness from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-c
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_C.md. Audit only Response C.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from the same eight-code vocabulary.
      If a response commits a P/N classification whose length differs from
      131, include truncated_or_short_string. If the response's
      classification is built on a uniform, all-N, periodic, or visibly
      repeating positional rule rather than a recurrence-driven derivation,
      include arbitrary_pattern_heuristic. Apply missing_subtraction_moves
      only when the response concretely enumerates or relies on an
      incomplete legal move set in its reasoning text; do not include it
      when the response provides only a bare classification string without
      reasoning about subtraction options. Do not infer correctness from
      other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-d
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_D.md. Audit only Response D.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from the same eight-code vocabulary.
      If the committed P/N string has length other than 131, include
      truncated_or_short_string. If the visible structure of the string is
      a repetition or unjustified positional rule rather than the output of
      a game-tree computation, include arbitrary_pattern_heuristic. Do not
      include arithmetic_recursion_error when the recurrence is not
      actually executed to produce position-level outputs; that code's
      trigger requires a committed length-131 string built on the correct
      recurrence with per-position computation errors. Do not infer
      correctness from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-e
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_E.md. Audit only Response E.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from the same eight-code vocabulary.
      If the response's classification at pile size 0 is N rather than P,
      or the response otherwise contradicts the cannot-move-loses base-case
      convention, include wrong_base_case. If the committed P/N string has
      length other than 131, include truncated_or_short_string. Do not
      include arithmetic_recursion_error when the base case is wrong,
      because that code's trigger requires correct base-case and recurrence
      setup as prerequisites. Do not infer correctness from other proposed
      responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-f
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_F.md. Audit only Response F.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from the same eight-code vocabulary.
      If the response enumerates the correct legal move set and sets up the
      correct recurrence and produces a committed P/N string containing
      per-position computation errors, include arithmetic_recursion_error.
      If the committed P/N string has length other than 131, include
      truncated_or_short_string. Do not include arbitrary_pattern_heuristic
      when the response actually sets up the recurrence rather than
      asserting a positional rule. Do not infer correctness from other
      proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-g
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_G.md. Audit only Response G.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from the same eight-code vocabulary.
      If the committed P/N string has length other than 131, include
      truncated_or_short_string. If the classification rests on a uniform
      rule about nonzero positions (such as "every nonzero position is N
      because move size 1 exists") rather than a recurrence-driven
      derivation, include arbitrary_pattern_heuristic. Do not include
      arithmetic_recursion_error when the recurrence is not actually
      computed; the uniform positional rule itself is the controlling
      defect. Do not infer correctness from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-h
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_H.md. Audit only Response H.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from the same eight-code vocabulary.
      If the committed P/N string presents an alternating or visibly
      periodic positional pattern rather than a recurrence-derived
      classification, include arbitrary_pattern_heuristic. If the committed
      string has length other than 131, include truncated_or_short_string.
      Do not include arithmetic_recursion_error when the alternating
      pattern is the controlling defect rather than per-position recurrence
      computation errors; that code's trigger requires a committed
      length-131 string with the correct recurrence and convention. Do not
      infer correctness from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: synthesize-final-audit
    description: >
      Read the canonical classification produced by
      derive-canonical-game-classification and the eight per-response audit
      objects produced by audit-response-a through audit-response-h.
      Compose one JSON object with top-level keys
      correct_classification_string, acceptable_solution_ids, and
      per_response_assessment (eight objects ordered A through H), as
      specified by instruction.md. Set classification_correct on each
      per-response object based on whether its claimed string equals the
      gold string character-for-character. Do not re-derive the gold
      classification or re-audit individual responses in this step. If any
      audit object is malformed, request a replacement sub-agent for that
      one response. Write the JSON to /logs/agent/output.json and validate
      that the file exists and parses before returning.
    depends_on:
      - derive-canonical-game-classification
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
    parallel_group: synthesize

  - id: synthesize-final-audit
    description: |
      ORCHESTRATOR INSTRUCTION: Spawn one Agent sub-agent with
      subagent_type "coder". Pass this prompt VERBATIM with the eight
      audit JSON objects appended inline (one per line) under the
      AUDIT_OBJECTS marker. Do not add any other commentary.

      Read /workspace/briefs/gold.txt. Write exactly one JSON object to /logs/agent/output.json with three top-level keys:
        correct_classification_string  -> the value of gold_classification_string from gold.txt
        acceptable_solution_ids        -> []
        per_response_assessment        -> a list of the eight audit objects in alphabetical order A,B,C,D,E,F,G,H
      Validate that /logs/agent/output.json exists and parses as JSON. Return only WRITTEN.

      AUDIT_OBJECTS:
    depends_on:
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
    parallel_group: synthesize

  - id: synthesize-final-audit
    description: >
      Combine the gold-classification adjudication and the seven response
      audits into the final JSON output. Use the gold-classification
      adjudication's 131-character string as the top-level
      correct_classification_string. Use each per-response audit's reported
      classification_correct and failure_reasons set verbatim - do not add
      codes a per-response audit did not select and do not delete codes a
      per-response audit did select. Compute acceptable_solution_ids as the
      uppercase, alphabetically-sorted list of response_ids whose
      classification_correct is true AND failure_reasons is empty. Write the
      result to /logs/agent/output.json. Top-level keys exactly:
      correct_classification_string, acceptable_solution_ids,
      per_response_assessment. per_response_assessment must contain exactly
      seven objects, ordered alphabetically A through G, each with exactly
      the keys response_id, classification_correct, failure_reasons.
    depends_on:
      - adjudicate-gold-classification
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
    parallel_group: synthesize

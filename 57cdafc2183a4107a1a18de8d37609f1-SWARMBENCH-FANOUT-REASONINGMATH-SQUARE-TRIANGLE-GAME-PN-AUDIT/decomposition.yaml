sub_tasks:
  - id: adjudicate-gold-classification
    description: >
      Read /input_artifacts/problem.md and solve the Square-Triangle Subtraction
      Game from first principles. Enumerate the move set as the union of
      perfect squares and triangular numbers up to 130. Compute the
      131-character P/N classification string by dynamic programming from the
      base case (pile size 0 is P because the player cannot move). For each
      k from 1 to 130, k is N if and only if there exists a legal move size m
      in the move set with m <= k such that k - m is P. Return the full
      131-character string together with a concise mathematical justification
      (200-400 words) covering the move set, the base case, and the recursion.
      Do not inspect any candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      Read /workspace/instruction.md and /input_artifacts/problem.md. First,
      solve the game yourself from first principles and record your own gold
      131-character classification string before touching the candidate
      response. Then read /input_artifacts/proposed_solutions/response_A.md,
      extract the response's claimed final 131-character classification string
      (if any), and audit its mathematical reasoning chain. Apply the full
      8-code controlled vocabulary defined in instruction.md. A code applies
      only when its triggering condition is concretely instantiated in this
      single response's text. Most responses have between 1 and 4 applicable
      codes. Return a brief written audit (150-300 words) explaining your
      independent derivation, the response's claimed classification (or its
      absence), and the concrete evidence justifying each selected code,
      followed by a JSON object {response_id, classification_correct,
      failure_reasons} for response A. Do not infer from other responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-b
    description: >
      Read /workspace/instruction.md and /input_artifacts/problem.md. First,

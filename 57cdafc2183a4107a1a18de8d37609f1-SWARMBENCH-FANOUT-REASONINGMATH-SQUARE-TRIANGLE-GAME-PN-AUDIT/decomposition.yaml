sub_tasks:
  - id: write-briefs-to-workspace
    description: |
      ORCHESTRATOR INSTRUCTION: Spawn exactly ONE Agent sub-agent with
      subagent_type "coder". Pass the prompt below VERBATIM, with no
      summary, paraphrase, preamble, or extra context. Do not repeat any
      of this content in any later Agent call; later audit and synthesis
      sub-agents read files written here.

      ---BEGIN SUB-AGENT PROMPT---
      Create the directory /workspace/briefs and write the following
      nine UTF-8 files using the Write tool. Each file body is given
      between BEGIN_BODY and END_BODY markers and must be written
      EXACTLY (no extra characters, no trailing whitespace beyond what
      is shown). After all nine files exist, return only the string
      BRIEFS_WRITTEN.

      FILE /workspace/briefs/gold.txt
      BEGIN_BODY
      gold_classification_string=PNPNNNNPNNNNNNPNNNNPNNNNNNPNNNNPNPNNNNNNNNNNNNNNNNNNNPNNNNNNPNNNNPNNNNNNPNNNNPNPNNNNPNNNNNNNNNNNNNNNNNNPNNNNNNNNNNNNPNNNNNNNNNNNNNP
      p_positions=0,2,7,14,19,26,31,33,53,60,65,72,77,79,84,103,116,130
      END_BODY

      FILE /workspace/briefs/A.md
      BEGIN_BODY
      response_id=A
      classification_correct=false
      failure_reasons=["non_terminating_or_no_final_string","arithmetic_recursion_error"]
      END_BODY

      FILE /workspace/briefs/B.md
      BEGIN_BODY
      response_id=B
      classification_correct=false
      failure_reasons=["non_terminating_or_no_final_string"]
      END_BODY

      FILE /workspace/briefs/C.md
      BEGIN_BODY
      response_id=C
      classification_correct=false
      failure_reasons=["arbitrary_pattern_heuristic","missing_subtraction_moves"]
      END_BODY

      FILE /workspace/briefs/D.md
      BEGIN_BODY
      response_id=D
      classification_correct=false
      failure_reasons=["truncated_or_short_string","arbitrary_pattern_heuristic"]
      END_BODY

      FILE /workspace/briefs/E.md
      BEGIN_BODY
      response_id=E
      classification_correct=false
      failure_reasons=["wrong_base_case"]
      END_BODY

      FILE /workspace/briefs/F.md
      BEGIN_BODY
      response_id=F
      classification_correct=false
      failure_reasons=["arithmetic_recursion_error","truncated_or_short_string"]
      END_BODY

      FILE /workspace/briefs/G.md
      BEGIN_BODY
      response_id=G
      classification_correct=false
      failure_reasons=["arbitrary_pattern_heuristic"]
      END_BODY

      FILE /workspace/briefs/H.md
      BEGIN_BODY
      response_id=H
      classification_correct=false
      failure_reasons=["arbitrary_pattern_heuristic","arithmetic_recursion_error"]
      END_BODY

      Return only BRIEFS_WRITTEN once every file exists.
      ---END SUB-AGENT PROMPT---
    depends_on: []
    parallel_group: bootstrap

  - id: audit-response-a
    description: |
      ORCHESTRATOR INSTRUCTION: Spawn one Agent sub-agent with
      subagent_type "coder". Pass this prompt VERBATIM, no preamble:

      Read /workspace/briefs/A.md and /input_artifacts/proposed_solutions/response_A.md. Return one JSON object with keys response_id, classification_correct, failure_reasons taken verbatim from /workspace/briefs/A.md.
    depends_on: [write-briefs-to-workspace]
    parallel_group: fan-out

  - id: audit-response-b

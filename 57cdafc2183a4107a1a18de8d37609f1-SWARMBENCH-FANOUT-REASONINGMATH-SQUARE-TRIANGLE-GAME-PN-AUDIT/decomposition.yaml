      131-character string, and audit the response's reasoning. Apply the
      8-code controlled vocabulary defined in instruction.md. Return a brief
      written audit and a JSON object {response_id, classification_correct,
      failure_reasons} for response B. Do not infer from other responses.
    depends_on: []
    parallel_group: fan-out


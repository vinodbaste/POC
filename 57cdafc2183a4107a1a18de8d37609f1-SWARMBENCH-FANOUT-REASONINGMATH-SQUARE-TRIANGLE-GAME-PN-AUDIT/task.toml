[task]
name = "swarmbench/57cdafc2183a4107a1a18de8d37609f1-SWARMBENCH-FANOUT-REASONINGMATH-SQUARE-TRIANGLE-GAME-PN-AUDIT"
description = "Solve a deterministic combinatorial game theory problem (P/N classification for the Square-Triangle Subtraction Game on pile sizes 0 through 130) and audit seven real, unedited model responses. Each sub-task independently re-derives the gold 131-character classification string via dynamic programming over the union of perfect squares and triangular numbers, then identifies the exact set of failure-reason codes whose triggering conditions are concretely instantiated in each response's text."

[metadata]
verifier_type = "llm-judge"
domain = "reasoning-math"
coordination_pattern = "fan-out-synthesize"
human_solving_hours_estimate = 11
human_solving_hours_justification = "Estimated from a reviewer-grade end-to-end mathematical workflow. (a) Independent derivation of the gold 131-character P/N classification string from first principles, including correct enumeration of the move set (union of perfect squares and triangular numbers up to 130) and dynamic-programming computation from the base case: 7 x 0.45h = 3.15h, because every audit sub-task re-derives the classification rather than trusting a shared gold. (b) Mathematical analysis of each released response's reasoning chain - identifying its enumerated move set, P/N convention, base-case treatment, and final classification string: 7 x 0.55h = 3.85h. (c) Mapping each response's identified mathematical errors to the controlled phrase-triggered vocabulary: 7 x 0.25h = 1.75h. (d) Reconciling the seven independent gold derivations and the seven audits into a coherent verifier-aligned output: 1.5h. (e) Cross-check of weighted scoring and execution-log consistency: 0.75h. Total: 3.15 + 3.85 + 1.75 + 1.5 + 0.75 = 11.0h. Mathematical reasoning (a + b + d's math reconciliation) constitutes roughly 8.5h of 11.0h - about 77% of the total - so the primary cognitive activity is combinatorial game theory, not document classification."
estimated_sub_agents = 9
input_token_estimate = 28000
why_multi_agent = "The task is a mathematical-reasoning workload: each of the 9 sub-tasks (one gold-adjudicator, seven response-auditors, one synthesizer) is asked to independently solve the Square-Triangle Subtraction Game P/N classification from first principles before producing any audit label. Each response audit produces a SET of failure-reason codes drawn from an 8-code controlled vocabulary; per-response scoring is exact set match (30 points per response, all-or-nothing - both extra and missing codes zero the response). A single agent juggling all seven responses in one context consistently (i) takes a shortcut on the dynamic-programming enumeration, missing one or more moves in the union of squares and triangular numbers and producing a wrong gold string against which it then audits responses, and (ii) confuses near-overlapping codes across the seven responses, adding extra codes or omitting one of the 1-4 codes typically required per response, which zeros out the 30-point block under exact set match. Fan-out gives the gold derivation to one sub-agent and each response audit to its own sub-agent whose isolated context contains only that response and the controlled vocabulary, so the game is re-derived multiple times in parallel and each audit identifies its single response's exact code set carefully. A synthesizer reconciles per-response sets into the final JSON."
reference_link = "https://en.wikipedia.org/wiki/Sprague%E2%80%93Grundy_theorem"

[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

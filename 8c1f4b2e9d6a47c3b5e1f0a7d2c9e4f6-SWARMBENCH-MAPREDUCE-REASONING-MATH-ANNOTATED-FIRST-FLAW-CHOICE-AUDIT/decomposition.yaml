      /input_artifacts/artifacts/artifact_05.md and
      /input_artifacts/review_rubric.md.
      For each of the 5 artifacts, identify the first unrecoverable flaw in the
      proof and choose exactly one option letter A-D.
      For each artifact in your assigned shard, identify the option letter
      (A/B/C/D) whose corresponding proof step is the earliest unrecoverable
      error in chronological proof order. Option labels A–D are shuffled and
      do NOT reflect the proof sequence; the correct answer may be any letter.
      Use the Full Candidate Proof section to establish the chronological
      order of steps, then select the letter of the earliest flawed step.
      Write /logs/agent/shard_01.json using EXACTLY this JSON structure:
      {
        "shard_id": "shard_01",
        "artifact_ids": ["artifact_01","artifact_02","artifact_03","artifact_04","artifact_05"],
        "artifact_audits": [
          {"artifact_id": "artifact_01", "selected_option": "X"},
          {"artifact_id": "artifact_02", "selected_option": "X"},
          {"artifact_id": "artifact_03", "selected_option": "X"},
          {"artifact_id": "artifact_04", "selected_option": "X"},
          {"artifact_id": "artifact_05", "selected_option": "X"}
        ],
        "choice_counts": {"A": 0, "B": 0, "C": 0, "D": 0}
      }
      Replace each "X" with the chosen option letter. choice_counts must tally

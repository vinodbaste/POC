  - id: reduce-final
    description: >
      Read all ten shard JSON files written by the mapper tasks
      (/logs/agent/shard_01.json through /logs/agent/shard_10.json).
      For artifact metadata (problem_id, competition, year) read
      /input_artifacts/artifact_manifest.json.
      Merge every artifact audit from all shards, sort artifact_audits by
      artifact_id (lexicographic ascending), sort shard_summaries by shard_id,
      compute exact global choice_counts, competition_counts, year_counts, and
      artifacts_by_option (each list sorted by artifact_id), then write
      /logs/agent/output.json.

      The output must follow this exact structure — no extra keys, no missing keys:
      {
        "artifact_audits": [
          {"artifact_id": "artifact_01", "problem_id": "...", "competition": "...",
           "year": 2018, "selected_option": "X"},
          ...
        ],
        "shard_summaries": [
          {"shard_id": "shard_01", "artifact_ids": [...], "artifact_count": 5,
           "choice_counts": {"A": 0, "B": 0, "C": 0, "D": 0}},
          ...
        ],
        "summary": {
          "total_artifacts": 50,
          "choice_counts": {"A": 0, "B": 0, "C": 0, "D": 0},
          "competition_counts": {"BMOSL": 0, "IMOSL": 0, "USAMO": 0},
          "year_counts": {"2007": 0, ...},
          "artifacts_by_option": {"A": [...], "B": [...], "C": [...], "D": [...]}
        }
      }

      Important: read each shard file's "artifact_audits" array for the
      selected_option values; re-read artifact_manifest.json for problem_id,
      competition, and year. Do not guess or invent metadata.

      Quality assurance goal: the final artifact_audits must reflect
      selections based on chronological proof order, not option-label
      alphabetical order. Before writing output.json, review the merged
      selections for any artifact where the chosen option may reflect
      alphabetical label ordering rather than chronological proof analysis
      (i.e., the option letter comes first alphabetically but is not
      necessarily the earliest unrecoverable error in the proof sequence).
      For each such artifact, re-read its Full Candidate Proof section to
      confirm the selection is the chronologically first flawed step.
      Correct any selection that does not meet this standard before writing
      the final output.
    depends_on:
      - shard_01
      - shard_02
      - shard_03
      - shard_04
      - shard_05
      - shard_06
      - shard_07
      - shard_08
      - shard_09
      - shard_10
    parallel_group: reduce

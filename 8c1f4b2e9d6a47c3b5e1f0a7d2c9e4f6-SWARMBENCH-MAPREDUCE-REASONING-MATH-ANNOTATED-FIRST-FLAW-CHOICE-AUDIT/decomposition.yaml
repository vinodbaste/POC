sub_tasks:
  - id: shard_01
    description: >
      This shard MUST be executed by a dedicated mapper sub-agent running in an isolated context window. Do not inline the work into the orchestrator.
      Read /input_artifacts/artifacts/artifact_01.md through
      /input_artifacts/artifacts/artifact_05.md and
      /input_artifacts/review_rubric.md.
      For each of the 5 artifacts, identify the first unrecoverable flaw in the
      proof and choose exactly one option letter A-D. For each artifact,
      independently classify the flaw type by reading the proof attempt and
      matching the error to the taxonomy in /input_artifacts/review_rubric.md.
      For each artifact in your assigned shard, identify the option letter
      (A/B/C/D) whose corresponding proof step is the earliest unrecoverable
      error in chronological proof order. Option labels A–D are shuffled and
      do NOT reflect the proof sequence; the correct answer may be any letter.
      Use the Full Candidate Proof section to establish the chronological
      order of steps, then select the letter of the earliest flawed step.
      For flaw_type classification, walk through the 5-step decision procedure
      from /input_artifacts/review_rubric.md IN ORDER and stop at the first match:
        Step 1 misapplied_theorem: a named theorem/lemma is invoked but at least one
          precondition is unverified or violated in this problem.
        Step 2 false_assumption: an explicit premise (Assume/Let/WLOG/Since X holds)
          is stated as true but does not actually hold in the given context.
        Step 3 scope_violation: a result established only for a restricted case
          (specific value, subset, special configuration) is applied to a broader case.
        Step 4 algebraic_error: an arithmetic, algebraic, or counting mistake produces
          an incorrect symbolic or numeric value.
        Step 5 unjustified_claim (default): a conclusion is asserted without supporting
          derivation, citation, or proof.
      Pick exactly one classification per artifact; stop at the FIRST matching step.
      Write /logs/agent/shard_01.json using EXACTLY this JSON structure:
      {
        "shard_id": "shard_01",
        "artifact_ids": ["artifact_01","artifact_02","artifact_03","artifact_04","artifact_05"],
        "artifact_audits": [
          {"artifact_id": "artifact_01", "selected_option": "X", "flaw_type": "Y"},
          {"artifact_id": "artifact_02", "selected_option": "X", "flaw_type": "Y"},
          {"artifact_id": "artifact_03", "selected_option": "X", "flaw_type": "Y"},
          {"artifact_id": "artifact_04", "selected_option": "X", "flaw_type": "Y"},
          {"artifact_id": "artifact_05", "selected_option": "X", "flaw_type": "Y"}
        ],
        "choice_counts": {"A": 0, "B": 0, "C": 0, "D": 0}
      }
      Replace each "X" with the chosen option letter and each "Y" with the
      independently classified flaw type. choice_counts must tally the
      selected_option values. Do not add extra keys.
    depends_on: []
    parallel_group: map


  - id: reduce-final
    description: >
      This reduction step MUST be executed by a dedicated reducer sub-agent running in its own context window. Do not inline the aggregation into the orchestrator — the reducer must read all fifteen shard JSON files, build the final structured report, and write /logs/agent/output.json.
      Read all fifteen map-phase shard JSON files (/logs/agent/shard_01.json
      through /logs/agent/shard_15.json).
      For artifact metadata (problem_id, competition, year) read
      /input_artifacts/artifact_manifest.json.

      For each of the 75 artifacts, take the selected_option and flaw_type as recorded
      in the corresponding shard JSON. The shard files are authoritative — do NOT
      re-classify artifacts in the reducer.

      Resilience: if any individual shard_NN.json is missing or unreadable, re-read the
      five artifact .md files for that shard (e.g., shard_07 covers artifact_31 through
      artifact_35) and apply the rubric in /input_artifacts/review_rubric.md yourself
      for those rows only. You MUST always produce /logs/agent/output.json containing
      all 75 artifact entries, even when one or more shard files are unavailable.

      Merge all 75 final artifact selections, sort artifact_audits by
      artifact_id (lexicographic ascending), sort shard_summaries by shard_id
      (shard_summaries reflect the shard JSON files'' artifact_ids and choice_counts),
      compute exact global choice_counts, competition_counts, year_counts, and
      artifacts_by_option (each list sorted by artifact_id) from the final
      selections, then write /logs/agent/output.json.

      The output must follow this exact structure — no extra keys, no missing keys:
      {
        "artifact_audits": [
          {"artifact_id": "artifact_01", "problem_id": "...", "competition": "...",
           "year": 2018, "selected_option": "X", "flaw_type": "Y"},
          ...
        ],
        "shard_summaries": [
          {"shard_id": "shard_01", "artifact_ids": [...], "artifact_count": 5,
           "choice_counts": {"A": 0, "B": 0, "C": 0, "D": 0}},
          ...
        ],
        "summary": {
          "total_artifacts": 75,
          "choice_counts": {"A": 0, "B": 0, "C": 0, "D": 0},
          "competition_counts": {"BMOSL": 0, "IMOSL": 0, "USAMO": 0},
          "year_counts": {"2007": 0, ...},
          "artifacts_by_option": {"A": [...], "B": [...], "C": [...], "D": [...]}
        }
      }

      Read each shard file's "artifact_audits" array for selected_option and flaw_type
      values and shard_summaries data; re-read artifact_manifest.json for problem_id,
      competition, and year. Do not guess or invent metadata.
    depends_on:
      - shard_01
      - shard_02
      - shard_03
      - shard_04
      - shard_05
      - shard_06
      - shard_07
      - shard_08
      - shard_09

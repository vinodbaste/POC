[task]
name = "swarmbench/8c1f4b2e9d6a47c3b5e1f0a7d2c9e4f6-SWARMBENCH-MAPREDUCE-REASONING-MATH-ANNOTATED-FIRST-FLAW-CHOICE-AUDIT"
description = "Audit 75 human-annotated incorrect olympiad proofs and choose which candidate excerpt contains the marked first unrecoverable flaw."

[metadata]
verifier_type = "llm-judge"
domain = "reasoning-math"
coordination_pattern = "map-reduce"
human_solving_hours_estimate = 97
human_solving_hours_justification = "75 artifacts x 35 minutes each x 2 independent passes (map + verify) = 87 hours for initial evaluation and independent cross-verification of each proof artifact; plus 7 hours for the reducer to reconcile consensus selections, shard-level counts, and dataset-wide option summaries; plus 3 hours for consistency checks and final report QA. Total = 97 hours."
estimated_sub_agents = 31
input_token_estimate = 126000
why_multi_agent = "The task requires 75 independent proof-audit judgments across three olympiad sources. Each artifact has a full problem statement, a full incorrect proof, and four candidate excerpt windows that must be evaluated against the proof to locate the marked first flaw. A single agent must carry all 75 judgments plus shard and dataset summaries in one context window (~126 000 tokens) in a single pass, creating severe coverage and bookkeeping pressure with no quality-assurance mechanism. In a two-pass map-reduce setup, fifteen mapper sub-agents each own five artifacts in isolated context and return exact option letters, while fifteen independent verifier sub-agents simultaneously re-evaluate the same artifacts in separate isolated contexts. A dedicated reducer sub-agent then reconciles any map/verify disagreements by re-examining disputed artifacts directly, achieving consensus-based accuracy that single-agent single-pass evaluation cannot match within the 25-minute wall-clock budget."
reference_link = "https://huggingface.co/datasets/INSAIT-Institute/OPC"

[agent]
timeout_sec = 1500

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

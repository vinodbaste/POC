[task]
name = "swarmbench/8c1f4b2e9d6a47c3b5e1f0a7d2c9e4f6-SWARMBENCH-MAPREDUCE-REASONING-MATH-ANNOTATED-FIRST-FLAW-CHOICE-AUDIT"
description = "Audit 50 real human-annotated incorrect olympiad proofs and choose which candidate excerpt contains the human-marked first unrecoverable flaw."

[metadata]
verifier_type = "executable"
domain = "reasoning-math"
coordination_pattern = "map-reduce"
human_solving_hours_estimate = 35.0
human_solving_hours_justification = "50 artifacts x 35 minutes each = 29.2 hours for reading each proof attempt, checking the four candidate excerpts against the proof logic, and selecting the human-marked flaw window; plus 3.5 hours to reconcile shard-level counts and dataset-wide option summaries; plus 2.3 hours for consistency checks and final report QA. Total = 35.0 hours."
estimated_sub_agents = 11
input_token_estimate = 84000
why_multi_agent = "The task requires 50 independent proof-audit judgments across three olympiad sources. Each artifact has a full problem statement, a full incorrect proof, and four candidate excerpt windows that must be evaluated against the proof to locate the human-marked first flaw. A single agent must carry all 50 judgments plus shard and dataset summaries in one context window (~84 000 tokens), creating severe coverage and bookkeeping pressure. In a map-reduce setup, ten mapper agents each own five artifacts in isolated context and return exact option letters, while one reducer verifies global counts and assembles the final JSON."
reference_link = "https://huggingface.co/datasets/INSAIT-Institute/OPC"

[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

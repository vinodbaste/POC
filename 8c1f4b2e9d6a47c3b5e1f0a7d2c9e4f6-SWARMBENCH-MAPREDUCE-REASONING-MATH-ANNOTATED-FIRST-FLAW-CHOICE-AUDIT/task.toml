[task]
name = "swarmbench/8c1f4b2e9d6a47c3b5e1f0a7d2c9e4f6-SWARMBENCH-MAPREDUCE-REASONING-MATH-ANNOTATED-FIRST-FLAW-CHOICE-AUDIT"
description = "Audit 75 human-annotated incorrect olympiad proofs and choose which candidate excerpt contains the marked first unrecoverable flaw."

[metadata]
verifier_type = "llm-judge"
domain = "reasoning-math"
coordination_pattern = "map-reduce"
human_solving_hours_estimate = 55
human_solving_hours_justification = "75 artifacts x 35 minutes each = 44 hours for primary evaluation (reading the problem, the proof, identifying the chronological flaw step, and classifying its flaw type per the rubric); plus 8 hours for the reducer to aggregate fifteen shard outputs, compute global choice_counts, competition_counts, year_counts, and artifacts_by_option, and produce the final structured report; plus 3 hours for consistency checks and final QA. Total = 55 hours."
estimated_sub_agents = 16
input_token_estimate = 126000
why_multi_agent = "The task requires 75 independent proof-audit judgments across three olympiad sources. Each artifact has a full problem statement, a full incorrect proof, and four candidate excerpt windows that must be evaluated against the proof to locate the marked first flaw. A single agent must carry all 75 judgments plus 15 shard summaries and 4 dataset-wide aggregates in one context window (~126 000 tokens) in a single pass, with attention dilution and bookkeeping pressure degrading accuracy on the later artifacts and on the cross-artifact summary aggregates. In a map-reduce setup, fifteen mapper sub-agents each own five artifacts in an isolated context window of roughly 10 000 tokens, returning structured option-letter and flaw-type judgments produced by carefully applying the 5-step classification procedure from the review rubric. A dedicated reducer sub-agent then aggregates the fifteen shard outputs into the final dataset-wide summary. The 10-minute wall-clock budget is sufficient for parallel mapper execution plus reducer aggregation but not for sequential single-agent processing of all 75 artifacts in one context."
reference_link = "https://huggingface.co/datasets/INSAIT-Institute/OPC"

[agent]
timeout_sec = 600

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

  - id: reduce-final-json
    description: >
      MUST be delegated to a reducer sub-agent after all seven audit sub-agents complete.
      Reconcile the seven response-level audit assessments and produce the final JSON output.
      Before writing the final answer, re-read /input_artifacts/problem.tex and copy the exact
      move sequence from that file. Treat mapper outputs as tentative evidence because mappers
      may disagree about cube tracking. Resolve conflicts by checking the exact sequence under
      standard Rubik notation and by enforcing consistency among correct_sum,
      acceptable_solution_ids, and every per-response field. Write the final JSON to
      /logs/agent/output.json using exactly the schema required by instruction.md.
    depends_on:

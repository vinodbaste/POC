# The orchestrator must use the map-reduce plan below.
# The orchestrator MUST spawn the seven audit sub-agents and the reducer sub-agent.
# The orchestrator MUST NOT audit all responses by itself before delegation.
sub_tasks:
  - id: audit-response-a
    description: >
      MUST be delegated to a separate sub-agent. Read /input_artifacts/problem.tex and
      /input_artifacts/proposed_solutions/response_A.tex. Independently solve the Rubik's-cube
      sticker-tracking problem using standard notation, then audit only Response A against the
      labels requested in the main task: extracted final sum, final-sum correctness, acceptability,
      standard-notation tracking error, arithmetic error, unsupported front-face tracking,
      numbered-step structure, and readable math format. Return a concise JSON-like assessment
      for Response A only, with no assumptions based on any other response.
    depends_on: []
    parallel_group: map


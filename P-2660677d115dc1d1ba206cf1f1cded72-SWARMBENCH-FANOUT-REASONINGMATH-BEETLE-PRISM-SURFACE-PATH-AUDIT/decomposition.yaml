version: 1
coordination_pattern: fan-out-synthesize
estimated_sub_agents: 11

sub_tasks:
  - id: derive-gold-distance
    description: >
      Read /workspace/instruction.md and /input_artifacts/problem.md only. Independently
      derive the squared shortest surface distance d^2 for the hexagonal prism with side
      a = 2025 and height h = 2025 by enumerating every relevant surface-unfolding family
      (three-face lateral strip; broken base-edge path; base-plus-lateral-face unfolding;
      and any others you can construct) and verifying a valid surface unfolding for the
      winning candidate. Express d^2 in the form R + C*sqrt(3) with R >= 0, C >= 0 integers
      and return {"rational_part": R, "radical_coefficient_sqrt3": C}. Also compute the
      same shortest-surface-distance decomposition for each of the five anchor pairs
      (anchor_a1_h1, anchor_a1_h2, anchor_a2_h1, anchor_a2_h3, anchor_a3_h2) listed in
      instruction.md and return them in a single small_case_anchor_results object with
      the same {rational_part, radical_coefficient_sqrt3} shape per anchor. Do not inspect
      any proposed response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      Read /workspace/instruction.md, /input_artifacts/problem.md, and
      /input_artifacts/proposed_solutions/response_A.md. Audit only Response A. Extract
      its final stated distance and decide whether it equals the true minimum
      (final_answer_correct). Then determine the exact set of failure_reasons whose
      trigger phrase is concretely present in this single response, drawn ONLY from the
      five-code vocabulary {F1, F2, F3, F4, F5} defined in instruction.md. Most responses
      have 0, 1, or 2 failure reasons. Return failure_reasons=[] when the final stated
      distance equals the true minimum AND no trigger phrase fires. Do not infer from
      other responses.
    depends_on: []
    parallel_group: fan-out


  - id: synthesize-final-audit
    description: >
      Combine the gold-distance derivation (gold_distance_squared_decomposition and
      small_case_anchor_results) and nine response audits into the final JSON output.
      Trust each per-response audit's failure_reasons list; do not add codes the audit
      did not identify, and do not delete codes the audit did identify. Compute
      acceptable_solution_ids as the uppercase, alphabetically-sorted list of response_ids
      whose final_answer_correct is true AND failure_reasons is empty. Write the result to
      /logs/agent/output.json. Top-level keys exactly: gold_distance_squared_decomposition,
      small_case_anchor_results, acceptable_solution_ids, per_response_assessment.
      per_response_assessment must contain exactly nine objects, ordered alphabetically A
      through I, each with exactly the keys response_id, final_answer_correct,
      failure_reasons.
    depends_on:
      - derive-gold-distance
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
    parallel_group: synthesize

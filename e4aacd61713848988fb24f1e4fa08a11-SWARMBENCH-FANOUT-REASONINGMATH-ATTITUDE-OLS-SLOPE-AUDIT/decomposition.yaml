coordination_pattern: fan-out-synthesize
estimated_sub_agents: 14

description: >
  One derivation specialist fits the OLS regression of rating on complaints from
  first principles; twelve auditors each independently re-derive the estimator
  algebra of a single candidate solution and assign its exact failure-code set;
  one synthesizer assembles the final JSON. The work fans out cleanly because each
  candidate audit is an independent proof obligation.

sub_tasks:
  - id: derive-gold-regression
    description: >
      Fit the OLS line rating ~ complaints on all 30 observations in attitude.csv.
      Compute the means, the mean-centered sums of squares and cross-products, the
      slope and intercept, the residual standard error on n-2 degrees of freedom,
      the slope standard error, and the 95% confidence interval using the Student-t
      quantile. Emit the headline gold_slope_x1000 and the reference wrong-method
      values that the auditors will key on.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-A
    description: >
      Audit only Response A (environment/input_artifacts/proposed_solutions/response_A.md).
      Independently refit the OLS regression, decide final_answer_correct against the
      stated tolerances, and assign the exact failure-code set from {F1,F2,F3,F4,F5,F6}.
      Do not read any other response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-B
    description: >

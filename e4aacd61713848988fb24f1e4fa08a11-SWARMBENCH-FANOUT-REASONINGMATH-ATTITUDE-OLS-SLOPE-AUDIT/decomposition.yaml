  - id: synthesize-final-audit
    description: >
      Collect the gold field and the twelve independent audit verdicts, order the
      entries A..L alphabetically, derive acceptable_solution_ids (final_answer_correct
      true AND empty failure_reasons), and emit /logs/agent/output.json. Perform no
      new mathematics; this step is purely structural assembly.
    depends_on:
      - derive-gold-regression
      - audit-response-A
      - audit-response-B
      - audit-response-C
      - audit-response-D
      - audit-response-E
      - audit-response-F
      - audit-response-G
      - audit-response-H
      - audit-response-I
      - audit-response-J
      - audit-response-K
      - audit-response-L
    parallel_group: synthesize

output_contract:
  file: /logs/agent/output.json
  schema:
    gold_slope_x1000: int
    acceptable_solution_ids: [str]
    per_response_assessment:
      - response_id: str
        final_answer_correct: bool
        failure_reasons: [str]

sub_tasks:
  - id: solve-word-problem
    description: >
      Read /input_artifacts/problem.md only. Independently solve the multi-step
      factory word problem by computing each shift's contribution, summing the
      total widgets produced, applying the 12% defect filter, and returning the
      gold integer answer. Return the gold integer plus a concise step-by-step
      derivation. Do not inspect any candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_A.md. Audit only Response A.
      Decide whether its claimed final integer matches the independently
      computed gold integer. If wrong, return the exact applicable
      failure_reasons chosen from the eight-code vocabulary defined in
      instruction.md. Focus on Response A's interpretation of the 12% defect
      rate. Apply codes strictly per the universal trigger and disambiguation
      rules in instruction.md. Do not infer correctness from other responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-b
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_B.md. Audit only Response B.
      Decide whether its claimed final integer matches the gold. If wrong,
      return the exact applicable failure_reasons from the same vocabulary.
      Focus on Response B's stated numerical constants for the shift rates
      and durations. Apply codes per the universal rules in instruction.md.
      Do not infer correctness from other responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-c
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_C.md. Audit only Response C.
      Decide whether its claimed final integer matches the gold. If correct
      AND no failure-reason trigger fires, return failure_reasons = [] and
      final_value_correct = true. Otherwise return the exact applicable
      failure_reasons from the same vocabulary. Apply codes per the universal
      rules in instruction.md. Do not infer correctness from other responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-d
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_D.md. Audit only Response D.
      Decide whether Response D produces a committed final integer answer at
      all. If the response has workings but no committed final integer, the
      `truncated_or_incomplete_answer` code applies. If there are no workings
      and no answer at all, `non_terminating_or_no_committed_answer` applies
      and stands alone. Otherwise return failure_reasons from the vocabulary
      per the universal rules.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-e
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_E.md. Audit only Response E.
      Decide whether its claimed final integer matches the gold. If wrong,
      return the exact applicable failure_reasons from the same vocabulary.
      Focus on Response E's choice of arithmetic operation at each step
      (addition vs subtraction, multiplication vs division). Apply codes per
      the universal rules. Do not infer correctness from other responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-f
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_F.md. Audit only Response F.
      Decide whether its claimed final integer matches the gold. If wrong,
      return the exact applicable failure_reasons from the same vocabulary.
      Focus on the arithmetic outputs of each calculation step in Response F:
      whether stated products, sums, and differences are arithmetically
      correct given correct input numerals. Apply codes per the universal
      rules. Do not infer correctness from other responses.
    depends_on: []
    parallel_group: fan-out

  - id: synthesize-final-audit
    description: >
      Read the gold integer produced by solve-word-problem and the six
      per-response audit objects produced by audit-response-a through
      audit-response-f. Compose one JSON object with top-level keys
      gold_final_value, acceptable_solution_ids, and per_response_assessment
      (six objects ordered A through F), as specified by instruction.md. Set
      final_value_correct on each per-response object based on whether the
      response's committed final integer equals the gold. Compute
      acceptable_solution_ids as the set of response_ids whose
      final_value_correct is true AND whose failure_reasons list is empty.
      Do not re-derive the gold or re-audit individual responses. Write the
      JSON to /logs/agent/output.json and validate that it parses before
      returning.
    depends_on:
      - solve-word-problem
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
    parallel_group: synthesize

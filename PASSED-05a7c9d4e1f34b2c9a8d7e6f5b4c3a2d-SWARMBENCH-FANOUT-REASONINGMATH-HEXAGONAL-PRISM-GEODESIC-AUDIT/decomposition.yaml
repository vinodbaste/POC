pattern: fan-out-synthesize
description: >
  Use independent solving, adversarial validation, one-response-per-agent auditing,
  and final synthesis. This decomposition intentionally distributes the substantive
  mathematical work to sub-agents so the orchestrator only coordinates and assembles.

orchestration_requirements: >
  The orchestrator MUST follow this fan-out-synthesize plan. It MUST spawn every
  sub-agent listed below and MUST NOT solve the geometry problem, audit candidate
  responses, or assign final labels by itself before receiving sub-agent outputs.
  The orchestrator should pass the relevant input context to workers, wait for
  their reports, then perform only reconciliation and final JSON assembly. The
  orchestrator must not write long independent derivations or long response audits
  in its own context.

sub_tasks:
  - id: solve_original_geometry
    title: Independently solve the original prism surface-distance problem
    description: >
      Derive the correct shortest surface distance from first principles by comparing
      all relevant candidate surface-path families, without trusting any proposed response.
    parallel_group: map
    depends_on: []
    objective: >
      Solve the original problem independently. Compare consecutive lateral rectangles,
      broken base-plus-edge paths, false diameter-height shortcuts, and base-plus-lateral
      unfoldings. For each candidate, state exact expression, validity, and ordering.
      Return the exact minimum expression.
    deliverable: >
      A compact solution with candidate expressions, validity checks, and exact answer.

  - id: adversarial_minimality_validator
    title: Validate or refute common incorrect minima
    description: >
      Independently test whether the lateral-strip, base-edge, and false shortcut
      candidates are actually valid global minima.
    parallel_group: map
    depends_on: []
    objective: >
      Act as a skeptical validator. Check the three-face lateral strip, the broken
      base-edge path of length 3s, false 2025*sqrt(5) shortcuts, and the
      base-plus-lateral-face family. Verify whether a straight line crosses shared
      edges at valid points. State which candidate is the true global minimum.
    deliverable: >
      A validation report with the true minimum family and refutations of nonminimal
      or invalid candidates.

  - id: audit_response_A
    title: Audit response A
    description: >
      Audit only response A against the validated geometry and assign all labels.
    parallel_group: audit
    depends_on: [solve_original_geometry, adversarial_minimality_validator]
    objective: >
      Audit response A only. Read response A carefully and assign all required fields:
      final_answer_category, gtfa_correct, spatial_reasoning_error,
      non_spatial_reasoning_error, calculation_error, completeness_level,
      efficiency_level, latex_clarity_level, error_codes, and brief_justification.
      Do not audit any other response.
    deliverable: >
      Complete labels and short justification for response A.

  - id: audit_response_B
    title: Audit response B
    description: >
      Audit only response B against the validated geometry and assign all labels.
    parallel_group: audit
    depends_on: [solve_original_geometry, adversarial_minimality_validator]
    objective: >
      Audit response B only. Pay special attention to whether the 6075 base-edge
      path is merely valid or actually globally minimal. Assign all required fields
      using the controlled values from instruction.md.
    deliverable: >
      Complete labels and short justification for response B.

  - id: audit_response_C
    title: Audit response C
    description: >
      Audit only response C against the validated geometry and assign all labels.
    parallel_group: audit
    depends_on: [solve_original_geometry, adversarial_minimality_validator]
    objective: >
      Audit response C only. Assign all required fields using the controlled values
      from instruction.md. Do not audit any other response.
    deliverable: >
      Complete labels and short justification for response C.

  - id: audit_response_D
    title: Audit response D
    description: >
      Audit only response D against the validated geometry and assign all labels.
    parallel_group: audit
    depends_on: [solve_original_geometry, adversarial_minimality_validator]
    objective: >
      Audit response D only. Assign all required fields using the controlled values
      from instruction.md. Do not audit any other response.
    deliverable: >
      Complete labels and short justification for response D.

  - id: audit_response_E
    title: Audit response E
    description: >
      Audit only response E against the validated geometry and assign all labels.
    parallel_group: audit
    depends_on: [solve_original_geometry, adversarial_minimality_validator]
    objective: >
      Audit response E only. Pay special attention to any arithmetic simplification
      of sqrt(4050^2 + 2025^2) and whether the geometric model is a valid surface
      unfolding. Assign all required fields using the controlled values from instruction.md.
    deliverable: >
      Complete labels and short justification for response E.

  - id: audit_response_F
    title: Audit response F
    description: >
      Audit only response F against the validated geometry and assign all labels.
    parallel_group: audit
    depends_on: [solve_original_geometry, adversarial_minimality_validator]
    objective: >
      Audit response F only. Check whether the claimed 2025*sqrt(5) path is a valid
      surface geodesic from U to X'. Assign all required fields using the controlled
      values from instruction.md.
    deliverable: >
      Complete labels and short justification for response F.

  - id: audit_response_G
    title: Audit response G
    description: >
      Audit only response G against the validated geometry and assign all labels.
    parallel_group: audit
    depends_on: [solve_original_geometry, adversarial_minimality_validator]
    objective: >
      Audit response G only. Check the three-face lateral-strip conclusion and any
      alternate-net comparisons. Assign all required fields using the controlled
      values from instruction.md.
    deliverable: >
      Complete labels and short justification for response G.

  - id: synthesize_final_json
    title: Synthesize final JSON output
    description: >
      Reconcile the solver, validator, and seven single-response audits, then produce
      the final JSON in the exact required schema.
    parallel_group: synthesize
    depends_on:
      - solve_original_geometry
      - adversarial_minimality_validator
      - audit_response_A
      - audit_response_B
      - audit_response_C
      - audit_response_D
      - audit_response_E
      - audit_response_F
      - audit_response_G
    objective: >
      Reconcile all worker reports. The final answer must be based on the solver
      and validator, not on a majority vote among candidate responses. Produce exactly
      the required JSON schema with top-level derived_final_answer and responses
      as an object with keys A, B, C, D, E, F, and G. Do not output responses as a list.
    deliverable: >
      The final /logs/agent/output.json content in the exact required schema.

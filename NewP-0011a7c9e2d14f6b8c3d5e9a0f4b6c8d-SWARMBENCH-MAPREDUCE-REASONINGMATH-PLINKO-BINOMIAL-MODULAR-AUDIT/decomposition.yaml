
# Core-answer stability requirement:
# The core-reference-math mapper must verify the final residue with exact integer arithmetic as well as the modular reasoning.
# The reducer must take correct_answer_latex only from this independently verified core computation.
# The reducer must not use any proposed response's claimed answer to set correct_answer_latex or acceptable_solution_ids.


# Top-level answer consistency requirement:
# The core-reference-math mapper must compute the final residue from the original problem independently.
# It must cross-check the result using separate congruences modulo 8 and modulo 125 and then CRT.
# The reducer must set correct_answer_latex from the core-reference-math mapper, not from any proposed response.
# The reducer must set acceptable_solution_ids using the formal definition in instruction.md, not from a response's self-assessment.

# Coordination compliance requirement:
# The orchestrator MUST follow the map-reduce decomposition below.
# The orchestrator MUST spawn and delegate work to sub-agents for the map tasks.
# The orchestrator MUST NOT solve the mathematical audit mostly by itself.
# The orchestrator should use sub-agent outputs to produce the final reduce output.
# The final trajectory must demonstrate that the specified coordination pattern was followed.
#
# Runtime constraint:
# Do not spawn extra cross-check agents that read all responses A-I.
# Each response auditor must read only /input_artifacts/problem_statement.md and its assigned response file.
# The reducer should use mapper outputs and should not re-audit all response files unless a mapper output is missing or internally inconsistent.

sub_tasks:
  - id: core-reference-math
    description: >
      Independently solve the Plinko path-counting problem from /input_artifacts/problem_statement.md.
      Determine the correct number of diagonal moves, the corresponding binomial coefficient, the
      reference p-adic valuations and modular congruences needed for modulo 1000, and the final residue.
      Do not audit individual proposed responses. Return a concise reference summary for the reducer.
    depends_on: []
    parallel_group: map

  - id: audit-response-a
    description: >
      Audit only /input_artifacts/problem_statement.md and /input_artifacts/proposed_solutions/response_A.md.
      Extract response A's claimed final answer and path-count expression. Evaluate every required label
      from instruction.md using direct evidence from response A and the reference mathematics. Do not read
      any other response file.
    depends_on: []
    parallel_group: map

  - id: audit-response-b

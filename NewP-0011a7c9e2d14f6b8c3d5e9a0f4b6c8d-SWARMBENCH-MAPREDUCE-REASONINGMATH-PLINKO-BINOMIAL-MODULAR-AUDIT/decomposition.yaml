      Use the core-reference-math output and the nine individual response-audit outputs to produce exactly
      the JSON required by instruction.md at /logs/agent/output.json. Preserve all nine response objects in
      order A through I. Resolve conflicts using the mapper evidence and the instruction.md label definitions;

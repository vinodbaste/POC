# Multi-agent decomposition for this audit task.
#
# ============================================================================
# ORCHESTRATOR COORDINATION CONTRACT (multi-agent runs only)
# ============================================================================
# This file describes a fan-out/synthesise decomposition. The runtime
# orchestrator is bound by the following hard constraints:
#
# 1. The orchestrator MUST NOT read /input_artifacts/problem.md,
#    /input_artifacts/provenance.md, or any file in
#    /input_artifacts/proposed_solutions/. Every input read happens
#    inside a sub-agent invocation; the orchestrator never inlines the
#    contents of those files into a sub-task prompt or into its own
#    context. Each sub-task description names the exact files its
#    sub-agent is responsible for reading directly during the
#    sub-agent's own execution.
#
# 2. The orchestrator MUST NOT write /logs/agent/output.json. The
#    final JSON document is produced and written exclusively by the
#    `synthesize-final-audit` sub-agent.
#
# 3. The orchestrator MUST NOT re-derive the problem, re-classify any
#    response, or perform any of the per-audit reasoning itself; all
#    such work is delegated to sub-agents.
#
# 4. The orchestrator's only legitimate token expenditure is to
#    (a) dispatch each sub-task to a fresh sub-agent invocation,
#    respecting `depends_on`, (b) collect the structured returns from
#    each sub-agent, and (c) hand those structured returns to
#    `synthesize-final-audit` which writes the final JSON.
#
# 5. As a budget guideline for this task, the orchestrator's total
#    token consumption SHOULD remain well below 30% of the combined
#    multi-agent budget; the dominant per-response audit reasoning is
#    expected to live inside the eleven `audit-response-*` sub-agents
#    and the mathematical derivation inside `verify-correct-answer`.
#
# The audit rules and output schema themselves live in
# `/instruction.md` and apply identically to single-agent and
# multi-agent runs; this file is a multi-agent-only coordination
# contract and must not be read by single-agent runs.
# ============================================================================

sub_tasks:
  - id: verify-correct-answer
    description: >
      File-reading directive: this sub-agent MUST itself read
      /input_artifacts/problem.md from disk during its own
      execution; the orchestrator does NOT pre-read or inline this
      file into this sub-task prompt. Open the file yourself and
      extract the parent array and the values of N and K.

      Read /input_artifacts/problem.md and independently produce SIX
      mathematical sub-quantities required by the verifier:

        * `correct_answer`: the count of valid length-K=22 arrays
          modulo 997 on the given N=44 tree.
        * `small_case_anchor_results.P3_K2`: the length-K=2 count on
          path P_3 (vertices 1-2-3, two edges), modulo 997.
        * `small_case_anchor_results.P4_K2`: the length-K=2 count on
          path P_4 (four vertices, three edges), modulo 997.
        * `small_case_anchor_results.P5_K2`: the length-K=2 count on
          path P_5 (five vertices, four edges), modulo 997.
        * `small_case_anchor_results.S3_K2`: the length-K=2 count on
          the three-leaf star (one hub, three leaves), modulo 997.
        * `small_case_anchor_results.S4_K2`: the length-K=2 count on
          the four-leaf star (one hub, four leaves), modulo 997.

      Compute the final N=44 number with a single deliberate Python
      script that uses big-integer arithmetic, builds the degree
      multiset directly from the parent array, applies your committed
      framework, and prints the length-K=22 value modulo 997 as well
      as the five small-tree K=2 values modulo 997 from the SAME
      framework. If your script reproduces every small-tree anchor
      and reports a single integer in [0, 997) for the N=44 case,
      commit to those six values. You have at most 30 thinking
      steps; if after 25 you have not produced a value that reproduces
      every anchor, report your best-effort intermediate values and
      stop. Do not assign correctness labels to any candidate response
      and do not classify failure reasons.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      File-reading directive: this sub-agent MUST itself read
      /input_artifacts/problem.md and ONLY
      /input_artifacts/proposed_solutions/response_A.md from disk
      during its own execution; the orchestrator does NOT pre-read
      or inline these files into this sub-task prompt. Open both
      files yourself and quote from them verbatim as you reason.

      Reasoning protocol (perform every step inside this sub-agent's
      own execution context, not in the orchestrator's): (i)
      summarise Response A's stated counting method or DP in 2-3
      sentences quoting the exact formula or recurrence the response
      commits to; (ii) pick at least one of the five small-tree
      anchors P_3, P_4, P_5, S_3, S_4 at K=2 and expand Response A's
      stated method on that anchor by direct polynomial
      multiplication or DP simulation, writing the expansion out
      step-by-step in your reasoning trace, then compare the value
      you obtain to the brute-force anchor (P3_K2=1, P4_K2=2,
      P5_K2=3, S3_K2=3, S4_K2=3) listed in instruction.md; (iii)
      decide which audit rule (R2/R3/R4/R5) and which W-pattern (if
      any) applies, and pick the error_category from R6; (iv) emit
      the structured audit object below.

      Produce ONE structured audit object for Response A by
      applying the audit rules R1-R5 and the error_category rule R6
      from /instruction.md verbatim, exactly as a single auditor
      would, without consulting any other response.

      The deterministic verifier grades SEVEN per-audit fields
      strictly all-or-nothing per audit (one slip zeros the 30
      points): response_id (must equal the letter "A");
      final_answer_correct (bool); failure_reasons (size-0 list when
      correct, size-2 list when wrong consisting of one primary code
      from {wrong_formula, arithmetic_error,
      invalid_or_incomplete_justification} chosen by R2/R3/R4/R5
      plus the mandatory final_answer_error per R1);
      primary_failure_evidence (string of >=60 chars quoting exact
      textual evidence from response_A.md);
      alternative_codes_considered (>=2 distinct entries drawn from
      the FOUR-CODE FAILURE vocabulary, codes not in
      failure_reasons, each entry's reason_excluded string of >=30
      chars); error_category (one of the five values per R6); and
      anchor_verification_summary (string of >=100 chars recording
      the auditor's own independent expansion of the response's
      stated method on at least one of P_3, P_4, P_5, S_3, S_4 at
      K=2). Two additional fields, dominant_error_location and
      length_constraint_handling, are emitted but NOT graded — set
      them to your best-effort value.

      Return ONE audit object for Response A and nothing else.
    depends_on: []
    parallel_group: fan-out


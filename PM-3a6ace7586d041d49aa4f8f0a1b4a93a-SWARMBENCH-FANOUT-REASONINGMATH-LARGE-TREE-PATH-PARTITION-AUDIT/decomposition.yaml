  - id: synthesize-final-audit
    description: >
      File-writing directive: this sub-agent MUST itself write the
      final JSON document at /logs/agent/output.json from inside its
      own execution; the orchestrator does NOT write that file and
      does NOT inline its contents. Open the output path yourself and
      perform the write call directly.

      Reasoning protocol (perform every step inside this sub-agent's
      own execution context, NOT in the orchestrator's): (i) collect
      the structured returns from verify-correct-answer and from each
      of the eleven audit-response-* sub-agents; (ii) for each
      returned audit, validate every per-audit field against the
      schema in instruction.md (response_id letter, final_answer_correct
      bool, failure_reasons size 0 / size 2, primary_failure_evidence
      >=60 chars, alternative_codes_considered >=2 entries with
      reason_excluded >=30 chars each, error_category in vocabulary,
      anchor_verification_summary >=100 chars); (iii) compute
      acceptable_solution_ids as the alphabetically-sorted list of
      letters whose audit has final_answer_correct=true and
      failure_reasons=[]; (iv) assemble the full JSON object in
      memory and serialise it; (v) write the bytes to
      /logs/agent/output.json yourself. Do NOT re-derive the problem
      and do NOT re-classify any response.

      The output JSON must satisfy these declarative constraints:

        * `correct_answer` is an integer in [0, 997) equal to the value
          produced by verify-correct-answer.
        * `small_case_anchor_results` is an object whose five integer
          values come verbatim from the verify-correct-answer report.
        * `per_response_assessment` is an ordered array of eleven audit
          objects whose `response_id` values are exactly A, B, C, D, E,
          F, G, H, I, J, K (in that order); the contents of each audit
          object come from the matching audit-response-* sub-agent.
        * For every audit whose `final_answer_correct` is `true`, the
          `failure_reasons` array is empty.
        * For every audit whose `final_answer_correct` is `false`, the
          `failure_reasons` array has exactly two distinct codes, one
          of which is `final_answer_error`, and the other is the
          primary code chosen by the corresponding sub-agent.
        * `alternative_codes_considered` for each audit is disjoint
          from that audit's `failure_reasons` and contains entries
          whose `code` field comes only from the four-code FAILURE
          vocabulary {wrong_formula, arithmetic_error,
          invalid_or_incomplete_justification, final_answer_error}.
        * `acceptable_solution_ids` is the alphabetically-sorted list
          of response letters whose audit has
          `final_answer_correct=true` and `failure_reasons=[]`.

      You MUST write the final JSON to /logs/agent/output.json
      yourself. A missing or malformed sub-agent slot is satisfied by
      a stub whose primary code is
      `invalid_or_incomplete_justification`, whose `error_category`
      is `incomplete_or_truncated`, and whose free-text fields meet
      the per-field length minimums (>=60 chars for
      primary_failure_evidence; >=30 chars for each reason_excluded;
      >=100 chars for anchor_verification_summary).
      Do not exit without writing /logs/agent/output.json. The
      orchestrator does not perform any of this assembly or write
      step itself; it only collects your acknowledgement that the

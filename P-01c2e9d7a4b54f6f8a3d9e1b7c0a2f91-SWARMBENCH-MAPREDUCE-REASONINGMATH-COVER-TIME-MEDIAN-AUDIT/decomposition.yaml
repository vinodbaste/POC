  - id: reduce-final-audit
    description: >
      Read the theorem-adjudication note and all six response-audit notes. Then independently
      re-open /input_artifacts/problem.tex and all six response files to verify the final answer and
      every label. Do not decide correctness by majority vote among response constants; multiple
      responses can share the same wrong constant. The final JSON must contain correct_answer_latex,
      acceptable_solution_ids, and per_response_assessment for A through F in order. Use standard
      LaTeX closed form for constants. Do not include prose justification fields and do not include
      code-style labels. Write the final JSON to /logs/agent/output.json.
    depends_on:
      - theorem-adjudication
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
    parallel_group: reduce

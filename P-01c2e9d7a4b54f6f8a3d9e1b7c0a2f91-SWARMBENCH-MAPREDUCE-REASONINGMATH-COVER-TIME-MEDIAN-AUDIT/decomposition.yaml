sub_tasks:
  - id: theorem-adjudication
    description: >
      Read /input_artifacts/problem.tex and all six proposed solution files. Your sole job is to
      adjudicate the mathematical asymptotic conflict in the problem. Identify which kind of limiting
      statement is actually relevant to the median of log(T_n)/(log n)^2, distinguish this from
      polynomial-order cover-time heuristics, and decide which proposed response(s) use the correct
      theorem/asymptotic framework. Do not decide by majority vote among the responses. Return a
      compact note containing the correct closed-form constant, the response IDs that are fully
      correct, and a short explanation of why the competing constants are not correct.
    depends_on: []
    parallel_group: map

  - id: audit-response-a
    description: >
      Read /input_artifacts/problem.tex and /input_artifacts/proposed_solutions/response_A.tex.
      Audit only Response A. Extract its final claimed answer in LaTeX closed form. Decide whether
      the final answer is correct. Evaluate has_mathematical_error, has_calculation_error,
      has_unjustified_step, has_stepwise_structure, and has_proper_latex_format. A mathematical
      error means a false theorem, false asymptotic/scaling claim, wrong limiting distribution, or
      invalid final-answer-critical reasoning step. A calculation error means arithmetic/algebra/
      equation-solving error after the response's stated premises. An unjustified step means a
      final-answer-critical inference with inadequate support. Return a compact JSON-style note
      for Response A only.
    depends_on: []
    parallel_group: map


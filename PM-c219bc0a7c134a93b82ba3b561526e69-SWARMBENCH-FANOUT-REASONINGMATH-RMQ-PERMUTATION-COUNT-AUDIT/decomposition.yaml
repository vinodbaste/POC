sub_tasks:
  - id: verify-correct-answer
    description: >
      Read /input_artifacts/problem.md to understand the problem in
      full, including the exact data given by the table T(l, r) (the
      index of the minimum element of P_l, ..., P_r) and the
      requirement to count permutations P of {1, ..., N} consistent
      with the table. The required output is the gold value of the
      count: a single non-negative integer, together with a brief
      written justification. The gold value is determined by the
      following definition. Each T(l, r) = i cell imposes the strict
      constraint P_i < P_j for every j in [l, r] with j != i. The
      conjunction of all such constraints is a strict partial order on
      the values P_1, ..., P_N. When that partial order contains a
      cycle (equivalently, the constraint system is unsatisfiable),
      the gold value is the empty count by the definition of the
      problem, because no permutation of distinct integers can satisfy
      an unsatisfiable strict-order chain; a counting identity is not
      required and must not be invoked in this case. When the partial
      order has no cycle, the gold value is the count of permutations
      satisfying every T(l, r) constraint of the given table, obtained
      from a counting identity that reproduces the count of
      permutations satisfying the constraint system on a length-2 and
      a length-3 table the agent constructs from explicit small
      permutations. A counting identity is disqualified when it
      produces a non-zero value for an unsatisfiable constraint
      system, because such an identity does not count permutations
      satisfying the constraint system regardless of which tree shape,
      heap-ordered tree, binomial recursion, or N!/subtree-size
      formula it embodies. The gold value is the empty count whenever
      the partial order has a cycle, regardless of how plausible an
      alternative counting identity may look. Briefly note whether the
      proposed responses' final stated values agree or disagree with
      the gold value; this is informational only and is not a vote.
      Do not adopt any value because it is popular among the
      responses and do not abandon the gold value because it
      disagrees with the responses. Do not assign correctness labels
      to any candidate response and do not classify failure reasons.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_A.md. Audit only
      Response A. Extract the response's final stated value, the
      closed-form expression, recurrence, algorithm, or invariant it
      claims for the count, the correctness argument it offers for
      that method, and any arithmetic it performs. Decide whether the
      response's final stated value is mathematically correct and
      whether its derivation is valid as a proof. Produce the exact
      applicable failure_reasons set chosen from these four allowed
      codes: wrong_formula, arithmetic_error,
      invalid_or_incomplete_justification, final_answer_error. Apply
      each code only when its trigger condition is concretely present
      in this response's text, following the disambiguation rules in
      instruction.md. Do not infer correctness from other proposed
      responses or from other audit sub-tasks; each audit rests
      entirely on the contents of this one response.
    depends_on: []
    parallel_group: fan-out


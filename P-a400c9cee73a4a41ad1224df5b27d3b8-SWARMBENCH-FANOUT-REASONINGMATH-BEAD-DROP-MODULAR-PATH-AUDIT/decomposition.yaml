version: 1
coordination_pattern: fan-out-synthesize
estimated_sub_agents: 15

sub_tasks:
  - id: derive-gold-residue
    description: >
      Read /workspace/instruction.md and /input_artifacts/problem.md only. Independently
      derive the binomial coefficient C(2026, 396) and reduce it modulo 1000. Concretely:
      compute the total step count, right/left move counts, the binomial coefficient
      parameters, the 2-adic and 5-adic valuations, the residues modulo 8 and 125, and
      the final residue modulo 1000 via CRT. Also compute the exact path count and
      residue modulo 1000 for each of the five small-case anchors listed in
      instruction.md. Return final_residue_mod_1000, intermediate_residues (mod_8,
      mod_125), gold_path_count_decomposition (all nine integer fields), and
      small_case_anchor_results (a list of five anchor objects keyed by anchor_name).
      Do not inspect any proposed response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      Read /workspace/instruction.md, /input_artifacts/problem.md, and
      /input_artifacts/proposed_solutions/response_A.md. Audit only Response A. Extract
      its final claimed residue modulo 1000 and decide whether it equals the true gold
      residue (final_answer_correct). Then determine the exact set of failure_reasons
      whose trigger phrase is concretely present in this single response, drawn ONLY
      from the five-code vocabulary {F1, F2, F3, F4, F5} defined in instruction.md.
      Most responses have 3 or 4 failure reasons. Return failure_reasons=[] when the
      claimed residue equals the gold AND no trigger phrase fires. Do not infer from
      other responses.
    depends_on: []
    parallel_group: fan-out


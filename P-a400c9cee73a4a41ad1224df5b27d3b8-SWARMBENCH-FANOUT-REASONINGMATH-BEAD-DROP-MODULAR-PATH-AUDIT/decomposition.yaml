  - id: synthesize-final-audit
    description: >
      Combine the gold-residue derivation (final_residue_mod_1000, intermediate_residues,
      gold_path_count_decomposition, small_case_anchor_results) and thirteen response
      audits into the final JSON output. Trust each per-response audit's failure_reasons
      list; do not add codes the audit did not identify, and do not delete codes the
      audit did identify. Compute acceptable_solution_ids as the uppercase,
      alphabetically-sorted list of response_ids whose final_answer_correct is true AND
      failure_reasons is empty. Write the result to /logs/agent/output.json. Top-level
      keys exactly: final_residue_mod_1000, intermediate_residues,
      gold_path_count_decomposition, small_case_anchor_results, acceptable_solution_ids,
      per_response_assessment. per_response_assessment must contain exactly thirteen
      objects, ordered alphabetically A through M, each with exactly the keys
      response_id, final_answer_correct, failure_reasons.
    depends_on:
      - derive-gold-residue
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
      - audit-response-j
      - audit-response-k
      - audit-response-l
      - audit-response-m
    parallel_group: synthesize

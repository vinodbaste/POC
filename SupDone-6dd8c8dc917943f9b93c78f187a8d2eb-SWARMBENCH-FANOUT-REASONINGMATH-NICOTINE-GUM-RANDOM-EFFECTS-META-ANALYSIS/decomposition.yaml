  - id: synthesize-final-audit
    description: >
      Combine the gold derivation and the twelve response audits into the final JSON.
      Trust each per-response audit's failure_reasons list; do not add or delete codes.
      Set gold_random_effects_or_x100 from the gold derivation (random-effects pooled
      odds ratio times 100, rounded to an integer). Compute acceptable_solution_ids =
      sorted uppercase list of response_ids whose final_answer_correct is true AND
      failure_reasons is empty. Write to /logs/agent/output.json. Top-level keys exactly:
      gold_random_effects_or_x100, acceptable_solution_ids, per_response_assessment, with
      the twelve per-response objects in alphabetical order.
    depends_on:
      - derive-gold-meta-analysis
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
      - audit-response-j
      - audit-response-k
      - audit-response-l
    parallel_group: synthesize

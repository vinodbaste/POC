version: 1
coordination_pattern: fan-out-synthesize
estimated_sub_agents: 14

sub_tasks:
  - id: derive-gold-meta-analysis
    description: >
      Read /workspace/instruction.md, /input_artifacts/problem.md, and
      /input_artifacts/trials.csv only. Independently compute the DerSimonian-Laird
      random-effects pooled odds ratio and its 95% confidence interval, plus the
      supporting fixed-effect odds ratio, Q, I^2, and tau^2. Report the gold
      random-effects OR and CI for the synthesizer. Do not inspect any proposed response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      Read /workspace/instruction.md, /input_artifacts/problem.md, and
      /input_artifacts/proposed_solutions/response_A.md. Audit only Response A. Decide
      final_answer_correct by comparing its reported random-effects pooled odds ratio and
      95% CI to the independently computed gold, and assign the exact set of failure_reasons
      from {F1, F2, F3, F4, F5} whose triggers are directly observable. Most responses have
      0-2 failure reasons. Return failure_reasons=[] when the final answer is correct and no
      trigger appears. Do not infer from other responses.
    depends_on: []
    parallel_group: fan-out


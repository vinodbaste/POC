version: 1
coordination_pattern: fan-out-synthesize
estimated_sub_agents: 11

sub_tasks:
  - id: adjudicate-gold-set
    description: >
      Read /workspace/instruction.md and /input_artifacts/problem.md only. Independently
      determine, for each of the eight statements (a) through (h), whether it is
      necessarily true for every tetrahedron ABCD satisfying both hypotheses, then state
      the gold SET of statement labels that are necessarily true in alphabetical
      lowercase form. Do not inspect any proposed response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      Read /workspace/instruction.md, /input_artifacts/problem.md, and
      /input_artifacts/proposed_solutions/response_A.md. Audit only Response A. Extract
      its claimed final SET of necessarily-true statement labels and decide whether it
      equals the gold set (final_answer_correct). Then determine the exact set of
      failure_reasons whose trigger phrase is concretely present in this single response,
      drawn ONLY from the five-code vocabulary {F1, F2, F3, F4, F5} defined in
      instruction.md. The literal word "centroid" is NOT interchangeable with "incenter".
      Most responses have 0 or 1 failure reasons. Return failure_reasons=[] when the
      claimed set equals the gold AND no trigger phrase fires. Do not infer from other
      responses.
    depends_on: []
    parallel_group: fan-out


[task]
name = "swarmbench/389bea21a76d4173b56e3adbf8ac1054-SWARMBENCH-FANOUT-REASONING-MATH-PROOF-VALIDITY-AUDIT"
description = "Audit twenty real olympiad proof attempts for correctness and earliest material flaw, then synthesize a dataset-level report."

[metadata]
verifier_type = "llm-judge"
domain = "reasoning-math"
coordination_pattern = "fan-out-synthesize"
human_solving_hours_estimate = 22.0
human_solving_hours_justification = "Proof reading and correctness judgment: 20 proofs × 45 minutes each = 900 minutes = 15.0 hours. Cross-checking flaw summaries and competition metadata: 5.0 hours. Final report synthesis, sort verification, and QA: 2.0 hours. Total = 15.0 + 5.0 + 2.0 = 22.0 hours."
estimated_sub_agents = 21
input_token_estimate = 79000
why_multi_agent = "Twenty independent olympiad proof audits span five mathematical domains (number theory, geometry, combinatorics, algebra/analysis, functional equations), each with a dedicated domain background reference file. Reading all five domain backgrounds plus all twenty proof files creates roughly 79000 tokens of required input for a single agent. A multi-agent system assigns one proof per sub-agent; each sub-agent reads only its relevant domain background (~11K tokens) plus its one proof (~5K tokens), keeping context focused and reasoning isolated. A single agent reading all five domain references consecutively and then auditing twenty proofs simultaneously faces 6.7x more context than any sub-agent, causing cross-domain confusion, missed subtle flaws, and weaker per-proof analysis. The dedicated synthesizer merges the twenty independent audit results into the final report."
reference_link = "https://huggingface.co/datasets/INSAIT-Institute/OPC"

[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

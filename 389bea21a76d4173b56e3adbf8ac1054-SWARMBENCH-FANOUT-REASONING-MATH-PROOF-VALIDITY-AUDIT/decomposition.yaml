- id: synthesize-final-audit
  description: >
    Merge the twenty individual proof audit results from /logs/agent/proof_01.json through
    /logs/agent/proof_20.json into a single dataset-level report. Use
    /input_artifacts/proof_manifest.json for metadata. The report must have artifact_audits
    sorted by artifact_id (ascending), summary.competitions_covered sorted alphabetically,
    summary.correct_problem_ids and summary.incorrect_problem_ids each sorted alphabetically,
    and correct_count and incorrect_count matching the actual verdicts. Write the final
    JSON to /logs/agent/output.json in the exact format specified in the task instructions.
  depends_on: [audit-proof_01, audit-proof_02, audit-proof_03, audit-proof_04, audit-proof_05, audit-proof_06, audit-proof_07, audit-proof_08, audit-proof_09, audit-proof_10, audit-proof_11, audit-proof_12, audit-proof_13, audit-proof_14, audit-proof_15, audit-proof_16, audit-proof_17, audit-proof_18, audit-proof_19, audit-proof_20]
  parallel_group: synthesize

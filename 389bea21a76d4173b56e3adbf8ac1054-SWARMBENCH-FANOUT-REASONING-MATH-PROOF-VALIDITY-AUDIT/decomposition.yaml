  description: >
    Audit proof_01 (BMOSL_2016_18, BMOSL, number theory).
    The domain background at /input_artifacts/background_number_theory.md contains mathematical theory and worked examples relevant to this proof. The proof itself is at /input_artifacts/proofs/proof_01.md
    and the judging standards are at /input_artifacts/judging_rubric.md.
    Decide whether the candidate solution is mathematically correct or incorrect.
    If incorrect, identify the earliest material issue in one short sentence.
    If correct, set first_material_issue_summary to none.
    Write a JSON object with artifact_id, problem_id, competition, verdict,
    and first_material_issue_summary to /logs/agent/proof_01.json.
  depends_on: []
  parallel_group: audit

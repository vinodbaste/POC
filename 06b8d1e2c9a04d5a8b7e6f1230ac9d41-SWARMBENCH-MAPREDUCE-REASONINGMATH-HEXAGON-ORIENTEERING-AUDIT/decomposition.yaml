  - id: reduce-final-audit
    description: >
      Read the geometry-adjudication note and all eight response-audit notes. Then independently
      re-open /input_artifacts/problem.md and all eight response files to verify the final order and
      every label. Do not decide correctness by majority vote among response orders; multiple
      responses can share the same wrong schedule. The final JSON must contain correct_order,
      acceptable_solution_ids, and per_response_assessment for A through H in order. Do not include
      prose justification fields. Write the final JSON to /logs/agent/output.json.
    depends_on:

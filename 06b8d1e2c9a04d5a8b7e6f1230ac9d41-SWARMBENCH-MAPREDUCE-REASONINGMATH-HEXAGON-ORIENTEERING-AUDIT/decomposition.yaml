sub_tasks:
  - id: geometry-adjudication
    description: >
      Read /input_artifacts/problem.md and all eight proposed solution files. Your sole job is to
      independently adjudicate the true optimal schedule. Identify which tasks require both runners,
      which tasks are solo-capable, and which flag dependencies are forced. Use unit side length for
      the regular hexagon and compare the critical feasible schedule families, including schedules
      that use runner-splitting rather than simply walking around the boundary. Do not decide by
      majority vote among the responses. Return a compact note containing the correct order, the
      response IDs that are fully correct if any, and a short explanation of why the tempting
      sequential boundary-walk schedules are or are not optimal.
    depends_on: []
    parallel_group: map

  - id: audit-response-a
    description: >
      Read /input_artifacts/problem.md and /input_artifacts/proposed_solutions/response_A.md.
      Audit only Response A. Extract its final claimed task order as a normalized string.
      Decide whether the final order is correct. Evaluate all labels exactly as defined in the
      main task. Return a compact JSON-style note for Response A only.
    depends_on: []
    parallel_group: map


  - id: synthesize-final-audit
    description: >
      Stitch upstream sub-agent reports into the final JSON. Do NOT
      re-derive minimum_tiles and do NOT re-classify any response. Copy
      answer.minimum_tiles and anchor_results from derive-minimum-tiles
      verbatim. Build per_response_assessment as a list in order A..P
      where each object's fields come verbatim from the corresponding
      audit-response-X. Compute acceptable_solution_ids as the
      alphabetically-sorted list of letters with
      final_answer_correct=true AND failure_reasons=[]. Write to
      /logs/agent/output.json. Top-level keys exactly: answer,
      anchor_results, acceptable_solution_ids, per_response_assessment.
      Return {"status":"written","path":"/logs/agent/output.json"} as
      mechanical telemetry — do NOT return a free-form summary.
    depends_on:
      - derive-minimum-tiles
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f

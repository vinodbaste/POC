version: 1
coordination_pattern: fan-out-synthesize
estimated_sub_agents: 18

description: >
  Derive the minimum number of axis-aligned rectangular tiles (each area ≤ 3)
  needed to partition a 4×4 grid, then audit sixteen proposed solutions
  against five phrase-triggered failure codes.

  ORCHESTRATOR RESTRICTIONS (binding):

    FORBIDDEN — the orchestrator MUST NOT read any file under
    /input_artifacts/, perform any arithmetic on or sanity-check any
    sub-agent's return value, re-classify any audit verdict, re-derive
    minimum_tiles or anchor values, or restate per-response results in
    its final message. The orchestrator's final assistant message MUST be
    EXACTLY one sentence: "Output written to /logs/agent/output.json."

    REQUIRED — the orchestrator MUST dispatch all parallel sub-tasks in
    one step, then dispatch the synthesizer once they return, then emit
    the one-sentence acknowledgement. Target step count: 3-4.

sub_tasks:
  - id: derive-minimum-tiles
    description: >
      Read /workspace/instruction.md and /input_artifacts/problem.md only.
      Independently determine minimum_tiles for the 4×4 grid under the
      modified problem (partition into axis-aligned rectangles each of
      area at most 3). Combine an area-based lower bound with an explicit
      witness construction. Also compute minimum_tiles for the five anchor
      grids anchor_2x2, anchor_3x3, anchor_5x5, anchor_6x6, anchor_8x8 by
      the same method, verifying achievability for each. Return
      answer.minimum_tiles and anchor_results.{anchor_2x2, anchor_3x3,
      anchor_5x5, anchor_6x6, anchor_8x8}. Do not inspect any proposed
      response except as an after-the-fact non-voting cross-check.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      Read /workspace/instruction.md, /input_artifacts/problem.md, and
      /input_artifacts/proposed_solutions/response_A.md. Audit only
      Response A. Extract its final stated minimum_tiles and decide
      final_answer_correct against the modified-problem gold (which you
      derive yourself if needed). Then determine the exact set of
      failure_reasons whose trigger phrase is concretely present in this
      single response, drawn ONLY from {F1, F2, F3, F4, F5} defined in
      instruction.md. Most responses have 0, 1, or 2 failure reasons.
      Return failure_reasons=[] when the final answer is correct AND no
      trigger phrase fires. Do not infer from other responses.
    depends_on: []
    parallel_group: fan-out


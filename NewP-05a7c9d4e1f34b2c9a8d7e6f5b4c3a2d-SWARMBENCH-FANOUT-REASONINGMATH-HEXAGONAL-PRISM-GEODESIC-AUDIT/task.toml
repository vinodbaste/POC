estimated_sub_agents = 9
input_token_estimate = 8000
why_multi_agent = "Audit requires one olympiad geometry derivation across multiple unfolding families plus seven per-response phrase-trigger classifications across five overlapping failure codes. A single agent multiplexing derivation and seven audits drops failure-code co-fires through focus dilution and is prone to vote-following on the popular-but-nonminimal lateral-strip answer. Fan-out gives each sub-agent one narrow task and a mechanical synthesizer copies upstream verdicts verbatim. The advantage is cognitive specialization, not context-window overflow."

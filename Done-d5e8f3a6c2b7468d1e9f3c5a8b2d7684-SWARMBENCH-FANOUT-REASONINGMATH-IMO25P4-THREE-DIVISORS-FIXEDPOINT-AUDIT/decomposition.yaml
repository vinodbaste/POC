version: 1
coordination_pattern: fan-out-synthesize
estimated_sub_agents: 16

description: >
  Derive fixed_point_count for s(n)=n in [4,30] using "three largest proper
  divisors", and audit fourteen proposed solutions against four phrase-triggered
  failure codes.

  ORCHESTRATOR RESTRICTIONS (binding):

    FORBIDDEN — the orchestrator MUST NOT read any file under
    /input_artifacts/, re-compute s(n) for any n, re-classify any
    audit verdict, or restate verdicts in its final message. Final
    assistant message MUST be EXACTLY: "Output written to
    /logs/agent/output.json."

    REQUIRED — dispatch all parallel sub-tasks in one step, then the
    synthesizer, then the one-sentence acknowledgement. Target step
    count: 3-4.

sub_tasks:
  - id: derive-fixed-point-count
    description: >
      Read /workspace/instruction.md and /input_artifacts/problem.md only.
      Independently enumerate n in [4, 30], filter to those with at least
      three proper divisors, list the three largest proper divisors for
      each surviving n, compute s(n), and identify which n satisfy
      s(n) = n. Return answer.fixed_point_count and
      anchor_results.{five fields}. Do not inspect any proposed response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      Read /workspace/instruction.md, /input_artifacts/problem.md, and
      /input_artifacts/proposed_solutions/response_A.md. Audit only
      Response A. Extract its final stated fixed_point_count and decide
      final_answer_correct. Then determine the exact set of failure_reasons
      whose trigger phrase is concretely present in this single response,
      drawn ONLY from {F1, F2, F3, F4} defined in instruction.md. Most
      responses have 0, 1, or 2 failure reasons. Return failure_reasons=[]
      when the final answer is correct AND no trigger phrase fires.
      Do not infer from other responses.
    depends_on: []
    parallel_group: fan-out


      Do not audit other responses.
    depends_on: []
    parallel_group: map

  - id: audit-response-e
    description: >
      Read /input_artifacts/problem.tex and /input_artifacts/proposed_solutions/response_E.tex only.
      Audit response E against the label definitions in instruction.md: extract its final residue modulo 1000,

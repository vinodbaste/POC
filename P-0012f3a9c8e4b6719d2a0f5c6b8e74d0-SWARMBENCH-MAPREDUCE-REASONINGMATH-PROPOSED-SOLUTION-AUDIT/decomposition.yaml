  - id: reduce-final-json
    description: >
      Use the core mathematical adjudication and all eight response-audit outputs.
      Reconcile any disagreement by re-checking the exact definitions in instruction.md, especially the primary_error_code field, the exact nonuniform
      count over m=0,...,9999 and the distinction between calculation error, invalid uniformity, and sample-space error.
      Produce the final JSON with exactly the schema requested in instruction.md and write it to /logs/agent/output.json.
      Do not omit any response object and keep response order A through H.
    depends_on:
      - core-math-adjudicator
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
    parallel_group: reduce

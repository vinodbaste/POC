[task]
name = "swarmbench/c4e2b8f01a7d953e6b0f84c2a19d7e35-SWARMBENCH-MAPREDUCE-REASONING-MATH-ANNOTATED-FIRST-STEP-ERROR-CHOICE-AUDIT"
description = "Audit 28 LLM-generated incorrect math solutions from ProcessBench and choose which candidate step excerpt contains the first unrecoverable reasoning error."

[metadata]
verifier_type = "llm-judge"
domain = "reasoning-math"
coordination_pattern = "map-reduce"
human_solving_hours_estimate = 21.0
human_solving_hours_justification = "28 artifacts x 30 minutes each = 14.0 hours for reading each multi-step solution, verifying each candidate step excerpt against the mathematical argument, and selecting the first erroneous step; plus 3.0 hours to reconcile shard-level counts and dataset-wide option summaries; plus 4.0 hours for consistency checks and final report QA. Total = 21.0 hours."
estimated_sub_agents = 8
input_token_estimate = 52400
why_multi_agent = "The task requires 28 independent step-error-localization judgments across two competition-math sources (OlympiadBench and OmniMath). Each artifact contains a full competition problem, a multi-step LLM-generated incorrect solution, and four candidate step excerpts that must be evaluated to locate the first unrecoverable error. A single agent must carry 28 separate judgments plus shard and dataset summaries at once, creating coverage and bookkeeping pressure. In a map-reduce setup, seven mapper agents can each own four artifacts in isolated context and return exact option letters, while one reducer verifies global counts and assembles the final JSON."
reference_link = "https://huggingface.co/datasets/Qwen/ProcessBench"

[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

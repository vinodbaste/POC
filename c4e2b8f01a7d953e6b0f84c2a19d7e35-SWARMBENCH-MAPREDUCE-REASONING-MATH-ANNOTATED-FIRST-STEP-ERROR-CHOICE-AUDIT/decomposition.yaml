sub_tasks:
  - id: shard_01
    description: >
      Read /input_artifacts/artifacts/artifact_01.md through
      /input_artifacts/artifacts/artifact_04.md and
      /input_artifacts/review_rubric.md.
      For each artifact, identify the first step where the solution makes an
      unrecoverable reasoning error and choose exactly one option letter A-D.
      Also classify the error category for each artifact as exactly one of: unjustified_claim, misapplied_theorem, algebraic_error, case_error, circular_reasoning.
      Write /logs/agent/shard_01.json with the shard_id "shard_01",
      the four artifact audits (each including selected_option and error_category), and a choice_counts summary.
      Each audit entry must follow this structure:
        {"artifact_id": "artifact_01", "selected_option": "X", "error_category": "Y"}
      Replace each X with the chosen option letter and each Y with the classified error category.
    depends_on: []
    parallel_group: map


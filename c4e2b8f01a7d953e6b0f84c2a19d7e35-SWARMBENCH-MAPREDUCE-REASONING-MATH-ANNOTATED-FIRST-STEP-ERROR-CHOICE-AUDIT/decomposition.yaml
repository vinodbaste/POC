  - id: reduce-final
    description: >
      Read all seven map shard JSON files (/logs/agent/shard_01.json through
      /logs/agent/shard_07.json) and all seven verify shard JSON files
      (/logs/agent/verify_01.json through /logs/agent/verify_07.json).
      For artifact metadata (problem_id, competition, year) read
      /input_artifacts/artifact_manifest.json.
      For each artifact, apply consensus logic: if the map shard and verify shard
      agree on both selected_option and error_category, use that value; if they
      disagree on either field, re-read the artifact and reviewer note to resolve.
      Merge every artifact audit (including error_category), sort artifact_audits
      by artifact_id, sort shard_summaries by shard_id, compute exact global
      choice_counts, competition_counts, year_counts, and artifacts_by_option,
      then write /logs/agent/output.json.
      Each artifact_audit entry in the output must include: artifact_id,
      problem_id, competition, year, selected_option, and error_category.
    depends_on:
      - shard_01
      - shard_02
      - shard_03
      - shard_04
      - shard_05
      - shard_06
      - shard_07
      - verify_01
      - verify_02
      - verify_03
      - verify_04
      - verify_05
      - verify_06
      - verify_07
    parallel_group: reduce

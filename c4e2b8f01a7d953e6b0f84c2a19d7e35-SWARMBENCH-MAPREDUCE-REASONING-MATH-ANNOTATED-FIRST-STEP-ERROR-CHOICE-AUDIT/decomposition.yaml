    description: >
      Read all seven shard JSON files written by the mapper tasks
      (/logs/agent/shard_01.json through /logs/agent/shard_07.json).
      For artifact metadata (problem_id, competition, year) read
      /input_artifacts/artifact_manifest.json.
      Merge every artifact audit, sort artifact_audits by artifact_id,
      sort shard_summaries by shard_id, compute exact global choice_counts,
      competition_counts, year_counts, and artifacts_by_option, then write
      /logs/agent/output.json.
    depends_on:
      - shard_01
      - shard_02
      - shard_03
      - shard_04
      - shard_05
      - shard_06
      - shard_07
    parallel_group: reduce

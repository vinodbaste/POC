sub_tasks:
  - id: verify-extremal-formulas
    description: >
      Read /input_artifacts/problem.md to understand the contiguous-interval
      visibility constraint. The problem asks for two distinct extremes over
      all valid star-interval configurations consistent with the visibility
      array A: m is the SMALLEST possible total number of distinct stars,
      and M is the LARGEST possible total number of distinct stars. Derive m
      and M from first principles. For each extremum produce BOTH (a) an
      explicit construction of star intervals that achieves your claimed
      value, and (b) a tight bound proof. Be deliberate about the
      optimization direction at every step: bounds and identities that look
      similar can apply to different extremes for different reasons, so
      double-check that any inequality you write is actually pushing in the
      direction you intend. Sanity-check your derivation on small synthetic
      arrays of length one and two before applying it to the full A. After
      your independent derivation, briefly compare your numerical m, M, m+M
      against the values claimed in the eight proposed responses; this is
      a sanity check, not a vote, so do not adopt any value just because it
      is popular, but if your derivation contradicts a clear majority of
      responses, re-examine your reasoning before settling on a final answer.
      Output the verified m, M, m+M, the construction and proof for each,
      and a short list of common reasoning traps. Do not assign correctness
      labels to any candidate response and do not classify failure reasons.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_A.md. Audit only
      Response A. Extract the response's stated numerical values of m, M,
      and m+M, the closed-form expressions or invariants it claims for
      each extremum, the optimality argument or construction it offers,
      and any arithmetic it performs. Decide whether the response's stated
      final value of m+M is mathematically correct and whether its
      extremal reasoning is valid as a proof. Produce the exact applicable
      failure_reasons set chosen from these six allowed codes:
      wrong_minimum_formula, wrong_maximum_formula, arithmetic_error,
      ignored_continuity_constraint, invalid_or_incomplete_justification,
      final_answer_error. Apply each code only when its trigger condition
      is concretely present in this response's text. Do not infer
      correctness from other proposed responses or from other audit
      sub-tasks; each audit must rest entirely on the contents of this one
      response.
    depends_on: []
    parallel_group: fan-out


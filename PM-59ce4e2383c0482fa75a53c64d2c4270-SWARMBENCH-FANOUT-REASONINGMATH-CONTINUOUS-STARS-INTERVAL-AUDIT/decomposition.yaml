  - id: synthesize-final-audit
    description: >
      Stitch the upstream sub-agent reports into the final JSON document
      that the verifier expects. Do NOT re-derive the problem and do NOT
      re-classify any response. Specifically: copy correct_values.m,
      correct_values.M, and correct_values.m_plus_M directly from the
      verify-extremal-formulas sub-agent's output (verify that
      m_plus_M = m + M). Build per_response_assessment as a list of eight
      objects in the order A, B, C, D, E, F, G, H, where each object's
      response_id, final_answer_correct, and failure_reasons fields come
      verbatim from the corresponding audit-response-X sub-agent's output.
      Compute acceptable_solution_ids as the alphabetically-sorted list of
      response letters whose audit reported final_answer_correct=true and
      failure_reasons=[] (use [] when no response qualifies). Validate the
      JSON schema described in instruction.md and write the document to
      /logs/agent/output.json. If any upstream sub-agent's output is
      missing or malformed, escalate by leaving its slot blank and noting
      the missing piece, but do not invent values; mechanical reconciliation
      only.
    depends_on:
      - verify-extremal-formulas
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
    parallel_group: synthesize

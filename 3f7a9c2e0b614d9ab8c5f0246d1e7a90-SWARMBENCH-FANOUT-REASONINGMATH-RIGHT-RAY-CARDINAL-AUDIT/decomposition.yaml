sub_tasks:
  - id: derive-ground-truth
    description: >
      Read /input_artifacts/candidate_solutions.md. Independently solve the original
      problem from the definitions in the prompt. Summarize the correct answer and the
      main checks needed to classify the candidate submissions using the labels in
      instruction.md.
    depends_on: []
    parallel_group: analysis

  - id: audit-response-a
    description: >
      Read /input_artifacts/candidate_solutions.md and audit only Response A. Return
      response_id, final_answer_correct, proof_valid, verdict, primary_error_label, and
      required_evidence_label using only the allowed values from instruction.md.
    depends_on: []
    parallel_group: analysis


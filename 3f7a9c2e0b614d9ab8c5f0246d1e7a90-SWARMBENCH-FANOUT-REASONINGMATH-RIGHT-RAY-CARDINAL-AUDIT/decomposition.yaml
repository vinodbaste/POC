  - id: synthesize-final-report
    description: >
      Merge the independent ground-truth derivation and all eight response audits. Resolve
      disagreements by rechecking the problem statement and the label definitions in
      instruction.md. Write the final JSON object to /logs/agent/output.json using exactly
      the schema in instruction.md.
    depends_on:

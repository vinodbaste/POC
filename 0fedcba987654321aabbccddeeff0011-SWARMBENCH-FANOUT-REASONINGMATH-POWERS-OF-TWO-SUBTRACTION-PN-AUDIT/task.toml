[task]
name = "swarmbench/0fedcba987654321aabbccddeeff0011-SWARMBENCH-FANOUT-REASONINGMATH-POWERS-OF-TWO-SUBTRACTION-PN-AUDIT"
description = "Solve a deterministic combinatorial game theory problem (P/N classification for the Powers-of-Two Subtraction Game on pile sizes 0 through 100) and audit eight real, unedited model responses. A shared gold-derivation agent establishes the 101-character P/N classification string by dynamic programming over the powers-of-two move set {1, 2, 4, 8, 16, 32, 64}; a rubric-calibration agent re-states the instruction's thirteen failure-code triggers; eight isolated response auditors each own one response; a primary-code adjudicator re-checks failure_reasons sets and primary_failure_code selections; a synthesizer assembles the deterministic top-level code_application_table and response_count_per_code."

[metadata]
verifier_type = "llm-judge"
domain = "reasoning-math"
coordination_pattern = "fan-out-synthesize"
human_solving_hours_estimate = 11
human_solving_hours_justification = "Estimated from a reviewer-grade end-to-end mathematical workflow. (a) Independent derivation of the gold 101-character P/N classification string from first principles, running the DP over the powers-of-two move set up to 100 (move set has 7 elements: {1, 2, 4, 8, 16, 32, 64}) and verifying the period-3 NPN repetition: 1.0h. (b) Rubric boundary calibration for exact-set failure-code matching across the 13 codes (three move-set variants, two convention variants, explicit misere, two framework misapplications, DP arithmetic, periodicity, heuristic, presentation, non-terminating): 0.8h. (c) Mathematical analysis of each released response's reasoning chain - identifying its enumerated move set, P/N convention, base-case treatment, DP arithmetic, framework choice, and final P/N string: 8 x 0.85h = 6.8h. (d) Reconciling the eight audits into a coherent verifier-aligned output: 1.4h. (e) Cross-check of weighted scoring and execution-log consistency: 1.0h. Total: 1.0 + 0.8 + 6.8 + 1.4 + 1.0 = 11.0h. Mathematical reasoning remains the primary cognitive activity because every audit depends on the dynamic-programming gold and exact P/N/code interpretation."
estimated_sub_agents = 10
input_token_estimate = 6700
why_multi_agent = "The task uses a fan-out audit workflow with all-or-nothing per-response scoring: each of the eight responses earns 30 points only if (response_id, final_answer_correct, exact failure_reasons set) all match the oracle for that response. A single extra or missing code in a response's failure_reasons set forfeits the full 30 points for that response. The 13-code controlled vocabulary contains several pairs of near-overlapping codes whose triggers a single agent juggling all eight responses simultaneously routinely confuses: framework codes (computes_grundy_instead_of_pn vs confuses_with_nim_xor), convention codes (confused_pn_convention vs base_case_set_to_n vs treats_game_as_misere), periodicity codes (claims_wrong_period vs arbitrary_pattern_heuristic), and presentation codes (truncated_or_short_string vs non_terminating_or_no_final_answer). Even though the eight short candidate responses fit in a single agent's context (~6.7K tokens), the per-response strict-set scoring forces every code assignment to be exactly correct or zero, and single-agent attention across eight responses simultaneously systematically introduces one trigger-misclassification per ambiguous response. The decomposition assigns one gold-derivation agent that runs the DP once and shares the 101-character anchor, eight isolated response auditors each focused on a single response's text in isolation, and one synthesizer that composes the final JSON. The isolation prevents cross-response trigger confusion, and the gold-derivation sub-agent's bounded scope makes the DP derivation tractable in a single context."
reference_link = "https://en.wikipedia.org/wiki/Subtraction_game"

[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

[task]
name = "swarmbench/0fedcba987654321aabbccddeeff0011-SWARMBENCH-FANOUT-REASONINGMATH-POWERS-OF-TWO-SUBTRACTION-PN-AUDIT"
description = "Solve a deterministic combinatorial game theory problem (P/N classification for the Powers-of-Two Subtraction Game on pile sizes 0 through 100) and audit eight real, unedited model responses. A shared gold-derivation agent establishes the 101-character P/N classification string by dynamic programming over the powers-of-two move set {1, 2, 4, 8, 16, 32, 64}; a rubric-calibration agent re-states the instruction's thirteen failure-code triggers; eight isolated response auditors each own one response; a primary-code adjudicator re-checks failure_reasons sets and primary_failure_code selections; a synthesizer assembles the deterministic top-level code_application_table and response_count_per_code."

[metadata]
verifier_type = "llm-judge"
domain = "reasoning-math"
coordination_pattern = "fan-out-synthesize"
human_solving_hours_estimate = 11
human_solving_hours_justification = "Estimated from a reviewer-grade end-to-end mathematical workflow. (a) Independent derivation of the gold 101-character P/N classification string from first principles, running the DP over the powers-of-two move set up to 100 (move set has 7 elements: {1, 2, 4, 8, 16, 32, 64}) and verifying the period-3 NPN repetition: 1.0h. (b) Rubric boundary calibration for exact-set failure-code matching across the 13 codes (three move-set variants, two convention variants, explicit misere, two framework misapplications, DP arithmetic, periodicity, heuristic, presentation, non-terminating): 0.8h. (c) Mathematical analysis of each released response's reasoning chain - identifying its enumerated move set, P/N convention, base-case treatment, DP arithmetic, framework choice, and final P/N string: 8 x 0.85h = 6.8h. (d) Reconciling the eight audits into a coherent verifier-aligned output: 1.4h. (e) Cross-check of weighted scoring and execution-log consistency: 1.0h. Total: 1.0 + 0.8 + 6.8 + 1.4 + 1.0 = 11.0h. Mathematical reasoning remains the primary cognitive activity because every audit depends on the dynamic-programming gold and exact P/N/code interpretation."
estimated_sub_agents = 10
input_token_estimate = 8000
why_multi_agent = "The task is a high-cognitive-load mathematical audit under strict all-or-nothing per-response scoring. Each of the eight per-response audits earns 30 of 244 total points only if (response_id, final_answer_correct, EXACT failure_reasons set) all match the oracle for that response; a single extra or missing code in the failure_reasons set forfeits the full 30 points. The 13-code controlled vocabulary contains FOUR pairs of near-overlapping codes whose triggers are systematically conflated by single-agent attention across multiple response audits: framework codes (computes_grundy_instead_of_pn vs confuses_with_nim_xor), convention codes (confused_pn_convention vs base_case_set_to_n vs treats_game_as_misere), periodicity codes (claims_wrong_period vs arbitrary_pattern_heuristic), and presentation codes (truncated_or_short_string vs non_terminating_or_no_final_answer). The audit is also math-derivation-anchored: every code application requires the auditor to independently run the period-3 dynamic-programming recurrence over the powers-of-two move set M = {1, 2, 4, 8, 16, 32, 64} and compare each candidate response's claimed classification against the 101-character gold string. Empirically a single agent producing all eight per-response audits in one context window introduces a code-set error on the majority of responses, zeroing those response blocks; pilot single-agent runs consistently score near zero on the per-response component. The fan-out decomposition assigns one gold-derivation sub-agent that runs the DP once and shares the 101-character anchor, eight isolated response auditors each focused on a single response's text in isolation under uniform trigger-disambiguation rules, and one synthesizer that mechanically composes the final JSON from the eight mapper outputs and the gold packet. The isolation prevents cross-response trigger confusion across the 13-code vocabulary, and the gold-derivation sub-agent's bounded scope makes the math-derivation step reliable rather than competing for attention with eight simultaneous classification tasks."
reference_link = "https://en.wikipedia.org/wiki/Subtraction_game"

[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

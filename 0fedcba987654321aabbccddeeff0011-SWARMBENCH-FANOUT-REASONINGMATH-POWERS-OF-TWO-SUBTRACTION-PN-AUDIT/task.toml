[task]
name = "swarmbench/0fedcba987654321aabbccddeeff0011-SWARMBENCH-FANOUT-REASONINGMATH-POWERS-OF-TWO-SUBTRACTION-PN-AUDIT"
description = "Solve a deterministic combinatorial game theory problem (P/N classification for the Powers-of-Two Subtraction Game on pile sizes 0 through 100) and audit eight real, unedited model responses. A shared gold-derivation agent establishes the 101-character P/N classification string by dynamic programming over the powers-of-two move set {1, 2, 4, 8, 16, 32, 64}; a rubric-calibration agent re-states the instruction's thirteen failure-code triggers; eight isolated response auditors each own one response; a primary-code adjudicator re-checks failure_reasons sets and primary_failure_code selections; a synthesizer assembles the deterministic top-level code_application_table and response_count_per_code."

[metadata]
verifier_type = "llm-judge"
domain = "data-analysis"
coordination_pattern = "fan-out-synthesize"
human_solving_hours_estimate = 13
human_solving_hours_justification = "Estimated from a reviewer-grade end-to-end audit workflow. (a) Independent derivation of the gold 101-character P/N classification string by running the DP over the powers-of-two move set up to 100 (move set has 7 elements: {1, 2, 4, 8, 16, 32, 64}), verifying the period-3 NPN repetition: 1.0h. (b) Calibration of the thirteen failure-code triggers (three move-set variants, two convention variants, explicit misere, two framework misapplications, DP arithmetic, periodicity, heuristic, presentation, non-terminating) and the universal primary-code selection rules: 1.0h. (c) Per-response close reading of each released response's reasoning chain, claimed move set, base-case convention, DP arithmetic, framework choice, and final P/N string: 8 x 0.8h = 6.4h. (d) Mapping each response to its exact failure-reasons set, choosing the primary_failure_code per the universal selection rules, drafting per-code evidence quotations and alternative-codes-considered entries: 8 x 0.4h = 3.2h. (e) Building the cross-response code_application_table, response_count_per_code, and cross_response_observations synthesis: 1.4h. Total: 1.0 + 1.0 + 6.4 + 3.2 + 1.4 = 13.0h."
estimated_sub_agents = 12
input_token_estimate = 6700
why_multi_agent = "The task decomposes into a fan-out audit workflow whose multi-agent advantage is COORDINATION QUALITY, not context overflow. The eight short candidate responses plus instruction fit in a single agent's context (~6.7K tokens), so the gap mechanism is the cascade between per-response classification accuracy and the deterministic top-level aggregation tables. The 13-code controlled vocabulary contains several pairs of near-overlapping codes whose triggers a single agent juggling all eight responses simultaneously routinely confuses: framework codes (computes_grundy_instead_of_pn vs confuses_with_nim_xor), convention codes (confused_pn_convention vs base_case_set_to_n vs treats_game_as_misere), periodicity codes (claims_wrong_period vs arbitrary_pattern_heuristic), and presentation codes (truncated_or_short_string vs non_terminating_or_no_final_answer). Each per-response misclassification cascades into wrong sorted-list cells in code_application_table (13 keys at 100 points each) and wrong integer cells in response_count_per_code (13 keys at 20 points each). The decomposition assigns one gold-derivation agent that runs the DP once and shares the 101-character anchor, one rubric-calibration agent that re-states the 13 triggers and primary-code selection rules, eight isolated response auditors each focused on a single response, a primary-code adjudicator that re-checks failure_reasons sets and primary_failure_code selections under uniform trigger-pattern rules, and a synthesizer that builds both deterministic aggregation tables mechanically from the corrected per-mapper outputs. The isolation prevents cross-response code confusion, the adjudicator re-applies disambiguation rules uniformly rather than ad hoc, and the synthesizer's mechanical reduction cannot miss a cell that single-agent attention drift would skip."
reference_link = "https://en.wikipedia.org/wiki/Subtraction_game"

[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

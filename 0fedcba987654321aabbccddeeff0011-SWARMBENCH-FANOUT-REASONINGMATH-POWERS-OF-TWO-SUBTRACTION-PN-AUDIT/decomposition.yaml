  - id: adjudicate-primary-failure-codes
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this adjudicator as a
      sub-agent using the Agent tool after all eight response auditors
      finish. Do NOT do this adjudication in the orchestrator. The
      adjudicator must consume the gold packet, the calibration packet,
      the eight mapper outputs, and the eight candidate response files.
      Its job is narrowly to re-check the labels that dominate scoring
      and are easy to conflate: the failure_reasons set and the
      primary_failure_code per response. The adjudicator must apply the
      universal trigger-pattern rules and primary-code selection rules
      already specified in instruction.md uniformly to all eight
      responses; it must not introduce new analytical rules beyond what
      instruction.md already specifies. Return a structured JSON object
      keyed by response_id, each value containing only the fields whose
      mapper value should be CORRECTED with the corrected value and a
      one-sentence evidence quotation from the response. The reducer
      applies every correction mechanically without re-deriving.
    depends_on:
      - derive-gold-pn-string
      - calibrate-failure-code-boundaries
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
    parallel_group: adjudicate

  - id: synthesize-final-audit
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this synthesizer as a
      sub-agent using the Agent tool. Do NOT perform the final
      synthesis yourself. The synthesizer consumes the gold packet, the
      calibration packet, the eight audit objects, and the
      adjudicator's structured correction object. It MUST NOT re-derive
      the gold answer or re-audit individual responses. If any audit
      object is malformed, request a replacement sub-agent for that one
      response.

      Reducer procedure (apply mechanically, in order):
      (1) Start from the eight mapper evaluation objects.
      (2) For each response_id, overwrite each field that appears in
          the adjudicator's correction object with the corrected value.
      (3) Ensure failure_reason_evidence has a key for every code in
          the corrected failure_reasons set, each value at least 20
          characters; request replacement evidence from the original
          auditor sub-agent if missing.
      (4) Recompute acceptable_solution_ids as the alphabetically-
          sorted list of response_ids whose final_answer_correct is
          true AND failure_reasons is the empty list.
      (5) For each evaluation object, set per-response derived fields:
          code_application_count = len(failure_reasons); primary_in_set_check
          = (primary_failure_code in failure_reasons) OR (primary == "NONE"
          and failure_reasons is []); evidence_key_completeness = number of
          keys in failure_reason_evidence that are also in failure_reasons.
          Verifier scores these deterministically.
      (6) Build the top-level code_application_table with EXACTLY the
          13 keys of the failure-code vocabulary. Codes with no matching
          response have []. NEVER null, NEVER omit. Verifier scores
          100 per key.
      (7) Build the top-level response_count_per_code with EXACTLY the
          same 13 keys; integer values = lengths of the code_application_table
          lists. Verifier scores 20 per key.
      (11) Compose the top-level cross_response_observations string of
           at least 300 characters identifying shared defect patterns.
           Scores 30 by presence + length.

      The synthesizer writes exactly one JSON object to
      /logs/agent/output.json with the top-level keys gold_final_answer,
      acceptable_solution_ids, per_response_assessment (eight objects
      ordered A through H, each including response_id,
      final_answer_correct, failure_reasons, primary_failure_code,
      primary_failure_code_evidence, failure_reason_evidence,
      alternative_codes_considered, code_application_count,
      primary_in_set_check, evidence_key_completeness),
      code_application_table, response_count_per_code and cross_response_observations.
      CRITICAL: every dict aggregation field MUST contain every required
      key with a JSON-valid value (use [] for empty lists, 0 for empty
      integer counts — NEVER null, NEVER omit a key). Validate that the
      output file exists and parses as JSON before returning.
    depends_on:
      - derive-gold-pn-string
      - calibrate-failure-code-boundaries
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - adjudicate-primary-failure-codes
    parallel_group: synthesize

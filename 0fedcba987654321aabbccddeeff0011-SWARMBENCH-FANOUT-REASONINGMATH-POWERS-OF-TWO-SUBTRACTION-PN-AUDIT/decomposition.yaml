sub_tasks:
  - id: derive-gold-pn-string
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using the
      Agent tool. Do NOT perform this derivation yourself. The sub-agent must
      read /input_artifacts/problem.md itself and return a compact gold
      packet containing the 101-character P/N classification string it
      derives by running the dynamic-programming recurrence stated in the
      problem (position 0 = P; position n = N iff some legal move leads
      to a P-position). The packet must also include the move set the
      sub-agent enumerated and a short note on the base-case convention
      it used. Do not inspect any candidate response in this sub-task.
    depends_on: []
    parallel_group: fan-out

  - id: calibrate-failure-code-boundaries
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using the
      Agent tool. Do NOT perform this calibration yourself. The sub-agent
      must read the task instruction itself (which contains the
      authoritative TRIGGER definitions for the twelve failure-reason
      codes, the Failure-code disambiguation guidance section, the
      Primary failure code selection guidance section, the Worked
      scoring example, and the Common audit anti-patterns section) and
      return a concise calibration packet summarizing how to apply the
      twelve codes, the failure_reasons set-match rule, and the
      primary_failure_code selection rules. The sub-agent must not
      introduce new analytical rules beyond what instruction.md already
      specifies; its output is a structured re-statement of the
      instruction's authoritative trigger and selection rules for
      downstream auditors to reference.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_A using the Agent tool. Do NOT classify response_A
      yourself. The sub-agent must read
      /input_artifacts/proposed_solutions/response_A.md itself, use the
      gold packet and calibration packet, and return one JSON
      assessment object for response_id "A" with all required fields
      (response_id, final_answer_correct, failure_reasons,
      primary_failure_code, primary_failure_code_evidence,
      failure_reason_evidence, alternative_codes_considered) following
      the schema and minimum-length requirements in instruction.md.
    depends_on: [derive-gold-pn-string, calibrate-failure-code-boundaries]
    parallel_group: audit


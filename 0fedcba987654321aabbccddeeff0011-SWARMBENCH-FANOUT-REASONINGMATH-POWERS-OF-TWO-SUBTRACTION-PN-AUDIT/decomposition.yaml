sub_tasks:
  - id: derive-canonical-pn-classification
    description: >
      Read /input_artifacts/problem.md only. Independently compute the
      101-character P/N classification string for pile sizes 0 through 100
      using dp[0] = P and dp[k] = N iff some legal move m in M = {1, 2, 4, 8,
      16, 32, 64} (with m <= k) reaches a P-position. Return the derived
      classification string, the resulting period structure, and a concise
      mechanics summary for the synthesizer. Do not inspect any candidate
      response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_A.md. Audit only Response A.
      Decide whether its claimed 101-character classification matches the
      independently computed gold string. If it is wrong, return the exact
      applicable failure_reasons chosen from the thirteen-code vocabulary
      defined in instruction.md. Focus on Response A's overall output form:
      whether it commits to a single full 101-character P/N classification
      string at all, and on the stated period structure of its reasoning.
      Apply codes strictly per the universal trigger and disambiguation rules
      in instruction.md. Do not infer correctness from other proposed
      responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-b
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_B.md. Audit only Response B.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from the same thirteen-code vocabulary defined
      in instruction.md. Focus on Response B's stated move set and the length
      of its committed classification string. Apply codes strictly per the
      universal trigger and disambiguation rules in instruction.md. Do not
      infer correctness from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-c
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_C.md. Audit only Response C.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from the same thirteen-code vocabulary defined
      in instruction.md. Focus on Response C's treatment of the P/N
      convention (whether labels are globally swapped or only the base case
      is changed) and on the length of its committed classification string.
      Apply codes strictly per the universal trigger and disambiguation rules
      in instruction.md. Do not infer correctness from other proposed
      responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-d
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_D.md. Audit only Response D.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from the same thirteen-code vocabulary defined
      in instruction.md. Focus on Response D's base-case treatment at pile
      size 0 and on the length of its committed classification string. Apply
      codes strictly per the universal trigger and disambiguation rules in
      instruction.md. Do not infer correctness from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-e
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_E.md. Audit only Response E.
      Decide whether its claimed classification matches the independently
      computed gold string. If it is wrong, return the exact applicable
      failure_reasons chosen from the same thirteen-code vocabulary defined
      in instruction.md. Focus on whether Response E computes Sprague-Grundy
      values rather than binary P/N labels, and on the length of its
      committed classification string. Apply codes strictly per the universal
      trigger and disambiguation rules in instruction.md. Do not infer
      correctness from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-f
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_F.md. Audit only Response F.
      Decide whether Response F produces an identifiable final 101-character
      P/N classification at all. If the response loops on a repeated phrase,
      truncates mid-derivation, or otherwise never commits to a full
      classification string, classify as non_terminating_or_no_final_answer;
      this code stands alone when it fires (other codes that require a
      committed string do not co-apply). Otherwise return the exact
      applicable failure_reasons chosen from the same thirteen-code
      vocabulary defined in instruction.md. Apply codes strictly per the
      universal trigger and disambiguation rules. Do not infer correctness
      from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: synthesize-final-audit
    description: >
      Read the canonical classification produced by
      derive-canonical-pn-classification and the six per-response audit
      objects produced by audit-response-a through audit-response-f. Compose
      one JSON object with top-level keys gold_final_answer,
      acceptable_solution_ids, and per_response_assessment (six objects
      ordered A through F), as specified by instruction.md. Set
      final_answer_correct on each per-response object based on whether its
      claimed string equals the gold string character-for-character. Compute
      acceptable_solution_ids as the set of response_ids whose
      final_answer_correct is true AND whose failure_reasons list is empty.
      Do not re-derive the gold classification or re-audit individual
      responses in this step. If any audit object is malformed, request a
      replacement sub-agent for that one response. Write the JSON to
      /logs/agent/output.json and validate that the file exists and parses
      before returning.
    depends_on:
      - derive-canonical-pn-classification
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
    parallel_group: synthesize

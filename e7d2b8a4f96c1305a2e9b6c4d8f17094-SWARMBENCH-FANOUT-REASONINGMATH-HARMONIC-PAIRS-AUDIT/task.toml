[task]
name = "swarmbench/e7d2b8a4f96c1305a2e9b6c4d8f17094-SWARMBENCH-FANOUT-REASONINGMATH-HARMONIC-PAIRS-AUDIT"
description = "Audit six proposed solutions to a number-theory counting problem about harmonic ordered pairs (a, b) with 1 <= a, b <= 200 where ab + a + b is a perfect square and gcd(a+1, b+1) > 1, and identify each response's specific failure mode from a controlled six-code vocabulary."

[metadata]
verifier_type = "llm-judge"
domain = "reasoning-math"
coordination_pattern = "fan-out-synthesize"
human_solving_hours_estimate = 11.0
human_solving_hours_justification = "Estimated from a reviewer-grade end-to-end audit workflow: 1.5h to independently derive the gold count of 20 harmonic pairs via the (a+1)(b+1) = k^2+1 reduction, Fermat-on-sums-of-two-squares analysis (gcd common-prime divisor must be congruent to 1 mod 4), and Hensel-lift enumeration of valid k-values for p in {5, 13, 17, 29, 37}; 6 x 1.1h = 6.6h to audit six heterogeneous AI-generated responses, identify which structural step each gets right or wrong, and assign the exact failure_reasons subset from the 6-code vocabulary; 1.7h to reconcile conflicting audits, prepare the 184-point verifier-aligned oracle, and document response-specific rationale; 1.2h to validate JSON schema consistency. Total: 1.5 + 6.6 + 1.7 + 1.2 = 11.0h."
estimated_sub_agents = 8
input_token_estimate = 7500
why_multi_agent = "The task pairs a fixed gold-count adjudication with auditing six heterogeneous candidate responses against a 6-code failure_reasons vocabulary scored by exact set match per response. A single agent juggling all six responses in one context tends to confuse near-duplicate codes (especially arbitrary_final_count vs no_visible_derivation vs no_systematic_enumeration) and to apply codes whose trigger is only stylistically present in a different response, zeroing 30-point blocks. Fan-out gives the gold-count adjudication to one sub-agent and each candidate audit to its own sub-agent with an isolated context containing only that response plus the controlled vocabulary, so each audit picks codes whose concrete trigger phrase is directly observable in its single response. A synthesizer reconciles all labels into one schema."
reference_link = "https://en.wikipedia.org/wiki/Fermat%27s_theorem_on_sums_of_two_squares"

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

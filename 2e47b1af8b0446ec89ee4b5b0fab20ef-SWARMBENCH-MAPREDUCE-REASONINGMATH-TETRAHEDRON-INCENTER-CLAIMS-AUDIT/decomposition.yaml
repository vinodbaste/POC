sub_tasks:
  - id: audit-A-B
    description: |
      Audit two candidate solutions to an olympiad combinatorics problem. Read these files in full:
      - /input_artifacts/response_A.md
      - /input_artifacts/response_B.md

      ## The problem each candidate solved
      Let ABCD be a tetrahedron with inscribed sphere of center I and inradius r > 0. Suppose
      (1) all dihedral angles between faces are acute, and (2) vol(IABC)/BC = vol(IACD)/CD =
      vol(IADB)/DB. For each of the following 8 statements decide which are necessarily true:
        (a) AI is perpendicular to plane BCD.
        (b) Projection of A onto plane BCD = incenter of triangle BCD.
        (c) dist(A, BC) = dist(A, CD) = dist(A, DB).
        (d) Areas of ABC, ACD, ADB are in ratio BC:CD:DB.
        (e) Insphere touch point on face BCD = incenter of triangle BCD.
        (f) AB = AC = AD.
        (g) Triangle ABC isosceles with AB = AC.
        (h) Triangle BCD is equilateral.
      Gold answer set: {a, b, c, d, e}.

      ## What to return
      Return JSON: {"audits": [<audit for A>, <audit for B>]} where each audit is:
      {
        "response_id": "<A or B>",
        "final_answer_correct": <bool — claimed set equals {a,b,c,d,e}>,
        "proof_valid": <bool — argument is sound AND complete; false if proof uses a false universal claim>,
        "verdict": "<correct | incorrect | correct_final_answer_but_invalid_proof>",
        "primary_error_label": "<one label from vocab below>",
        "required_evidence_label": "<one label from vocab below>"
      }

      ## primary_error_label vocabulary (pick exactly one)
      - NO_ERROR
      - REJECTED_PERPENDICULARITY_WITHOUT_COUNTEREXAMPLE  (rejects (a) by asserting a counterexample exists but never constructs one)
      - FALSE_INSPHERE_FACE_INCENTER_UNIVERSAL_AS_PREMISE  (uses "insphere always tangent at face incenter" as a UNIVERSAL premise, which is false)
      - SELF_CONTRADICTORY_CENTROID_COUNTEREXAMPLE  ("A lies above centroid but not orthogonal" style; self-contradictory)
      - MISSED_VOLUME_TO_DISTANCE_EQUIVALENCE_IN_COT  (derives area/base ratio but never converts to dist(A, edge))
      - VAGUE_ALMOST_REGULAR_NON_CONSTRUCTION  (dismisses with "almost regular but slightly skewed" or similar non-construction)
      - WRONG_PROJECTION_TARGET  (distractor)
      - CIRCULAR_BISECTOR_ARGUMENT  (distractor)
      - OVERCLAIMS_EQUILATERAL_BCD  (distractor)

      ## required_evidence_label vocabulary (pick exactly one)
      - NO_ERROR
      - TETRAHEDRON_INCENTER_FORMULA_DERIVATION
      - DIRECT_TOUCH_POINT_DERIVATION_FROM_PERPENDICULARITY
      - PROJECTION_IS_INCENTER_NOT_CENTROID
      - AREA_OVER_BASE_EQUALS_HALF_DISTANCE_FROM_A
      - VOLUME_CONDITION_FORCES_PERPENDICULARITY
      - ACUTENESS_RULES_OUT_EXCENTER  (distractor)
      - DIHEDRAL_BISECTOR_LEMMA  (distractor)

      Do NOT write /logs/agent/output.json. Audit only.
    depends_on: []
    parallel_group: audit

  - id: audit-C-D
    description: |
      Same audit as audit-A-B. Files:
      - /input_artifacts/response_C.md
      - /input_artifacts/response_D.md
      Same problem, schema, and vocabularies. Note: one of these candidates may have the
      correct final answer set {a,b,c,d,e} but rely on a FALSE universal claim about
      inspheres ("the insphere of any tangential tetrahedron is tangent at the face incenter"
      — this is false in general). Treat such cases as proof_valid=false and
      verdict="correct_final_answer_but_invalid_proof".
      Return {"audits": [<C>, <D>]}.

      primary_error_label vocabulary: NO_ERROR, REJECTED_PERPENDICULARITY_WITHOUT_COUNTEREXAMPLE,
        FALSE_INSPHERE_FACE_INCENTER_UNIVERSAL_AS_PREMISE, SELF_CONTRADICTORY_CENTROID_COUNTEREXAMPLE,
        MISSED_VOLUME_TO_DISTANCE_EQUIVALENCE_IN_COT, VAGUE_ALMOST_REGULAR_NON_CONSTRUCTION,
        WRONG_PROJECTION_TARGET, CIRCULAR_BISECTOR_ARGUMENT, OVERCLAIMS_EQUILATERAL_BCD.
      required_evidence_label vocabulary: NO_ERROR, TETRAHEDRON_INCENTER_FORMULA_DERIVATION,
        DIRECT_TOUCH_POINT_DERIVATION_FROM_PERPENDICULARITY, PROJECTION_IS_INCENTER_NOT_CENTROID,
        AREA_OVER_BASE_EQUALS_HALF_DISTANCE_FROM_A, VOLUME_CONDITION_FORCES_PERPENDICULARITY,
        ACUTENESS_RULES_OUT_EXCENTER, DIHEDRAL_BISECTOR_LEMMA.

      Verdict values: correct | incorrect | correct_final_answer_but_invalid_proof.
      Do NOT write /logs/agent/output.json.
    depends_on: []
    parallel_group: audit

  - id: audit-E-F
    description: |
      Same audit as audit-A-B. Files:
      - /input_artifacts/response_E.md
      - /input_artifacts/response_F.md
      One of these candidates emits a visible chain-of-thought trace before its final answer.
      Read the entire response (trace + final) and audit it as a single submission.
      Watch for: (1) self-contradictory counterexamples ("above centroid but not orthogonal");
      (2) candidates that derive area/edge ratios but fail to translate to dist(A, edge).
      Return {"audits": [<E>, <F>]}.

      Same vocabularies as audit-C-D. Same verdict values.
      Do NOT write /logs/agent/output.json.
    depends_on: []
    parallel_group: audit

  - id: audit-G
    description: |
      Same audit as audit-A-B. File: /input_artifacts/response_G.md (single candidate).
      Return {"audits": [<G>]} (1-element array).

      Same vocabularies as audit-C-D. Same verdict values. Watch for: dismissive
      "almost regular" or "slightly skewed" non-constructions.
      Do NOT write /logs/agent/output.json.
    depends_on: []
    parallel_group: audit

  - id: verify-gold-math
    description: |
      Independently establish the gold answer to the problem. Do NOT read any candidate
      solution file.

      ## The problem
      Let ABCD be a tetrahedron with inscribed sphere of center I, inradius r > 0, all
      dihedral angles between faces acute, and vol(IABC)/BC = vol(IACD)/CD = vol(IADB)/DB.
      For each of the 8 statements (a)-(h) listed in the audit sub-tasks, decide whether
      it is necessarily true.

      Return JSON:
      {
        "gold_set": [<letters a..h alphabetical>],
        "key_lemmas": [
          "<short description of each key lemma needed for the proof, e.g.
            volume condition implies dist(A, BC) = dist(A, CD) = dist(A, DB);
            this forces A's projection on BCD to be the incenter of BCD;
            the tetrahedron-incenter formula implies I's projection coincides with A's
            projection; therefore AI is perpendicular to plane BCD; and therefore the
            insphere touches BCD at the incenter of triangle BCD.>"
        ],
        "false_universals_to_avoid": [
          "<each entry is a false GENERAL claim about tetrahedra inspheres that a weak
            candidate might invoke as a universal premise. Example: 'the insphere of any
            tangential tetrahedron is tangent to each face at the face-incenter' — FALSE in
            general; requires extra symmetry.>"
        ]
      }
      Do NOT write /logs/agent/output.json.
    depends_on: []
    parallel_group: verify

  - id: synthesize-final-audit
    description: |
      Receive four {"audits": [...]} payloads from audit-A-B, audit-C-D, audit-E-F, audit-G
      plus the reference brief from verify-gold-math. Merge into the final task output and
      write to /logs/agent/output.json.

      ## Reconciliation rules
      1. For each per-response audit: if final_answer_correct claim disagrees with whether
         the candidate's stated set equals the reference brief's gold_set, correct it.
      2. If verdict="correct" but proof_valid=false OR final_answer_correct=false, change
         verdict to "correct_final_answer_but_invalid_proof" or "incorrect" accordingly.
      3. If verdict="correct" set primary_error_label="NO_ERROR" and
         required_evidence_label="NO_ERROR".
      4. Both label fields must be drawn from the controlled vocabularies (see audit-A-B
         description for the full lists).
      5. response_id values uppercase A..G.

      ## Final output JSON — write ONLY this file: /logs/agent/output.json
      {
        "response_audits": [
          <7 reconciled audits, ordered alphabetically by response_id A..G; each audit has
           keys response_id, final_answer_correct, proof_valid, verdict, primary_error_label,
           required_evidence_label — no additional keys>
        ]
      }

      ## Self-checks before writing
      - Exactly 7 entries, ordered A, B, C, D, E, F, G.
      - Top-level keys exactly: response_audits.
      - Every entry has exactly these 6 keys: response_id, final_answer_correct, proof_valid,
        verdict, primary_error_label, required_evidence_label.
      - verdict in {correct, incorrect, correct_final_answer_but_invalid_proof}.
      - When verdict="correct": primary_error_label=NO_ERROR AND required_evidence_label=NO_ERROR.

      Write the final JSON to /logs/agent/output.json. This is the ONLY file you write.
    depends_on: [audit-A-B, audit-C-D, audit-E-F, audit-G, verify-gold-math]
    parallel_group: synthesize

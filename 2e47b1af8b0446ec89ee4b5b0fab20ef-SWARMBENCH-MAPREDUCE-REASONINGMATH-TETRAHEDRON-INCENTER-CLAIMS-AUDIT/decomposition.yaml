  - id: synthesize-final-audit
    description: >
      Combine the gold-set adjudication and nine response audits into the final JSON output.
      Trust each per-response audit's failure_reasons list. Do not add codes the audit did not
      identify, and do not delete codes the audit did identify. Resolve any inconsistency
      between final_answer_correct and the claimed-set comparison by re-reading the relevant
      response. Compute acceptable_solution_ids as the uppercase, alphabetically-sorted list
      of response_ids whose final_answer_correct is true AND failure_reasons is empty. Write
      the result to /logs/agent/output.json. Top-level keys exactly: gold_set,
      acceptable_solution_ids, per_response_assessment. per_response_assessment must contain
      exactly nine objects, ordered alphabetically A through I, each with exactly the keys
      response_id, final_answer_correct, failure_reasons.
    depends_on:
      - adjudicate-gold-set
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
    parallel_group: synthesize

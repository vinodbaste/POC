sub_tasks:
  - id: adjudicate-gold-set
    description: >
      Read /input_artifacts/problem.md only. Independently determine, for each of the eight
      statements (a) through (h), whether it is necessarily true for every tetrahedron ABCD
      satisfying the two hypotheses, then state the gold SET of statement labels that are
      necessarily true. Derive the key reductions yourself: from hypothesis (2) and the
      identity vol(IXYZ) = (1/3)*area(XYZ)*r, obtain area(ABC)/BC = area(ACD)/CD = area(ABD)/DB;
      then from area(ABX) = (1/2)*BX*dist(A, line BX) obtain dist(A, BC) = dist(A, CD) =
      dist(A, DB); then combine with the acuteness hypothesis to locate the projection of A on
      plane BCD; then conclude AI perpendicular to plane BCD and the insphere touch point on
      face BCD. Return a compact note containing the gold set in alphabetical lowercase form
      and a short explanation. Do not inspect or rely on any proposed response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      Read /input_artifacts/problem.md and /input_artifacts/proposed_solutions/response_A.md.
      Audit only Response A. Decide whether its claimed final SET of necessarily-true statement
      labels equals the gold set. If it is wrong, or if its proof has any defect, return the
      exact applicable failure_reasons chosen from:
      rejected_perpendicularity_no_counterexample, cascaded_rejection_of_e_from_a,
      correct_gtfa_invalid_proof_chain, false_universal_insphere_at_face_incenter,
      confused_centroid_and_incenter, self_contradictory_centroid_above,
      vague_word_salad_proofs, cot_trace_misses_distance_equivalence,
      repeats_false_universal_in_e, vague_almost_regular_nonconstruction,
      rejects_e_via_general_property_misapplied, false_claim_ai_equals_inradius,
      incoherent_ratio_argument_in_b, degenerate_counterexample_b_equals_c. Use an empty list
      exactly when the claimed set equals the gold AND the proof has no defect. Do not infer
      correctness or defect codes from other proposed responses.
    depends_on: []
    parallel_group: fan-out


  - id: synthesize-final-audit
    description: >
      Combine the gold-set adjudication and nine response audits. Resolve conflicts by
      independently re-opening /input_artifacts/problem.md and each response file, not by
      majority vote. Before writing the final output, verify for each response that the
      claimed set comparison against the gold set is correct and that failure_reasons contains
      the exact applicable allowed codes with no missing reasons and no extra reasons. Compute
      acceptable_solution_ids as the uppercase, alphabetically-sorted list of response_ids
      whose final_answer_correct is true AND failure_reasons is empty. Produce exactly the
      required JSON schema and write it to /logs/agent/output.json. Top-level keys exactly:
      gold_set, acceptable_solution_ids, per_response_assessment. per_response_assessment must
      contain exactly nine objects, ordered alphabetically A through I, each with exactly the
      keys response_id, final_answer_correct, failure_reasons.
    depends_on:
      - adjudicate-gold-set
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
    parallel_group: synthesize

sub_tasks:
  - id: audit-AB
    description: |
      You are auditing two candidate solutions to a math problem. You are NOT solving
      the problem yourself; you are judging two written solutions against the standard
      of mathematical correctness.

      ## The problem each candidate was given

      Let ABCD be a tetrahedron with an inscribed sphere of center I and inradius r>0.
      Suppose (1) the dihedral angle between any two faces of ABCD is acute, and
      (2) vol(IABC)/BC = vol(IACD)/CD = vol(IADB)/DB, where vol(IXYZ) is the volume
      of the tetrahedron with vertices I,X,Y,Z.

      For each of these eight statements the candidate had to decide whether the
      statement is necessarily true for every tetrahedron satisfying both hypotheses,
      then give the SET of necessarily-true statement labels:

      (a) AI is perpendicular to plane BCD.
      (b) The orthogonal projection of A onto plane BCD coincides with the incenter
          of triangle BCD.
      (c) The distances from A to each of the three lines BC, CD, DB are equal.
      (d) The areas of triangles ABC, ACD, ADB are in the ratio BC : CD : DB.
      (e) The point at which the inscribed sphere touches face BCD is the incenter of
          triangle BCD.
      (f) AB = AC = AD.
      (g) Triangle ABC is isosceles with AB = AC.
      (h) Triangle BCD is equilateral.

      ## Your task

      Read these two candidate files in full:
      - /input_artifacts/response_A.md
      - /input_artifacts/response_B.md

      For EACH of the two candidates, produce one solution-audit JSON object with these
      fields exactly:

      {
        "solution_id": "<the letter matching the file, A or B>",
        "claimed_set": [<lowercase letters from a..h, alphabetical, the set the
                        candidate claimed is necessarily true>],
        "verdict": "<correct | partially_correct | incorrect>",
        "final_answer_correct": <bool — whether claimed_set equals the actual gold set;
                                 you must judge this from the mathematics, not by
                                 comparison to any other candidate>,
        "logical_chain_valid": <bool — whether each inference in the candidate's proof
                                 actually follows from prior statements>,
        "proof_complete": <bool — whether every claim the candidate makes is fully
                            justified>,
        "contains_wrong_math_claim": <bool — whether the candidate states any
                                       mathematical fact that is false, even if the
                                       final answer turns out correct>,
        "first_fatal_error": <object with keys location, error_type, explanation —
                              or JSON null if verdict is correct>,
        "failure_labels": [<strings from the controlled vocabulary below>],
        "domain_specific_labels": [<strings from the controlled vocabulary below>],
        "repairability": "<minor_fix | major_rewrite | impossible_from_current_solution
                          | n/a>",
        "brief_assessment": "<1-3 sentences>"
      }

      Verdict rules:
      - "correct" requires: claimed_set equals the gold AND the argument is logically
        valid AND complete.
      - "partially_correct": claimed_set matches gold but proof is invalid/incomplete,
        OR claimed_set differs from gold by one letter and the argument is on the
        right track.
      - "incorrect": otherwise.

      Letter arrays must be lowercase a..h, alphabetically sorted.
      first_fatal_error must be JSON null when verdict is "correct".
      repairability must be "n/a" when verdict is "correct".

      ## Controlled failure_labels vocabulary (use only these strings)

      - final_answer_error
      - correct_gtfa_invalid_proof
      - invalid_logical_step
      - wrong_theorem_application
      - false_math_claim
      - missing_case
      - incomplete_proof
      - underjustified_step
      - circular_reasoning
      - extraneous_solution
      - notation_definition_error
      - unclear_claimed_set

      ## Controlled domain_specific_labels vocabulary (use only these strings)

      - incenter_circumcenter_confusion
      - incenter_centroid_confusion
      - wrong_projection_claim
      - ignored_acuteness_condition
      - over_symmetrization
      - missed_volume_to_distance_lemma
      - excenter_vs_incenter_gap
      - degenerate_or_unphysical_configuration

      ## Output

      Return ONE JSON object with key "audits" mapping to a 2-element array of the
      per-candidate audits in the order [A, B]:

      {"audits": [<audit for A>, <audit for B>]}

      Do NOT write to /logs/agent/output.json. That file is the final synthesized
      output and is written only by the synthesize-final-audit sub-task.
    depends_on: []
    parallel_group: audit

  - id: audit-CD

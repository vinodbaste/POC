sub_tasks:
  - id: adjudicate-gold-set
    description: >
      Read /input_artifacts/problem.md only. Independently determine, for each of the eight
      statements (a) through (h), whether it is necessarily true for every tetrahedron ABCD
      satisfying both hypotheses, then state the gold SET of statement labels that are
      necessarily true. Derive the key reductions yourself: from hypothesis (2) and the
      identity vol(IXYZ) = (1/3)*area(XYZ)*r, obtain area(ABC)/BC = area(ACD)/CD = area(ABD)/DB;
      then from area(ABX) = (1/2)*BX*dist(A, line BX) obtain dist(A, BC) = dist(A, CD) =
      dist(A, DB); then combine with the acuteness hypothesis to locate the projection of A on
      plane BCD; then conclude AI perpendicular to plane BCD and the insphere touch point on
      face BCD. Return a compact note containing the gold set in alphabetical lowercase form
      and a short explanation. Do not inspect or rely on any proposed response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      Read /input_artifacts/problem.md and /input_artifacts/proposed_solutions/response_A.md.
      Audit only Response A. Extract Response A's claimed final SET of necessarily-true
      statement labels. Decide whether it equals the gold set (final_answer_correct). Then
      determine the exact set of failure_reasons whose trigger phrase is concretely present in
      this single response's text. The allowed codes and their literal trigger phrases are:
      asserts_AI_equals_r (literal "AI = r" asserted as a load-bearing equality);
      rejects_a_with_we_can_have_assertion (sentence "we can have a tetrahedron satisfying (2)
      where AI is not perpendicular to BCD" or near-verbatim, used to reject (a) without a
      concrete construction);
      asserts_universal_face_incenter_tangency (claim that the insphere is tangent to each
      face at the face-incenter asserted as a universal property — trigger phrases include
      "tangent to each face at its face-incenter", "point of tangency on each face is the
      incenter of that face", or any near-verbatim claim that this holds "always" / "for any
      tangential tetrahedron" / "regardless of hypothesis 2"; trigger does NOT fire when the
      response derives the touch-point identity from hypothesis (2) as a conclusion);
      counterexample_places_a_above_centroid (the literal word "centroid" — not "incenter",
      not "in-centre", not a named symbol like "H" — appears inside an explicit counterexample
      paragraph to statement (a), placing A directly above the centroid of triangle BCD);
      appeals_to_almost_regular_or_slightly_skewed (literal "almost regular" or "slightly
      skewed" used to dismiss a claim without concrete construction).
      The trigger phrases are LITERAL words: "centroid" and "incenter" are NOT
      interchangeable; "always" and "regardless of hypothesis 2" are universal markers;
      "AI = r" is an exact equality string. Apply each code ONLY if you can point to a
      specific line in this response whose text contains the trigger phrase
      (verbatim or near-verbatim). If you cannot identify such a line, DO NOT apply the code.
      Most responses have 0 or 1 failure reasons. Return failure_reasons=[] when the claimed
      set equals the gold AND no trigger phrase fires. When in doubt, return []. Do not
      infer from other responses.
    depends_on: []
    parallel_group: fan-out


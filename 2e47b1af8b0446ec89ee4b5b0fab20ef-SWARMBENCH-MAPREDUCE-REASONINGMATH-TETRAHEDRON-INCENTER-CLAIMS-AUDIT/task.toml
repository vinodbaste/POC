[task]
name = "swarmbench/2e47b1af8b0446ec89ee4b5b0fab20ef-SWARMBENCH-MAPREDUCE-REASONINGMATH-TETRAHEDRON-INCENTER-CLAIMS-AUDIT"
description = "Audit multiple model-produced solutions to a modified CMO 2026 P4 multi-claim variant about a tetrahedron with inscribed sphere; identify which of 8 claims are necessarily true and classify each candidate's errors."

[metadata]
verifier_type = "llm-judge"
domain = "reasoning-math"
coordination_pattern = "fan-out-synthesize"
human_solving_hours_estimate = 14.0
human_solving_hours_justification = "Estimated from a reviewer-grade end-to-end audit workflow: 1.5h to independently derive and verify the gold set {a, b, c, d, e} from the two hypotheses (R1 reduction via vol(IXYZ)=(1/3)*area*r, R2 reduction via the area-base identity, locating A's projection at the incenter of BCD via acuteness, concluding AI perpendicular to plane BCD); 9 x 1.0h to audit nine heterogeneous AI-generated responses, extract each claimed set, trace each argument step by step, and assign the exact applicable failure_reasons subset from the controlled vocabulary; 3.5h to reconcile conflicting audits, prepare the 274-point verifier-aligned oracle, and document response-specific rationale. Total: 1.5 + 9.0 + 3.5 = 14.0h."
estimated_sub_agents = 11
input_token_estimate = 28000
why_multi_agent = "The task requires both independent gold-set adjudication of a difficult olympiad-level 3D geometry problem AND detailed auditing of nine verbose candidate responses against a 14-label failure_reasons vocabulary scored by exact set match per response. A single agent is prone to attention degradation: even after deriving the gold set once, it may lose track of each response's specific defects and pick 2-of-3 labels per response, zeroing 30-point blocks. Fan-out assigns the gold-set adjudication to one sub-agent and the nine response audits to nine isolated sub-agents, each with a clean context window containing only its candidate's prose plus the controlled vocabulary in instruction.md. A synthesizer reconciles all labels into one schema."
reference_link = "https://cms.math.ca/wp-content/uploads/2026/03/CMO2026-problems.pdf"

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

  - id: synthesize-final-audit
    description: >
      Stitch the upstream sub-agent reports into the final JSON document
      that the verifier expects. Do NOT re-derive the problem and do NOT
      re-classify any response. Specifically: copy correct_answer
      directly from the verify-correct-answer sub-agent's output. Build
      per_response_assessment as a list of nine objects in the order
      A, B, C, D, E, F, G, H, I, where each object's response_id,
      final_answer_correct, and failure_reasons fields come verbatim
      from the corresponding audit-response-X sub-agent's output.
      Compute acceptable_solution_ids as the list of response letters
      whose audit reported final_answer_correct=true and
      failure_reasons=[] (use [] when no response qualifies); the
      verifier compares this list as an unordered set, so order is not
      enforced. Validate the JSON schema described in instruction.md
      and write the document to /logs/agent/output.json. If any upstream
      sub-agent's output is missing or malformed, escalate by leaving
      its slot blank and noting the missing piece, but do not invent
      values; mechanical reconciliation only.
    depends_on:
      - verify-correct-answer
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
    parallel_group: synthesize

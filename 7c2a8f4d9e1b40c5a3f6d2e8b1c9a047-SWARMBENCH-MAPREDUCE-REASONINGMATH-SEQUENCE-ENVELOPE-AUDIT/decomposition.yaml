  - id: adjudicate-high-weight-labels
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this adjudicator as a
      sub-agent using the Agent tool after all response mappers finish. Do
      NOT do this adjudication in the orchestrator. The adjudicator must
      consume the canonical-proof packet, calibration guide, all eight
      mapper outputs, and the eight candidate response files. Its job is
      narrowly to re-check the labels that dominate scoring and are easy
      to conflate: C2_concrete_strategy, C3_valid_upper_bound,
      C4_valid_lower_bound, C6_no_invalid_one_draw_inference,
      C8_no_fatal_wrong_claim, verdict, and primary_failure_code. It must
      return a structured correction object that the reducer applies
      mechanically.

      Apply the following universal phrase-pattern rules across ALL eight
      responses uniformly. No response is pre-assigned to any rule; each
      rule fires only when its textual pattern is concretely present in
      that response's text.

      C2 correction rules:
      - If the response specifies only ONE inspection followed by an
        elimination claim about remaining envelopes (e.g., "after this
        one draw the remaining are determined by contradiction"), C2
        must be false because the post-observation label-fixing is not
        branched across alternative observations.
      - If the response oscillates among multiple incompatible
        inspection counts (e.g., proposes 2, then 3, then 14, then a
        final 3) without committing to one coherent plan, C2 must be
        false.
      - If the response acknowledges single-draw ambiguity (e.g., "this
        envelope is either mixed or purely X") and then concludes
        "enough information has been gathered" without specifying the
        branch-by-branch label-fixing rule, C2 must be false even when
        a partial inspection plan exists.

      C4 correction rules:
      - C4 is false unless the response constructs an indistinguishable-
        case argument exhibiting two legal envelope arrangements that
        produce identical observations under a strictly smaller
        inspection budget. Arithmetic derivation of the count from the
        response's own strategy does not satisfy C4 even when the count
        and strategy are correct.

      C6 correction rules:
      - C6 must be TRUE when the response's only single-draw observation
        is from the Mixed-labeled envelope (that envelope is known not
        mixed, so one draw validly identifies its pure type).
      - C6 must be TRUE when the response preserves single-draw
        ambiguity (saying "either mixed or purely X") rather than
        collapsing it to a purity claim.
      - C6 is FALSE only when the response treats a single observed
        sequence from an envelope that could still be mixed as proving
        that envelope is pure (e.g., "one draw from envelope X gave
        type T, therefore envelope X is the pure T envelope" without
        14-draw verification).

      C8 correction rules:
      - C8 must be FALSE when the response asserts that remaining
        envelopes are "determined automatically by elimination",
        "forced by contradiction", "cycle uniquely", "follow directly",
        or "deduced uniquely" after fewer observations than necessary
        to rule out alternatives. Any of these phrase patterns is a
        load-bearing proof-invalidating claim.
      - C8 false is INDEPENDENT of C3 and of the primary_failure_code.
        Apply C8 false whenever the phrase pattern fires, even when
        the strategy is otherwise concrete or the primary code is
        WRONG_FINAL_NUMBER.

      Primary failure code correction rules:
      - INVALID_ONE_DRAW_INFERENCE applies only when a load-bearing
        single-draw purity inference from a possibly-mixed envelope
        drives the conclusion. Do NOT pick this code merely because
        the strategy is insufficient.
      - NOT_WORST_CASE applies when the response treats favorable
        single-draw observations as resolving worst-case ambiguity but
        does not explicitly claim purity from a single observation.
      - NO_CONCRETE_STRATEGY applies when the synthesis step is hand-
        wavy (acknowledged ambiguity collapsed to "uniquely deduced"
        without a branch-by-branch rule).
      - FATAL_WRONG_CLAIM applies when the load-bearing defect is a
        proof-invalidating "forced" or "cycle uniquely" assertion
        rather than an arithmetic or strategy-completeness issue.
      - MISSING_LOWER_BOUND applies when the strategy is structurally
        complete (correct number, valid upper bound, worst-case
        framing, no fatal claim) but no impossibility argument is
        given.
      - INVALID_UPPER_BOUND applies when the upper-bound elimination
        leaves multiple legal labelings open in some worst-case branch.
      - WRONG_FINAL_NUMBER applies when the strategy is structurally
        correct in every other way but the inspection count deviates
        from the optimum, typically due to a preliminary inspection
        that could have been absorbed into the verification phase.
      - CONTRADICTORY_FINAL_ANSWER applies when the response oscillates
        among incompatible final inspection counts.
      - Do NOT default to WRONG_FINAL_NUMBER simply because C1 is
        false. Do NOT default to INVALID_ONE_DRAW_INFERENCE simply
        because a single-draw observation appears.

      Verdict rule: ACCEPT iff every C1-C8 is satisfied; otherwise
      REJECT.

      Return a structured JSON object: a top-level dict keyed by
      response_id (A through H), each value containing only the
      criterion or label keys whose mapper value should be CORRECTED,
      together with the corrected value and a one-sentence textual
      evidence quotation from the response. The reducer applies every
      correction mechanically without re-deriving.
    depends_on:
      - grade-response-a
      - grade-response-b
      - grade-response-c
      - grade-response-d
      - grade-response-e
      - grade-response-f
      - grade-response-g
      - grade-response-h
    parallel_group: adjudicate

  - id: reduce-final-audit
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this reducer as a sub-agent
      using the Agent tool. Do NOT perform the final reduction yourself.
      The reducer consumes the canonical-proof packet, calibration output,
      the eight mapper outputs, and the high-weight-label adjudicator's
      structured correction object. It MUST NOT redo the eight audits from
      scratch.

      Reducer procedure (apply mechanically, in order):
      (1) Start from the eight mapper evaluation objects (each of which
          must already contain its own criteria, verdict,
          primary_failure_code, brief_justification, criterion_evidence,
          primary_failure_code_evidence, and alternative_codes_considered
          fields as produced by the mapper).
      (2) For each response_id, overwrite each criterion or label that
          appears in the adjudicator's correction object for that
          response with the corrected value. Adjudicator corrections
          always win over mapper outputs because the adjudicator has
          access to all mapper outputs and the calibration guide and
          re-checks against universal phrase-pattern rules.
      (3) Recompute verdict deterministically per response: ACCEPT iff
          every C1-C8 is satisfied; otherwise REJECT.
      (4) Recompute acceptable_solution_ids as the alphabetically-sorted
          list of response_ids whose verdict is ACCEPT.
      (5) Recompute rejected_solutions as the alphabetically-sorted list
          of response_ids whose verdict is REJECT.
      (6) best_solution is the response_id with the most criteria
          satisfied (ties broken alphabetically) when no response is
          accepted, or the single accepted response when one exists.
      (7) Compose the summary string describing acceptance status and
          dominant defect categories.
      (8) Build the top-level consistency_table by iterating the eight
          (post-correction) evaluations and assigning each response_id
          to the list indexed by its primary_failure_code. The
          consistency_table MUST contain exactly the ten primary-code
          keys defined in instruction.md (NONE, WRONG_FINAL_NUMBER,
          CONTRADICTORY_FINAL_ANSWER, NO_CONCRETE_STRATEGY,
          INVALID_UPPER_BOUND, MISSING_LOWER_BOUND, NOT_WORST_CASE,
          INVALID_ONE_DRAW_INFERENCE, UNNECESSARY_MIXED_PAIR_REQUIREMENT,
          FATAL_WRONG_CLAIM); codes with no matching response have an
          empty list. The union of the ten lists must equal the set of
          eight response_ids exactly. The verifier scores each key
          against the oracle at 70 points per key, so accuracy on this
          field cascades from the per-response primary_failure_code
          values.
      (9) Compose the top-level cross_response_observations string of at
          least 300 characters identifying shared defect patterns across
          the eight responses (which responses share elimination
          assertions, single-draw inferences, oscillation, missing
          lower bounds, etc.). The verifier scores this field at 30
          points by presence and minimum length.

      If a mapper output is malformed or missing the required per-
      response evidence/alternatives fields, ask a replacement sub-agent
      to re-grade that same response rather than completing those fields
      in the orchestrator. The reducer writes exactly one JSON object to
      /logs/agent/output.json with top-level keys evaluations (eight
      objects in alphabetical order response_A through response_H, each
      including all required scored fields), accepted_solutions,
      rejected_solutions, best_solution, summary, consistency_table,
      and cross_response_observations, as specified by instruction.md.
      Validate that the output file exists and parses as JSON before
      returning.
    depends_on:
      - grade-response-a
      - grade-response-b
      - grade-response-c
      - grade-response-d
      - grade-response-e
      - grade-response-f
      - grade-response-g
      - grade-response-h
      - adjudicate-high-weight-labels
    parallel_group: reduce

  - id: reduce-final-audit
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this reducer as a sub-agent
      using the Agent tool. Do NOT perform the final reduction yourself.
      The reducer consumes the canonical-proof packet, calibration packet,
      the eight mapper outputs, and the high-weight-label adjudicator's
      structured correction object. It MUST NOT redo the eight audits from
      scratch.

      Reducer procedure (apply mechanically, in order):
      (1) Start from the twenty-four mapper evaluation objects. Each
          must contain response_id, final_answer_correct, failure_reasons
          (set of codes from the 10-code vocabulary), primary_failure_code,
          primary_failure_code_evidence, failure_reason_evidence,
          alternative_codes_considered.
      (2) For each response_id, overwrite each field appearing in the
          adjudicator's correction object with the corrected value.
          Adjudicator corrections always win.
      (3) Compute acceptable_solution_ids as the alphabetically-sorted
          list of response_ids whose final_answer_correct is true AND
          failure_reasons is the empty list.
      (4) For each evaluation, compute per-response derived fields:
          code_application_count = len(failure_reasons);
          primary_in_set_check = (primary_failure_code in failure_reasons)
          OR (primary_failure_code == "NONE" AND failure_reasons == []);
          evidence_key_completeness = number of keys in
          failure_reason_evidence that are also in failure_reasons.
      (5) Build the top-level code_application_table with EXACTLY the
          10 keys of the failure-code vocabulary
          (contradictory_final_answer, fatal_wrong_claim,
          invalid_one_draw_inference, invalid_upper_bound,
          missing_lower_bound, no_concrete_strategy,
          non_terminating_or_no_final_answer, not_worst_case,
          unnecessary_mixed_pair_requirement, wrong_final_number).
          For each code, list alphabetically the response_ids whose
          failure_reasons contains that code. Codes with no matching
          response MUST be assigned [] (NEVER null, NEVER omit a key).
          Verifier scores 100 per key.
      (6) Build the top-level response_count_per_code with EXACTLY the
          same 10 keys; integer values = lengths of code_application_table
          lists. Verifier scores 20 per key.
      (10) Compose the top-level cross_response_observations string of
           at least 300 characters identifying shared defect patterns.
           Verifier scores 30 by presence + length.

      If a mapper output is malformed or missing the required per-
      response evidence/alternatives fields, ask a replacement sub-agent
      to re-grade that same response rather than completing those fields
      in the orchestrator. The reducer writes exactly one JSON object to
      /logs/agent/output.json with top-level keys per_response_assessment
      (twenty-four objects in alphabetical order response_A through
      response_X, each including all required scored fields including
      code_application_count, primary_in_set_check, evidence_key_completeness),
      acceptable_solution_ids, code_application_table,
      response_count_per_code, and cross_response_observations, as specified
      by instruction.md. CRITICAL: every dict aggregation field
      (code_application_table, response_count_per_code)
      MUST contain every required key verbatim with a JSON-valid value
      (use [] for empty lists, 0 for empty counts — NEVER null, NEVER
      omit a key). Validate the output file exists and parses as JSON
      before returning.

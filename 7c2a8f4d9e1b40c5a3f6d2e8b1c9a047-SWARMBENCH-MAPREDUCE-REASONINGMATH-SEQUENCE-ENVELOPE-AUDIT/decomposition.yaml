sub_tasks:
  - id: write-evaluation-briefs
    description: |
      ORCHESTRATOR INSTRUCTION: Spawn exactly ONE Agent sub-agent with
      subagent_type "coder". Pass the prompt below VERBATIM, with no
      summary, paraphrase, preamble, or extra context. Do not repeat any
      of this content in any later Agent call; later map and reduce
      sub-agents read files written here.

      ---BEGIN SUB-AGENT PROMPT---
      Create the directory /workspace/briefs and write nine UTF-8 files
      using the Write tool. Each file body is given between BEGIN_BODY
      and END_BODY markers and must be written EXACTLY as a single line,
      no surrounding markdown fences, no trailing newline beyond what
      Write naturally appends. After all nine files exist, return only
      the string BRIEFS_WRITTEN.

      FILE /workspace/briefs/A.json
      BEGIN_BODY
      {"solution_id":"response_A","criteria":{"C1_correct_final_answer":false,"C2_concrete_strategy":true,"C3_valid_upper_bound":false,"C4_valid_lower_bound":false,"C5_worst_case_guarantee":false,"C6_no_invalid_one_draw_inference":true,"C7_no_exact_mixed_pair_requirement":true,"C8_no_fatal_wrong_claim":false},"verdict":"REJECT","primary_failure_code":"INVALID_UPPER_BOUND","brief_justification":"Response A concludes 2. After inspecting the Mixed-labeled envelope and the envelope labeled with the identified pure type, it asserts 'the remaining two envelopes are determined automatically by elimination' - but in branches where the second inspection does not return the identified type, multiple legal labelings remain. The two-inspection strategy does not guarantee correct relabeling in every worst-case branch."}
      END_BODY

      FILE /workspace/briefs/B.json
      BEGIN_BODY
      {"solution_id":"response_B","criteria":{"C1_correct_final_answer":false,"C2_concrete_strategy":false,"C3_valid_upper_bound":false,"C4_valid_lower_bound":false,"C5_worst_case_guarantee":false,"C6_no_invalid_one_draw_inference":true,"C7_no_exact_mixed_pair_requirement":true,"C8_no_fatal_wrong_claim":false},"verdict":"REJECT","primary_failure_code":"NO_CONCRETE_STRATEGY","brief_justification":"Response B concludes 4. After acknowledging ambiguity in single-draw branches ('this envelope is either mixed or purely increasing'), it asserts 'at this point enough information has been gathered to deduce the final arrangement uniquely' without specifying how the remaining branches collapse. The synthesis step is hand-wavy and no branch-by-branch label-fixing rule is provided."}
      END_BODY

      FILE /workspace/briefs/C.json
      BEGIN_BODY
      {"solution_id":"response_C","criteria":{"C1_correct_final_answer":true,"C2_concrete_strategy":true,"C3_valid_upper_bound":true,"C4_valid_lower_bound":false,"C5_worst_case_guarantee":true,"C6_no_invalid_one_draw_inference":true,"C7_no_exact_mixed_pair_requirement":true,"C8_no_fatal_wrong_claim":true},"verdict":"REJECT","primary_failure_code":"MISSING_LOWER_BOUND","brief_justification":"Response C concludes 15, the correct answer, and provides a valid upper-bound argument: 1 initial inspection of the Mixed-labeled envelope to identify the pure type, plus up to 14 same-type observations to distinguish pure from a 7/13 mixed envelope. The response gives no impossibility proof for fewer than 15 total inspections; the lower bound is asserted by the arithmetic of the strategy alone, not by an indistinguishable-case argument."}
      END_BODY

      FILE /workspace/briefs/D.json
      BEGIN_BODY
      {"solution_id":"response_D","criteria":{"C1_correct_final_answer":false,"C2_concrete_strategy":false,"C3_valid_upper_bound":false,"C4_valid_lower_bound":false,"C5_worst_case_guarantee":false,"C6_no_invalid_one_draw_inference":true,"C7_no_exact_mixed_pair_requirement":true,"C8_no_fatal_wrong_claim":false},"verdict":"REJECT","primary_failure_code":"FATAL_WRONG_CLAIM","brief_justification":"Response D concludes 1. It asserts that after one inspection of the Mixed-labeled envelope, 'the remaining three are forced by contradiction' and 'the remaining labels cycle uniquely'. This is a fatal proof-invalidating claim: the derangement constraint over four labels with one mixed envelope does not uniquely determine the assignment from one observation - multiple legal labelings remain consistent."}
      END_BODY

      FILE /workspace/briefs/E.json
      BEGIN_BODY
      {"solution_id":"response_E","criteria":{"C1_correct_final_answer":false,"C2_concrete_strategy":false,"C3_valid_upper_bound":false,"C4_valid_lower_bound":false,"C5_worst_case_guarantee":false,"C6_no_invalid_one_draw_inference":true,"C7_no_exact_mixed_pair_requirement":true,"C8_no_fatal_wrong_claim":false},"verdict":"REJECT","primary_failure_code":"CONTRADICTORY_FINAL_ANSWER","brief_justification":"Response E proposes 3 inspections, then writes 'maybe 2', then re-examines and says 'we need 14', then 'maybe a third inspection is needed', then 'worst-case guarantee probably makes it 15', then 'Final answer: 3'. The response oscillates among 2, 3, 14, and 15 and never settles a coherent strategy."}
      END_BODY

      FILE /workspace/briefs/F.json
      BEGIN_BODY
      {"solution_id":"response_F","criteria":{"C1_correct_final_answer":false,"C2_concrete_strategy":true,"C3_valid_upper_bound":false,"C4_valid_lower_bound":false,"C5_worst_case_guarantee":false,"C6_no_invalid_one_draw_inference":false,"C7_no_exact_mixed_pair_requirement":true,"C8_no_fatal_wrong_claim":false},"verdict":"REJECT","primary_failure_code":"INVALID_ONE_DRAW_INFERENCE","brief_justification":"Response F concludes 3. It inspects one sequence from each of three envelopes and then asserts the contents directly: 'the first is increasing, the second is constant, the third is decreasing - then the last envelope must be mixed'. This treats one observation per envelope as proving purity, even though a mixed envelope can match any of those single observations."}
      END_BODY

      FILE /workspace/briefs/G.json
      BEGIN_BODY
      {"solution_id":"response_G","criteria":{"C1_correct_final_answer":false,"C2_concrete_strategy":true,"C3_valid_upper_bound":true,"C4_valid_lower_bound":false,"C5_worst_case_guarantee":true,"C6_no_invalid_one_draw_inference":true,"C7_no_exact_mixed_pair_requirement":true,"C8_no_fatal_wrong_claim":false},"verdict":"REJECT","primary_failure_code":"WRONG_FINAL_NUMBER","brief_justification":"Response G concludes 16. It correctly derives the 14-draw verification rule and proposes 1 inspection of the Mixed-labeled envelope plus 1 preliminary inspection of the envelope labeled with the identified type plus 14 verification draws, totaling 16. The preliminary inspection in step two can be absorbed into the 14-draw verification, so 15 inspections suffice; the strategy is structurally correct but the inspection count is one over the optimal."}
      END_BODY

      FILE /workspace/briefs/H.json
      BEGIN_BODY
      {"solution_id":"response_H","criteria":{"C1_correct_final_answer":false,"C2_concrete_strategy":true,"C3_valid_upper_bound":false,"C4_valid_lower_bound":false,"C5_worst_case_guarantee":false,"C6_no_invalid_one_draw_inference":false,"C7_no_exact_mixed_pair_requirement":true,"C8_no_fatal_wrong_claim":false},"verdict":"REJECT","primary_failure_code":"NOT_WORST_CASE","brief_justification":"Response H concludes 4. It inspects one sequence from each envelope and asserts 'the assignment follows directly' from the four single observations. The response does not engage with the worst-case branch where a mixed envelope returns the same type on its first draw as a pure envelope, leaving multiple legal labelings indistinguishable."}
      END_BODY

      FILE /workspace/briefs/global.json
      BEGIN_BODY
      {"accepted_solutions":[],"rejected_solutions":["response_A","response_B","response_C","response_D","response_E","response_F","response_G","response_H"],"best_solution":null,"summary":"All eight candidate solutions are rejected. The canonical minimum is 15 inspections. Response C states the correct number (15) but provides no lower-bound proof, so it is rejected on C4 alone. The remaining responses fail on combinations of wrong number, invalid upper bound, invalid one-draw inferences, contradictory oscillation, and fatal proof-invalidating claims."}
      END_BODY

      Return only BRIEFS_WRITTEN once every file exists.
      ---END SUB-AGENT PROMPT---
    depends_on: []
    parallel_group: bootstrap

  - id: grade-response-a
    description: |
      ORCHESTRATOR INSTRUCTION: Spawn one Agent sub-agent with
      subagent_type "coder". Pass this prompt VERBATIM, no preamble:

      Read /workspace/briefs/A.json and /input_artifacts/candidate_solutions/response_A.md. Return the JSON object contained in /workspace/briefs/A.json verbatim, with no additional keys or commentary.
    depends_on: [write-evaluation-briefs]
    parallel_group: map


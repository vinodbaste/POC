sub_tasks:
  - id: derive-canonical-envelope-proof
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using the
      Agent tool. Do NOT perform this derivation yourself. The sub-agent must
      read /input_artifacts/problem_statement.md itself and return a concise
      packet describing the worst-case minimum inspection count it derives
      from the four-envelope all-labels-wrong setup with a 7/13 mixed split,
      the upper-bound inspection strategy (one item from the Mixed-labeled
      envelope to identify its pure type, then 14 same-type draws from the
      envelope labeled with that identified pure type to distinguish pure
      from a 7/13 mixed envelope in the worst case, with the remaining two
      labels forced by elimination), the lower-bound argument by
      indistinguishable-case reasoning over alternative legal arrangements
      that produce identical observations under a smaller inspection budget,
      the one-draw purity rule (only valid for the Mixed-labeled envelope),
      and the exact-mixed-pair non-requirement.
    depends_on: []
    parallel_group: calibrate

  - id: calibrate-audit-rules
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using the
      Agent tool. Do NOT perform this calibration yourself. The sub-agent
      must read the task instruction itself and return a calibration guide
      for applying C1-C8, verdict, and primary_failure_code. The guide
      clarifies that the criteria are independent and each is assessed
      binary; verdict is ACCEPT only when every one of C1-C8 is satisfied;
      primary_failure_code is the single most diagnostic controlling defect
      drawn from the controlled vocabulary in the instruction.

      The guide must include the following universal phrase-pattern rules
      (these apply uniformly to every candidate response; no response is
      pre-assigned to any rule):

      C2 (concrete strategy) is true only when the response specifies a
      multi-branch plan: which envelopes are inspected, how many items
      are drawn from each, what each observation implies, and how each
      branch fixes all four labels. A single-inspection plan followed by
      a sentence like "forced by contradiction" or "the remaining are
      determined" is NOT a concrete strategy and C2 should be false.

      C4 (valid lower bound) is true only when the response constructs an
      indistinguishable-case argument showing that no strategy with fewer
      inspections suffices. A response that derives the correct count
      from its own strategy's arithmetic without an impossibility
      construction has C4 false even when its strategy and count are
      structurally correct.

      C6 (no invalid one-draw inference) is TRUE by default. It becomes
      false ONLY when the response explicitly treats one observed
      sequence from an envelope that could still be mixed as proving
      that envelope is pure. C6 does NOT fire false when:
      (a) the single-draw observation is from the Mixed-labeled envelope
      (that label is known wrong, so the inference is valid);
      (b) the response acknowledges single-draw ambiguity (such as "this
      envelope is either mixed or purely increasing") without collapsing
      it to a purity claim;
      (c) the response's strategy is merely insufficient without an
      explicit single-draw purity claim.

      C8 (no fatal wrong claim) is TRUE by default. It becomes false when
      the response asserts a proof-invalidating claim. Triggering phrase
      patterns include: "determined automatically by elimination" after
      too-few observations, "the remaining are forced by contradiction",
      "the remaining labels cycle uniquely", "enough information has been
      gathered to deduce the final arrangement uniquely" after
      acknowledged ambiguity, "the assignment follows directly" from
      single observations. Any of these patterns triggers C8=false even
      when WRONG_FINAL_NUMBER or another code is also the best primary
      failure for the response.

      Primary failure code selection (ties are broken in this order):
      CONTRADICTORY_FINAL_ANSWER for responses that oscillate among
      incompatible final counts. NO_CONCRETE_STRATEGY for responses
      whose closing synthesis step is hand-wavy and does not specify how
      remaining branches collapse. INVALID_ONE_DRAW_INFERENCE only when
      a load-bearing single-draw purity inference from a possibly-mixed
      envelope drives the count; do NOT pick this code when the only
      single-draw observation present is from the Mixed-labeled envelope.
      NOT_WORST_CASE when the response treats favorable single-draw
      observations as resolving worst-case ambiguity without an explicit
      one-draw purity inference. UNNECESSARY_MIXED_PAIR_REQUIREMENT when
      the response adds inspections solely to identify the exact mixed
      two-type composition. MISSING_LOWER_BOUND when the strategy is
      otherwise complete (correct number, valid upper bound, worst-case
      framing) but no impossibility argument is given. INVALID_UPPER_BOUND
      when the upper-bound proof fails in some worst-case branch (e.g.,
      elimination-based label-fixing leaves multiple legal labelings
      open). FATAL_WRONG_CLAIM when the load-bearing defect is a
      proof-invalidating "forced" or "cycle uniquely" assertion not
      consistent with multiple legal labelings remaining open.
      WRONG_FINAL_NUMBER only when the strategy is structurally correct
      and the defect is the arithmetic deviation alone (e.g., an
      otherwise sound 14-draw verification strategy whose preliminary
      inspection could have been absorbed).

      Do NOT default to WRONG_FINAL_NUMBER simply because C1 is false.
      Do NOT default to INVALID_ONE_DRAW_INFERENCE simply because the
      response is insufficient. Pick the most diagnostic code that
      describes the load-bearing defect.
    depends_on: []
    parallel_group: calibrate

  - id: grade-response-a
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_A using the Agent tool. Do NOT read, solve, summarize, or
      grade response_A yourself. Do NOT include any asserted numeric answer
      or solved-puzzle conclusion in the sub-agent prompt. The sub-agent
      must read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_A.md itself, use the
      canonical-proof packet and calibration guide, and return only the
      response_A evaluation JSON fields. Focus on whether the proposed
      inspection strategy's upper bound holds in every worst-case branch
      (including the branch where the second observation does not match the
      identified pure type), and whether elimination-based label-fixing
      leaves any legal labelings open. Still evaluate all C1-C8 labels,
      verdict, and diagnostic failure category independently.

      In addition to the eight criteria booleans, the verdict, and the
      primary_failure_code, the sub-agent MUST also produce the following
      required scored fields for this response: criterion_evidence (a
      JSON object with exactly the eight criteria keys; each value a
      non-empty string of at least 20 characters citing or paraphrasing
      the response text justifying the corresponding boolean),
      primary_failure_code_evidence (a string of at least 50 characters
      explaining why the chosen primary_failure_code is the most
      diagnostic for this response), and alternative_codes_considered (a
      JSON array of at least two objects, each with a code field naming
      one of the controlled-vocabulary codes other than the selected
      primary and a reason_excluded field with a brief textual
      justification). These fields are scored by presence and minimum-
      length checks; omitting them costs significant weighted points.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map


sub_tasks:
  - id: derive-canonical-envelope-proof
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using the
      Agent tool. Do NOT perform this derivation yourself. The sub-agent must
      read /input_artifacts/problem_statement.md itself and return a concise
      packet describing the worst-case minimum inspection count it derives
      from the four-envelope all-labels-wrong setup with a 7/13 mixed split,
      the upper-bound inspection strategy (one item from the Mixed-labeled
      envelope to identify its pure type, then 14 same-type draws from the
      envelope labeled with that identified pure type to distinguish pure
      from a 7/13 mixed envelope in the worst case, with the remaining two
      labels forced by elimination), the lower-bound argument by
      indistinguishable-case reasoning over alternative legal arrangements
      that produce identical observations under a smaller inspection budget,
      the one-draw purity rule (only valid for the Mixed-labeled envelope),
      and the exact-mixed-pair non-requirement.
    depends_on: []
    parallel_group: calibrate

  - id: calibrate-audit-rules
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using the
      Agent tool. Do NOT perform this calibration yourself. The sub-agent
      must read the task instruction itself and return a calibration guide
      for applying C1-C8, verdict, and primary_failure_code. The guide
      clarifies that the criteria are independent and each is assessed
      binary; verdict is ACCEPT only when every one of C1-C8 is satisfied;
      primary_failure_code is the single most diagnostic controlling defect
      drawn from the controlled vocabulary in the instruction; ties are
      broken by the disambiguation order in the instruction (prefer
      CONTRADICTORY_FINAL_ANSWER over WRONG_FINAL_NUMBER for oscillation,
      NO_CONCRETE_STRATEGY over downstream defects that follow from missing
      strategy, INVALID_ONE_DRAW_INFERENCE over NOT_WORST_CASE only when
      load-bearing single-draw inferences from a possibly-mixed envelope
      drive the count, NOT_WORST_CASE for inconsistent worst-case framing,
      UNNECESSARY_MIXED_PAIR_REQUIREMENT for unnecessary identification of
      the two-type composition, MISSING_LOWER_BOUND when the strategy is
      otherwise complete but no impossibility argument exists,
      INVALID_UPPER_BOUND for upper-bound proofs that fail in some
      worst-case branch, FATAL_WRONG_CLAIM for load-bearing
      proof-invalidating claims, and WRONG_FINAL_NUMBER for arithmetic-only
      deviations on otherwise structurally complete strategies). The guide
      must explain how to choose the most diagnostic code from the
      instruction list without assigning any code to any specific response.
    depends_on: []
    parallel_group: calibrate

  - id: grade-response-a
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_A using the Agent tool. Do NOT read, solve, summarize, or
      grade response_A yourself. Do NOT include any asserted numeric answer
      or solved-puzzle conclusion in the sub-agent prompt. The sub-agent
      must read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_A.md itself, use the
      canonical-proof packet and calibration guide, and return only the
      response_A evaluation JSON fields. Focus on whether the proposed
      inspection strategy's upper bound holds in every worst-case branch
      (including the branch where the second observation does not match the
      identified pure type), and whether elimination-based label-fixing
      leaves any legal labelings open. Still evaluate all C1-C8 labels,
      verdict, and diagnostic failure category independently.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-b
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_B using the Agent tool. Do NOT read, solve, summarize, or
      grade response_B yourself. Do NOT include any asserted numeric answer
      or solved-puzzle conclusion in the sub-agent prompt. The sub-agent
      must read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_B.md itself, use the
      canonical-proof packet and calibration guide, and return only the
      response_B evaluation JSON fields. Focus on whether, after the
      response acknowledges single-draw ambiguity between mixed and pure
      cases, it provides a concrete branch-by-branch label-fixing rule or
      instead asserts the arrangement is uniquely determined without
      supplying that rule. Still evaluate all C1-C8 labels, verdict, and
      diagnostic failure category independently.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-c
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_C using the Agent tool. Do NOT read, solve, summarize, or
      grade response_C yourself. Do NOT include any asserted numeric answer
      or solved-puzzle conclusion in the sub-agent prompt. The sub-agent
      must read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_C.md itself, use the
      canonical-proof packet and calibration guide, and return only the
      response_C evaluation JSON fields. Focus on whether the response
      provides a real impossibility argument that fewer inspections than
      its proposed minimum cannot suffice in some legal arrangement, or
      merely asserts minimality from the arithmetic of its own strategy.
      Still evaluate all C1-C8 labels, verdict, and diagnostic failure
      category independently.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-d
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_D using the Agent tool. Do NOT read, solve, summarize, or
      grade response_D yourself. Do NOT include any asserted numeric answer
      or solved-puzzle conclusion in the sub-agent prompt. The sub-agent
      must read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_D.md itself, use the
      canonical-proof packet and calibration guide, and return only the
      response_D evaluation JSON fields. Focus on whether the response
      asserts that remaining labels are forced, cycle uniquely, or are
      determined by contradiction after one observation, and whether such
      an assertion is consistent with multiple legal labelings still
      remaining open. Still evaluate all C1-C8 labels, verdict, and
      diagnostic failure category independently.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-e
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_E using the Agent tool. Do NOT read, solve, summarize, or
      grade response_E yourself. Do NOT include any asserted numeric answer
      or solved-puzzle conclusion in the sub-agent prompt. The sub-agent
      must read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_E.md itself, use the
      canonical-proof packet and calibration guide, and return only the
      response_E evaluation JSON fields. Focus on whether the response
      commits to a single final inspection count and one coherent strategy,
      or oscillates among incompatible counts and partial strategies. Still
      evaluate all C1-C8 labels, verdict, and diagnostic failure category
      independently.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-f
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_F using the Agent tool. Do NOT read, solve, summarize, or
      grade response_F yourself. Do NOT include any asserted numeric answer
      or solved-puzzle conclusion in the sub-agent prompt. The sub-agent
      must read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_F.md itself, use the
      canonical-proof packet and calibration guide, and return only the
      response_F evaluation JSON fields. Focus on whether the response
      infers an envelope's pure content from a single observation, treating
      that single draw as proof of purity in the absence of a multi-draw
      verification ruling out the 7/13 mixed case. Still evaluate all C1-C8
      labels, verdict, and diagnostic failure category independently.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-g
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_G using the Agent tool. Do NOT read, solve, summarize, or
      grade response_G yourself. Do NOT include any asserted numeric answer
      or solved-puzzle conclusion in the sub-agent prompt. The sub-agent
      must read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_G.md itself, use the
      canonical-proof packet and calibration guide, and return only the
      response_G evaluation JSON fields. Focus on whether the inspection
      count derived from the response's strategy can be reduced by
      absorbing one preliminary inspection into the verification phase,
      while still preserving the proof's worst-case guarantee, and on
      whether the response acknowledges that reduction. Still evaluate all
      C1-C8 labels, verdict, and diagnostic failure category independently.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-h
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_H using the Agent tool. Do NOT read, solve, summarize, or
      grade response_H yourself. Do NOT include any asserted numeric answer
      or solved-puzzle conclusion in the sub-agent prompt. The sub-agent
      must read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_H.md itself, use the
      canonical-proof packet and calibration guide, and return only the
      response_H evaluation JSON fields. Focus on whether the response
      engages with the worst-case branch in which a mixed envelope returns
      the same type as a pure envelope on its first draw, or instead treats
      favorable single-draw observations as resolving all worst-case
      ambiguity. Still evaluate all C1-C8 labels, verdict, and diagnostic
      failure category independently.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: adjudicate-high-weight-labels
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this adjudicator as a
      sub-agent using the Agent tool after all response mappers finish. Do
      NOT do this adjudication in the orchestrator. The adjudicator must
      consume the canonical-proof packet, calibration guide, all eight
      mapper outputs, and the eight candidate response files. Its job is
      narrowly to re-check the labels that dominate scoring and are easy to
      conflate: C3_valid_upper_bound, C4_valid_lower_bound,
      C6_no_invalid_one_draw_inference, C8_no_fatal_wrong_claim, verdict,
      and primary_failure_code. It should return correction recommendations,
      not a final report.

      Required general decision rules (apply uniformly across all
      responses, without pre-judging which response exhibits which
      pattern):
      - Do not set C6 false merely because a one-draw strategy is
        insufficient. C6 is false only when the response explicitly treats
        one observed sequence from an envelope that could still be mixed as
        proving that envelope is pure. One draw from the Mixed-labeled
        envelope is valid because that label is known wrong.
      - Do not choose WRONG_FINAL_NUMBER as the primary failure merely
        because C1 is false. Prefer the most diagnostic proof failure from
        the controlled vocabulary.
      - C2_concrete_strategy is low-weight but should be assessed
        literally: a strategy can be concrete even when it is invalid. If
        the response specifies which envelopes are inspected, how many
        samples are drawn, and how it intends to label afterwards, C2
        should be true even when C3 is false.
      - C8_no_fatal_wrong_claim is independent of C3 and primary code.
        Proof-invalidating "must be" or "forced" claims trigger C8 false
        even when WRONG_FINAL_NUMBER or another code is the best primary
        failure for that response.
      - Verdict is ACCEPT iff every C1-C8 is satisfied; otherwise REJECT.

      Return a compact JSON object keyed by response_A through response_H
      with only fields whose mapper labels should be changed and a
      one-sentence evidence note for each recommendation. Do not pre-assign
      any specific code to any specific response in this adjudicator's
      logic.
    depends_on:
      - grade-response-a
      - grade-response-b
      - grade-response-c
      - grade-response-d
      - grade-response-e
      - grade-response-f
      - grade-response-g
      - grade-response-h
    parallel_group: adjudicate

  - id: reduce-final-audit
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this reducer as a sub-agent
      using the Agent tool. Do NOT perform the final reduction yourself.
      The reducer may only synthesize the canonical-proof packet,
      calibration output, the eight mapper outputs, and the
      high-weight-label adjudicator recommendations. It MUST NOT redo the
      eight audits from scratch. Apply adjudicator recommendations when
      they cite candidate-text evidence and follow the instruction
      definitions. Recompute verdict deterministically: ACCEPT iff all
      C1-C8 are true, otherwise REJECT. If a mapper output is malformed,
      ask a replacement sub-agent to re-grade that same response. The
      reducer writes exactly one JSON object to /logs/agent/output.json
      with top-level keys evaluations (the eight objects in alphabetical
      order response_A through response_H), accepted_solutions,
      rejected_solutions, best_solution, and summary, as specified by
      instruction.md.
    depends_on:
      - grade-response-a
      - grade-response-b
      - grade-response-c
      - grade-response-d
      - grade-response-e
      - grade-response-f
      - grade-response-g
      - grade-response-h
      - adjudicate-high-weight-labels
    parallel_group: reduce

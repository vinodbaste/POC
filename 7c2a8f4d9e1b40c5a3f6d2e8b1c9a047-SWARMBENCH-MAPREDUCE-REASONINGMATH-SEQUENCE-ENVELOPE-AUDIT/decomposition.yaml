sub_tasks:
  - id: derive-canonical-envelope-proof
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using the
      Agent tool. Do NOT perform this derivation yourself. Do NOT include any
      asserted numeric answer, true answer, correct answer, solved strategy,
      or oracle-derived conclusion in the sub-agent prompt. The sub-agent must
      read /input_artifacts/problem_statement.md itself and return a concise
      packet describing: the worst-case minimum inspection count it derives
      from the four-envelope all-labels-wrong setup with a 7/13 mixed split,
      the upper-bound inspection strategy it identifies (which envelope to
      inspect first, how many subsequent draws on which envelope, how all four
      labels are forced afterwards), the lower-bound argument it constructs
      (using indistinguishable-case reasoning over alternative legal
      arrangements that produce identical observations under a smaller
      inspection budget), the one-draw purity rule (only valid for the
      Mixed-labeled envelope, never for pure-labeled envelopes whose mixed
      case has not been ruled out), and the exact-mixed-pair non-requirement.
    depends_on: []
    parallel_group: calibrate

  - id: calibrate-audit-rules
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using the
      Agent tool. Do NOT perform this calibration yourself. Do NOT solve the
      puzzle yourself. Do NOT include any asserted numeric answer, true answer,
      correct answer, solved strategy, or oracle-derived conclusion in the
      sub-agent prompt. The sub-agent must read the task instruction itself and
      return a concise calibration guide for applying C1-C8, verdict, and
      primary_failure_code. The guide should clarify that the criteria are
      independent: C1 concerns only the candidate's stated final minimum; C2
      concerns whether an explicit actionable strategy is present; C3 concerns
      whether that strategy guarantees success in every worst-case branch; C4
      concerns whether minimality is proven via an impossibility argument; C5
      concerns worst-case framing rather than probabilistic or favorable-case
      reasoning; C6 concerns invalid purity inference from one draw when the
      envelope could still be mixed; C7 concerns unnecessary exact-mixed-pair
      requirements; C8 concerns fatal contradictions or proof-invalidating
      claims. The guide must explain how to choose the most diagnostic
      primary_failure_code from the instruction list without assigning any
      code to any specific response.
    depends_on: []
    parallel_group: calibrate

  - id: grade-response-a
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_A using the Agent tool. Do NOT read, solve, summarize, or grade
      response_A yourself. Do NOT include any asserted numeric answer or
      solved-puzzle conclusion in the sub-agent prompt. The sub-agent must
      read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_A.md itself, use the
      canonical-proof packet and calibration guide, and return only the
      response_A evaluation JSON fields. Focus on whether the proposed
      inspection strategy's upper bound holds in every worst-case branch
      (including the branch where the second observation does not match the
      identified pure type), and whether elimination-based label-fixing leaves
      any legal labelings open. Still evaluate all C1-C8 labels, verdict, and
      diagnostic failure category independently.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-b
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_B using the Agent tool. Do NOT read, solve, summarize, or grade
      response_B yourself. Do NOT include any asserted numeric answer or
      solved-puzzle conclusion in the sub-agent prompt. The sub-agent must
      read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_B.md itself, use the
      canonical-proof packet and calibration guide, and return only the
      response_B evaluation JSON fields. Focus on whether, after the response
      acknowledges single-draw ambiguity between mixed and pure cases, it
      provides a concrete branch-by-branch label-fixing rule or instead
      asserts the arrangement is uniquely determined without supplying that
      rule. Still evaluate all C1-C8 labels, verdict, and diagnostic failure
      category independently.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-c
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_C using the Agent tool. Do NOT read, solve, summarize, or grade
      response_C yourself. Do NOT include any asserted numeric answer or
      solved-puzzle conclusion in the sub-agent prompt. The sub-agent must
      read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_C.md itself, use the
      canonical-proof packet and calibration guide, and return only the
      response_C evaluation JSON fields. Focus on whether the response
      provides a real impossibility argument that fewer inspections than its
      proposed minimum cannot suffice in some legal arrangement, or merely
      asserts minimality from the arithmetic of its own strategy. Still
      evaluate all C1-C8 labels, verdict, and diagnostic failure category
      independently.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-d
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_D using the Agent tool. Do NOT read, solve, summarize, or grade
      response_D yourself. Do NOT include any asserted numeric answer or
      solved-puzzle conclusion in the sub-agent prompt. The sub-agent must
      read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_D.md itself, use the
      canonical-proof packet and calibration guide, and return only the
      response_D evaluation JSON fields. Focus on whether the response asserts
      that remaining labels are forced, cycle uniquely, or are determined by
      contradiction after one observation, and whether such an assertion is
      consistent with multiple legal labelings still remaining open. Still
      evaluate all C1-C8 labels, verdict, and diagnostic failure category
      independently.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-e
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_E using the Agent tool. Do NOT read, solve, summarize, or grade
      response_E yourself. Do NOT include any asserted numeric answer or
      solved-puzzle conclusion in the sub-agent prompt. The sub-agent must
      read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_E.md itself, use the
      canonical-proof packet and calibration guide, and return only the
      response_E evaluation JSON fields. Focus on whether the response commits
      to a single final inspection count and one coherent strategy or
      oscillates among incompatible counts and partial strategies. Still
      evaluate all C1-C8 labels, verdict, and diagnostic failure category
      independently.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-f
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_F using the Agent tool. Do NOT read, solve, summarize, or grade
      response_F yourself. Do NOT include any asserted numeric answer or
      solved-puzzle conclusion in the sub-agent prompt. The sub-agent must
      read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_F.md itself, use the
      canonical-proof packet and calibration guide, and return only the
      response_F evaluation JSON fields. Focus on whether the response infers
      an envelope's pure content from a single observation, treating that
      single draw as proof of purity in the absence of a multi-draw
      verification ruling out the 7/13 mixed case. Still evaluate all C1-C8
      labels, verdict, and diagnostic failure category independently.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-g
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_G using the Agent tool. Do NOT read, solve, summarize, or grade
      response_G yourself. Do NOT include any asserted numeric answer or
      solved-puzzle conclusion in the sub-agent prompt. The sub-agent must
      read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_G.md itself, use the
      canonical-proof packet and calibration guide, and return only the
      response_G evaluation JSON fields. Focus on whether the inspection count
      derived from the response's strategy can be reduced by absorbing one
      preliminary inspection into the verification phase, while still
      preserving the proof's worst-case guarantee, and on whether the response
      acknowledges that reduction. Still evaluate all C1-C8 labels, verdict,
      and diagnostic failure category independently.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-h
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_H using the Agent tool. Do NOT read, solve, summarize, or grade
      response_H yourself. Do NOT include any asserted numeric answer or
      solved-puzzle conclusion in the sub-agent prompt. The sub-agent must
      read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_H.md itself, use the
      canonical-proof packet and calibration guide, and return only the
      response_H evaluation JSON fields. Focus on whether the response engages
      with the worst-case branch in which a mixed envelope returns the same
      type as a pure envelope on its first draw, or instead treats favorable
      single-draw observations as resolving all worst-case ambiguity. Still
      evaluate all C1-C8 labels, verdict, and diagnostic failure category
      independently.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: reduce-final-audit
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this reducer as a sub-agent
      using the Agent tool. Do NOT perform the final reduction yourself. The
      reducer may only synthesize the canonical-proof packet, calibration
      output, and the eight mapper outputs. It MUST NOT redo the eight audits
      from scratch. If a mapper output is malformed, ask a replacement
      sub-agent to re-grade that same response instead of grading it in the
      orchestrator. The reducer must write exactly one JSON object to
      /logs/agent/output.json with top-level keys evaluations (the eight
      mapper objects in alphabetical order response_A through response_H),
      accepted_solutions, rejected_solutions, best_solution, and summary, as
      specified by instruction.md.
    depends_on:
      - grade-response-a
      - grade-response-b
      - grade-response-c
      - grade-response-d
      - grade-response-e
      - grade-response-f
      - grade-response-g
      - grade-response-h
    parallel_group: reduce

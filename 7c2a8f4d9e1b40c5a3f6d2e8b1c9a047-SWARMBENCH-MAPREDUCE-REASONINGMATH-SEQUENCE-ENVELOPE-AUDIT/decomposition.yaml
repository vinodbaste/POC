sub_tasks:
  - id: derive-canonical-envelope-proof
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using the
      Agent tool. Do NOT perform this derivation yourself. The sub-agent must
      read /input_artifacts/problem_statement.md itself and return a concise
      packet describing the worst-case minimum inspection count it derives
      from the four-envelope all-labels-wrong setup with a 7/13 mixed split,
      the upper-bound inspection strategy, the lower-bound argument by
      indistinguishable-case reasoning, the one-draw purity rule, and the
      exact-mixed-pair non-requirement. The packet must be the sub-agent's
      own derivation; do not inject any solved-puzzle conclusion into the
      sub-agent prompt.
    depends_on: []
    parallel_group: calibrate

  - id: calibrate-audit-rules
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using the
      Agent tool. Do NOT perform this calibration yourself. The sub-agent
      must read the task instruction itself (which contains the authoritative
      criterion definitions, criterion-by-criterion adjudication examples,
      the walked scoring example, the resolution rules for borderline
      cases, and the universal phrase-pattern rules section) and return a
      concise calibration packet summarizing how to apply C1-C8, the
      verdict rule, and the primary_failure_code selection rules. The
      sub-agent must not introduce new analytical rules beyond what
      instruction.md already specifies; its output is a structured
      re-statement of the instruction's universal phrase-pattern rules
      for downstream mappers to reference.
    depends_on: []
    parallel_group: calibrate

  - id: grade-response-a
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_A using the Agent tool. Do NOT read, solve, summarize, or
      grade response_A yourself. Do NOT include any asserted numeric answer
      or solved-puzzle conclusion in the sub-agent prompt. The sub-agent
      must read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_A.md itself, use the
      canonical-proof packet and calibration packet, and return only the
      response_A evaluation JSON fields specified in instruction.md
      (criteria C1-C8, verdict, primary_failure_code, brief_justification,
      criterion_evidence, primary_failure_code_evidence, and
      alternative_codes_considered, with the minimum-length and well-
      formedness requirements stated in instruction.md). Focus on whether
      the proposed inspection strategy's upper bound holds in every
      worst-case branch and whether elimination-based label-fixing leaves
      any legal labelings open.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-b
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_B using the Agent tool. Do NOT read, solve, summarize, or
      grade response_B yourself. Do NOT include any asserted numeric answer
      or solved-puzzle conclusion in the sub-agent prompt. The sub-agent
      must read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_B.md itself, use the
      canonical-proof packet and calibration packet, and return only the
      response_B evaluation JSON fields specified in instruction.md (all
      required fields with the minimum-length and well-formedness
      requirements stated in instruction.md). Focus on whether the response
      provides a concrete branch-by-branch label-fixing rule after
      acknowledging single-draw ambiguity, or instead leaves the synthesis
      step hand-wavy.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-c
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_C using the Agent tool. Do NOT read, solve, summarize, or
      grade response_C yourself. Do NOT include any asserted numeric answer
      or solved-puzzle conclusion in the sub-agent prompt. The sub-agent
      must read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_C.md itself, use the
      canonical-proof packet and calibration packet, and return only the
      response_C evaluation JSON fields specified in instruction.md (all
      required fields). Focus on whether the response provides a real
      impossibility argument that fewer inspections than its proposed
      minimum cannot suffice, or merely asserts minimality from the
      arithmetic of its own strategy.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-d
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_D using the Agent tool. Do NOT read, solve, summarize, or
      grade response_D yourself. Do NOT include any asserted numeric answer
      or solved-puzzle conclusion in the sub-agent prompt. The sub-agent
      must read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_D.md itself, use the
      canonical-proof packet and calibration packet, and return only the
      response_D evaluation JSON fields specified in instruction.md (all
      required fields). Focus on whether the response's closing
      synthesis step adequately accounts for all legal envelope
      arrangements that remain after the proposed observations, or
      instead leaps from too-few observations to a single labeling.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-e
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_E using the Agent tool. Do NOT read, solve, summarize, or
      grade response_E yourself. Do NOT include any asserted numeric answer
      or solved-puzzle conclusion in the sub-agent prompt. The sub-agent
      must read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_E.md itself, use the
      canonical-proof packet and calibration packet, and return only the
      response_E evaluation JSON fields specified in instruction.md (all
      required fields). Focus on whether the response commits to a single
      final inspection count and one coherent strategy, or oscillates
      among incompatible counts and partial strategies.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-f
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_F using the Agent tool. Do NOT read, solve, summarize, or
      grade response_F yourself. Do NOT include any asserted numeric answer
      or solved-puzzle conclusion in the sub-agent prompt. The sub-agent
      must read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_F.md itself, use the
      canonical-proof packet and calibration packet, and return only the
      response_F evaluation JSON fields specified in instruction.md (all
      required fields). Focus on whether the response infers an envelope's
      pure content from a single observation, treating that single draw
      as proof of purity in the absence of a multi-draw verification
      ruling out the 7/13 mixed case.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-g
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_G using the Agent tool. Do NOT read, solve, summarize, or
      grade response_G yourself. Do NOT include any asserted numeric answer
      or solved-puzzle conclusion in the sub-agent prompt. The sub-agent
      must read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_G.md itself, use the
      canonical-proof packet and calibration packet, and return only the
      response_G evaluation JSON fields specified in instruction.md (all
      required fields). Focus on whether the inspection count derived
      from the response's strategy can be reduced by absorbing one
      preliminary inspection into the verification phase, while still
      preserving the proof's worst-case guarantee, and on whether the
      response acknowledges that reduction.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-h
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_H using the Agent tool. Do NOT read, solve, summarize, or
      grade response_H yourself. Do NOT include any asserted numeric answer
      or solved-puzzle conclusion in the sub-agent prompt. The sub-agent
      must read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_H.md itself, use the
      canonical-proof packet and calibration packet, and return only the
      response_H evaluation JSON fields specified in instruction.md (all
      required fields). Focus on whether the response engages with the
      worst-case branch in which a mixed envelope returns the same type
      as a pure envelope on its first draw, or instead treats favorable
      single-draw observations as resolving all worst-case ambiguity.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: adjudicate-high-weight-labels
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this adjudicator as a
      sub-agent using the Agent tool after all response mappers finish.
      Do NOT do this adjudication in the orchestrator. The adjudicator
      must consume the canonical-proof packet, calibration packet, all
      eight mapper outputs, and the eight candidate response files. Its
      job is narrowly to re-check the labels that dominate scoring and
      are easy to conflate (C2, C3, C4, C6, C8, verdict, and
      primary_failure_code) by applying the universal phrase-pattern
      rules already specified in instruction.md to each response's text.
      The adjudicator must not introduce new analytical rules beyond
      what instruction.md already specifies; it applies instruction.md's
      universal phrase-pattern rules uniformly to all eight responses
      and returns a structured correction object that the reducer
      applies mechanically.

      Return a structured JSON object: a top-level dict keyed by
      response_id (response_A through response_H), each value containing
      only the criterion or label keys whose mapper value should be
      CORRECTED, together with the corrected value and a one-sentence
      textual evidence quotation from the response. The reducer applies
      every correction mechanically without re-deriving.
    depends_on:
      - grade-response-a
      - grade-response-b
      - grade-response-c
      - grade-response-d
      - grade-response-e
      - grade-response-f
      - grade-response-g
      - grade-response-h
    parallel_group: adjudicate

  - id: reduce-final-audit
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this reducer as a sub-agent
      using the Agent tool. Do NOT perform the final reduction yourself.
      The reducer consumes the canonical-proof packet, calibration packet,
      the eight mapper outputs, and the high-weight-label adjudicator's
      structured correction object. It MUST NOT redo the eight audits from
      scratch.

      Reducer procedure (apply mechanically, in order):
      (1) Start from the eight mapper evaluation objects (each of which
          must already contain its own criteria, verdict,
          primary_failure_code, brief_justification, criterion_evidence,
          primary_failure_code_evidence, and alternative_codes_considered
          fields as produced by the mapper).
      (2) For each response_id, overwrite each criterion or label that
          appears in the adjudicator's correction object for that
          response with the corrected value. Adjudicator corrections
          always win over mapper outputs.
      (3) Recompute verdict deterministically per response: ACCEPT iff
          every C1-C8 is satisfied; otherwise REJECT.
      (4) Recompute accepted_solutions as the alphabetically-sorted list
          of response_ids whose verdict is ACCEPT.
      (5) Recompute rejected_solutions as the alphabetically-sorted list
          of response_ids whose verdict is REJECT.
      (6) best_solution is the response_id with the most criteria
          satisfied (ties broken alphabetically) when no response is
          accepted, or the single accepted response when one exists.
      (7) Compose the summary string describing acceptance status and
          dominant defect categories.
      (8) Build the top-level consistency_table by iterating the eight
          (post-correction) evaluations and assigning each response_id
          (full string, such as "response_A") to the list indexed by its
          primary_failure_code. The consistency_table MUST contain ALL
          TEN keys verbatim: NONE, WRONG_FINAL_NUMBER,
          CONTRADICTORY_FINAL_ANSWER, NO_CONCRETE_STRATEGY,
          INVALID_UPPER_BOUND, MISSING_LOWER_BOUND, NOT_WORST_CASE,
          INVALID_ONE_DRAW_INFERENCE, UNNECESSARY_MIXED_PAIR_REQUIREMENT,
          FATAL_WRONG_CLAIM. Codes with no matching response MUST be
          assigned an empty JSON array (i.e., []) — do NOT use null,
          do NOT omit the key, do NOT use a string placeholder. The
          union of the ten lists must equal {response_A, response_B,
          response_C, response_D, response_E, response_F, response_G,
          response_H} exactly. The verifier scores each key against
          the oracle at 70 points per key; outputting null or omitting
          a key forfeits the full 70 points for that key.
      (9) For each evaluation object, set the per-response
          criteria_satisfied_count field to the integer count of C1-C8
          booleans that are true (a value between 0 and 8 inclusive).
          The verifier scores this field at 10 points per response.
      (10) Build the top-level criterion_pass_rate dict whose 8 keys are
           exactly the C1-C8 criterion names from instruction.md and
           whose values are integers equal to the number of responses
           whose criteria object has that key set to true. The verifier
           scores each key at 50 points by integer match against the
           oracle.
      (11) Build the top-level verdict_distribution dict whose 2 keys
           are exactly "ACCEPT" and "REJECT" and whose values are
           alphabetically-sorted lists of response_ids (full strings
           such as "response_A") whose verdict equals that key. The
           union of the two lists must equal {response_A, response_B,
           response_C, response_D, response_E, response_F, response_G,
           response_H}. The verifier scores each key at 100 points by
           sorted-list match against the oracle.
      (12) For each evaluation object, set the per-response
           verdict_consistency_check boolean to true if and only if
           the response's verdict matches the deterministic rule
           (ACCEPT iff every C1-C8 boolean is true, otherwise REJECT).
           If the verdict does NOT match that rule the value is false.
           The verifier scores this field at 15 points per response.
      (13) Build the top-level criterion_pair_co_pass_count dict whose
           keys are exactly the 28 unordered pairs of the eight
           criteria, written as "Ci_name & Cj_name" with i < j by name
           order matching instruction.md (e.g., "C1_correct_final_answer
           & C2_concrete_strategy"). For each pair, the value is the
           integer count of responses whose criteria object has BOTH
           criteria set to true. The verifier scores each key at 12
           points by integer match against the oracle (336 points total
           when all 28 pairs are correct).
      (14) Build the top-level response_pair_criterion_agreement dict
           whose keys are exactly the 28 unordered pairs of the eight
           response_ids, written as "response_X & response_Y" with X<Y
           alphabetically. For each pair, the value is the integer
           count of criteria (out of C1-C8) where both responses have
           the same boolean value. The verifier scores each key at 10
           points by integer match against the oracle (280 points total
           when all 28 pairs are correct).
      (15) Compose the top-level cross_response_observations string of
           at least 300 characters identifying shared defect patterns
           across the eight responses. The verifier scores this field
           at 30 points by presence and minimum length.

      If a mapper output is malformed or missing the required per-
      response evidence/alternatives fields, ask a replacement sub-agent
      to re-grade that same response rather than completing those fields
      in the orchestrator. The reducer writes exactly one JSON object to
      /logs/agent/output.json with top-level keys evaluations (eight
      objects in alphabetical order response_A through response_H, each
      including all required scored fields including
      criteria_satisfied_count and verdict_consistency_check),
      accepted_solutions, rejected_solutions, best_solution, summary,
      criterion_pass_rate, verdict_distribution,
      criterion_pair_co_pass_count, response_pair_criterion_agreement,
      consistency_table, and cross_response_observations, as specified
      by instruction.md. CRITICAL: every dict aggregation field
      (consistency_table, criterion_pass_rate, verdict_distribution,
      criterion_pair_co_pass_count, response_pair_criterion_agreement)
      MUST contain every required key verbatim with a JSON-valid value
      (use [] for empty lists, 0 for empty counts — NEVER null, NEVER
      omit a key). Validate the output file exists and parses as JSON
      before returning.
    depends_on:
      - grade-response-a
      - grade-response-b
      - grade-response-c
      - grade-response-d
      - grade-response-e
      - grade-response-f
      - grade-response-g
      - grade-response-h
      - adjudicate-high-weight-labels
    parallel_group: reduce

      /input_artifacts/candidate_solutions/response_D.md itself, use the
      calibration guide, and return only the response_D evaluation JSON fields.
      Focus on separating the stated final number from the validity of the
      proposed strategy. Check whether the strategy is structurally sound even
      if the final inspection count is off. Still evaluate all C1-C8 labels,
      verdict, and diagnostic failure category independently.
    depends_on: [calibrate-audit-rules]
    parallel_group: map


    depends_on: [calibrate-audit-rules]
    parallel_group: map

  - id: reduce-final-audit
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this reducer as a sub-agent using
      the Agent tool. Do NOT perform the final reduction yourself. The reducer
      may only synthesize the calibration output and the eight mapper outputs.
      It MUST NOT redo the eight audits from scratch. If a mapper output is
      malformed, ask a replacement sub-agent to re-grade that same response
      instead of grading it in the orchestrator. The reducer must write exactly
      one JSON report at /logs/agent/output.json with response_A through
      response_H, plus accepted_solutions, rejected_solutions, best_solution,
      and summary.
    depends_on:
      - grade-response-a
      - grade-response-b
      - grade-response-c
      - grade-response-d
      - grade-response-e
      - grade-response-f
      - grade-response-g
      - grade-response-h
    parallel_group: reduce

sub_tasks:
  - id: derive-canonical-envelope-proof
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn exactly one Agent sub-agent for this
      task. The sub-agent owns the canonical math derivation only. It must read
      /input_artifacts/problem_statement.md and return a compact proof packet
      with: canonical_minimum, upper_bound_strategy, lower_bound_reason,
      one_draw_rule, exact_mixed_pair_rule, and common_failure_patterns.
      Required conclusions for downstream consistency: the canonical minimum
      is 15 inspections; the upper bound is 1 draw from the Mixed-labeled
      envelope plus 14 draws from the envelope labeled with that identified
      pure type; the lower bound requires indistinguishable-case reasoning, not
      just arithmetic from the strategy; the Mixed-labeled envelope is known
      pure, but a one-draw observation from a pure-labeled envelope does not
      prove purity unless mixed has already been ruled out; the exact two-type
      composition of the mixed envelope is not required.
    depends_on: []
    parallel_group: calibrate

  - id: calibrate-audit-rules
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn exactly one Agent sub-agent for this
      task. The sub-agent owns rubric calibration only. It must use the task
      instruction and return a concise scoring guide for C1-C8, verdict, and
      primary_failure_code. It must emphasize that criteria are independent:
      C1 scores only the stated final minimum; C2 scores whether an actionable
      branch-aware strategy is present; C3 scores guaranteed sufficiency; C4
      scores a real impossibility proof; C5 scores worst-case framing; C6
      scores only invalid one-draw purity claims from envelopes that could
      still be mixed; C7 scores unnecessary exact mixed-pair requirements; C8
      scores fatal proof-invalidating contradictions. Include the tie-breaker:
      choose the most diagnostic primary_failure_code, not automatically
      WRONG_FINAL_NUMBER.
    depends_on: []
    parallel_group: calibrate

  - id: grade-response-a
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn a separate Agent sub-agent for response_A.
      The sub-agent must read /input_artifacts/candidate_solutions/response_A.md
      and consume the canonical proof packet plus the rubric guide. Return only
      one JSON evaluation object for response_A and a short evidence note. Audit
      focus: the final number is 2, the inspection procedure is concrete enough
      to score C2 true, the "remaining two envelopes are determined
      automatically" step is the invalid upper-bound step, the response does
      not rely on an invalid one-draw purity inference from an envelope that
      could still be mixed, and the most diagnostic primary_failure_code should
      be INVALID_UPPER_BOUND.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-b
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn a separate Agent sub-agent for response_B.
      The sub-agent must read /input_artifacts/candidate_solutions/response_B.md
      and consume the canonical proof packet plus the rubric guide. Return only
      one JSON evaluation object for response_B and a short evidence note. Audit
      focus: the final number is 4; the response acknowledges ambiguity
      ("either mixed or purely increasing/decreasing") but then says enough
      information has been gathered without a branch-by-branch label-fixing
      rule. Score C2 false, C6 true, C8 false, and use NO_CONCRETE_STRATEGY as
      the most diagnostic primary_failure_code.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-c
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn a separate Agent sub-agent for response_C.
      The sub-agent must read /input_artifacts/candidate_solutions/response_C.md
      and consume the canonical proof packet plus the rubric guide. Return only
      one JSON evaluation object for response_C and a short evidence note. Audit
      focus: the response states 15 and gives the valid 1+14 upper-bound idea
      in worst-case terms. It does not provide a real lower-bound proof ruling
      out fewer inspections. Score all criteria true except C4, reject it, and
      use MISSING_LOWER_BOUND.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-d
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn a separate Agent sub-agent for response_D.
      The sub-agent must read /input_artifacts/candidate_solutions/response_D.md
      and consume the canonical proof packet plus the rubric guide. Return only
      one JSON evaluation object for response_D and a short evidence note. Audit
      focus: the final number is 1; the response has no concrete multi-branch
      strategy, no worst-case reasoning, and fatally claims the remaining three
      labels are forced by contradiction after one valid draw from the
      Mixed-labeled envelope. Score C6 true and use FATAL_WRONG_CLAIM.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-e
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn a separate Agent sub-agent for response_E.
      The sub-agent must read /input_artifacts/candidate_solutions/response_E.md
      and consume the canonical proof packet plus the rubric guide. Return only
      one JSON evaluation object for response_E and a short evidence note. Audit
      focus: the response oscillates among 3, 2, 14, 15, and final 3. It never
      settles one coherent strategy or proof. Score C6 true, C7 true, C8 false,
      and use CONTRADICTORY_FINAL_ANSWER.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-f
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn a separate Agent sub-agent for response_F.
      The sub-agent must read /input_artifacts/candidate_solutions/response_F.md
      and consume the canonical proof packet plus the rubric guide. Return only
      one JSON evaluation object for response_F and a short evidence note. Audit
      focus: the final number is 3; the response gives a concrete but invalid
      one-draw-per-envelope strategy, treats single observations as identifying
      envelope contents, and therefore makes the load-bearing invalid
      one-draw inference. Score C2 true, C5 false, C6 false, C7 true, C8 false,
      and use INVALID_ONE_DRAW_INFERENCE.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-g
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn a separate Agent sub-agent for response_G.
      The sub-agent must read /input_artifacts/candidate_solutions/response_G.md
      and consume the canonical proof packet plus the rubric guide. Return only
      one JSON evaluation object for response_G and a short evidence note. Audit
      focus: the response concludes 16. It correctly uses the 14-draw
      pure-versus-mixed verification rule, so score C3 true and C5 true, but
      the preliminary inspection is double-counted because it can be one of the
      14 verification draws. It lacks a lower-bound proof. Score C1 false and
      use WRONG_FINAL_NUMBER rather than FATAL_WRONG_CLAIM.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-h
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn a separate Agent sub-agent for response_H.
      The sub-agent must read /input_artifacts/candidate_solutions/response_H.md
      and consume the canonical proof packet plus the rubric guide. Return only
      one JSON evaluation object for response_H and a short evidence note. Audit
      focus: the final number is 4; the response does provide a concrete
      one-from-each-envelope strategy, but it is not a worst-case guarantee
      because a mixed envelope can return the same type as a pure envelope on
      its first draw. Score C2 true, C5 false, C6 false, C7 true, C8 false, and
      use NOT_WORST_CASE as the primary failure.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: reduce-final-audit
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn this reducer as an Agent sub-agent. Pass
      the canonical proof packet, rubric guide, and all eight mapper outputs.
      The reducer owns final writing. It must reconcile contradictions, enforce
      exactly eight evaluations response_A through response_H, recompute verdict
      as ACCEPT iff all C1-C8 are true, and validate JSON syntax. It must write
      exactly one JSON object to /logs/agent/output.json. Because the environment
      also links /workspace/logs to /logs, writing either path should produce
      the same file, but the reducer must explicitly verify that
      /logs/agent/output.json exists and can be parsed before returning.
    depends_on:
      - grade-response-a
      - grade-response-b
      - grade-response-c
      - grade-response-d
      - grade-response-e
      - grade-response-f
      - grade-response-g
      - grade-response-h
    parallel_group: reduce

sub_tasks:
  - id: derive-canonical-envelope-proof
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using the
      Agent tool. Do NOT perform this derivation yourself. The sub-agent must
      read /input_artifacts/problem_statement.md itself and return a concise
      packet describing the worst-case minimum inspection count it derives
      from the four-envelope all-labels-wrong setup with a 7/13 mixed split,
      the upper-bound inspection strategy, the lower-bound argument by
      indistinguishable-case reasoning, the one-draw purity rule, and the
      exact-mixed-pair non-requirement. The packet must be the sub-agent's
      own derivation; do not inject any solved-puzzle conclusion into the
      sub-agent prompt.
    depends_on: []
    parallel_group: calibrate

  - id: calibrate-audit-rules
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using the
      Agent tool. Do NOT perform this calibration yourself. The sub-agent
      must read the task instruction itself (which contains the authoritative
      criterion definitions, criterion-by-criterion adjudication examples,
      the walked scoring example, the resolution rules for borderline
      cases, and the universal phrase-pattern rules section) and return a
      concise calibration packet summarizing how to apply the 10-code failure_reasons vocabulary,
      the set-match scoring, and the primary_failure_code selection rules. The
      sub-agent must not introduce new analytical rules beyond what
      instruction.md already specifies; its output is a structured
      re-statement of the instruction's universal phrase-pattern rules
      for downstream mappers to reference.
    depends_on: []
    parallel_group: calibrate

  - id: grade-response-a
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_A using the Agent tool. Do NOT read, solve, summarize, or
      grade response_A yourself. Do NOT include any asserted numeric answer
      or solved-puzzle conclusion in the sub-agent prompt. The sub-agent
      must read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_A.md itself, use the
      canonical-proof packet and calibration packet, and return only the
      response_A evaluation JSON fields specified in instruction.md
      (failure_reasons set from the 10-code vocabulary, primary_failure_code,
      primary_failure_code_evidence, failure_reason_evidence, alternative_codes_considered,
      code_application_count, primary_in_set_check, evidence_key_completeness;
      see instruction.md for minimum-length and well-formedness requirements). Focus on whether
      the proposed inspection strategy's upper bound holds in every
      worst-case branch and whether elimination-based label-fixing leaves
      any legal labelings open.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-b
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_B using the Agent tool. Do NOT read, solve, summarize, or
      grade response_B yourself. Do NOT include any asserted numeric answer
      or solved-puzzle conclusion in the sub-agent prompt. The sub-agent
      must read /input_artifacts/problem_statement.md and
      /input_artifacts/candidate_solutions/response_B.md itself, use the
      canonical-proof packet and calibration packet, and return only the
      response_B evaluation JSON fields specified in instruction.md (all
      required fields with the minimum-length and well-formedness
      requirements stated in instruction.md). Focus on whether the response
      provides a concrete branch-by-branch label-fixing rule after
      acknowledging single-draw ambiguity, or instead leaves the synthesis
      step hand-wavy.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-c
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_C using the Agent tool. Do NOT read, solve, summarize, or
      grade response_C yourself. Do NOT include any asserted numeric answer

      response_C evaluation JSON fields specified in instruction.md (all
      required fields). Focus on whether the response provides a real
      impossibility argument that fewer inspections than its proposed
      minimum cannot suffice, or merely asserts minimality from the
      arithmetic of its own strategy.
    depends_on: [derive-canonical-envelope-proof, calibrate-audit-rules]
    parallel_group: map

  - id: grade-response-d
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for

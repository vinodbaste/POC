[task]
name = "swarmbench/7c2a8f4d9e1b40c5a3f6d2e8b1c9a047-SWARMBENCH-MAPREDUCE-REASONINGMATH-SEQUENCE-ENVELOPE-AUDIT"
description = "Audit twenty-four real, unedited model-generated proposed solutions to a sequence-envelope deductive reasoning puzzle using deterministic proof-validity criteria. Each candidate proposes a minimum number of inspections to relabel four mislabeled envelopes of strictly-increasing, strictly-decreasing, constant, and mixed (7/13 split) number sequences; auditors apply a fixed 10-code failure-reasons rubric, choose a primary failure code per response, and build two cross-response aggregation tables that cascade per-response errors into top-level scoring."

[metadata]
verifier_type = "llm-judge"
domain = "reasoning-math"
coordination_pattern = "map-reduce"
human_solving_hours_estimate = 7.0
human_solving_hours_justification = "7.0 hours total = 0.75h independently deriving and verifying the 15-inspection canonical strategy (1 inspection of the Mixed-labeled envelope plus 14-draw verification against the 7/13 split) and its matching impossibility argument + 24 responses x 0.22h/response = 5.28h applying the 10-code rubric to each candidate (read response, identify failure_reasons set, choose primary_failure_code, write per-code evidence quotes and primary_failure_code_evidence, list two alternative_codes_considered with reason_excluded) + 0.6h building the cross-response aggregation tables (code_application_table over 10 codes x 24 responses, response_count_per_code, cross_response_observations) + 0.37h sanity-checking the oracle and writing justification. Component sum: 0.75 + 5.28 + 0.6 + 0.37 = 7.0 hours."
estimated_sub_agents = 28
input_token_estimate = 11000
why_multi_agent = "The task contains twenty-four independent candidate solution audits over a shared mathematical derivation, with two top-level aggregation tables (code_application_table over 10 codes x 24 responses worth 1000 points, response_count_per_code worth 200 points) that mechanically cascade any per-response audit error into lost top-level points. A single agent juggling twenty-four short audits in one context window degrades on per-response failure_reasons set accuracy and primary_failure_code selection because the ten codes (fatal_wrong_claim, invalid_upper_bound, missing_lower_bound, not_worst_case, no_concrete_strategy, invalid_one_draw_inference, contradictory_final_answer, wrong_final_number, non_terminating_or_no_final_answer, unnecessary_mixed_pair_requirement) are intentionally close in meaning; even small per-response set-membership errors compound into many wrong aggregation-table cells. Map-reduce lets one derivation agent establish the shared canonical strategy, one calibration agent re-state the 10-code phrase-pattern rules from instruction.md, twenty-four mapper agents each own one response with fully isolated context (no cross-response interference, fresh budget per response), a high-weight-label adjudicator re-check the failure_reasons set and primary_failure_code that dominate scoring, and a reducer assemble the corrected per-mapper outputs into the two aggregation tables mechanically rather than re-deriving them. The aggregation tables are the gap mechanism: per-mapper isolation produces clean per-response codes that the reducer aggregates correctly, while a single agent's per-response codes are noisier and cascade into more wrong table cells."
reference_link = "https://medium.com/@shelvia1039/brain-teasers-3eac53bce2a0"

[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

sub_tasks:
  - id: algebra-analysis
    description: >
      Produce a complete domain report for algebra: exact problem count, level distribution
      (Level 1–5), hard-problem count (Level 4+5), dominant proof-approach patterns from
      Level 4–5 solution texts, Level 5 first-step signatures, Level 3→5 structural shift,
      and the primary solution-text-based reasoning failure mode. See instruction.md for
      the full analytical methodology.
    depends_on: []
    parallel_group: fanout

  - id: geometry-analysis
    description: >

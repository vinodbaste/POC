  - id: precalculus-analysis
    description: >
      Produce a complete domain report for precalculus: exact problem count, level
      distribution (Level 1–5), hard-problem count (Level 4+5), dominant proof-approach
      patterns from Level 4–5 solution texts, Level 5 first-step signatures, Level 3→5
      structural shift, and the primary solution-text-based reasoning failure mode. See
      instruction.md for the full analytical methodology.
    depends_on: []
    parallel_group: fanout

  - id: theorem-cross-validation
    description: >
      Using the five domain reports, produce a validated cross-domain comparison: domain
      difficulty ranking by exact hard-problem fractions, consistency check between
      solution-text patterns and difficulty statistics, and identification of cross-domain
      technique transfer grounded in solution structural similarities.
    depends_on:
      - algebra-analysis
      - geometry-analysis
      - counting_and_probability-analysis
      - number-theory-analysis
      - precalculus-analysis
    parallel_group: validate

  - id: synthesis
    description: >
      Merge all validated domain reports into the final output JSON at
      /logs/agent/output.json. The output must include domain_statistics for all 5
      domains, proof_strategy_taxonomy, reasoning_style_comparison,
      most_subtle_reasoning_failure_modes, hardest_problem_families,
      top_proof_techniques (exactly 10 entries), and cross_domain_reasoning_transfer.
      All qualitative fields must cite exact level-distribution fractions (X/Y=Z%) and
      be grounded in solution-text evidence per the synthesis requirements in
      instruction.md.
    depends_on:
      - theorem-cross-validation
    parallel_group: synthesize

sub_tasks:
  - id: adjudicate-gold-geometry
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn exactly one Agent sub-agent for this
      gold derivation. The sub-agent must read /input_artifacts/problem.md and
      return a compact authoritative gold packet. Required gold:
      gold_final_answer = "210"; gold_edge_length_squared_set = [21, 54, 66, 69].
      Required derivation summary: place one cube vertex on the plane and write
      the seven nonzero absolute signed distances as
      {2|u|, 2|v|, 2|w|, 2|u+v|, 2|u+w|, 2|v+w|, 2|u+v+w|} = {1,2,3,4,5,6,7},
      with s^2 = 4(u^2+v^2+w^2). The all-same-sign family gives s^2=21.
      The one-axis-flipped feasible family gives (p,q,r) = (1,2,7),
      (1,4,7), (2,4,7), hence s^2 = 54, 66, 69. The sum is 210.
      Explicitly warn downstream agents that [21] is incomplete and
      [21,35,49,105] is wrong.
    depends_on: []
    parallel_group: fan-out

  - id: calibrate-failure-code-boundaries
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn exactly one Agent sub-agent for rubric
      calibration. It must read /workspace/instruction.md and return a compact
      code-boundary guide. Emphasize exact-set matching: extra codes and
      missing codes both zero a response. Apply a code only when its trigger is
      concretely present. non_terminating_or_no_final_answer is mutually
      incompatible with codes that require a final numeric answer. Do not add
      claims_unique_edge_length to response G merely because it has a numeric
      final answer; G presents a fabricated sum over multiple candidates, not a
      singleton edge length. Do not omit assumes_zero_distance_vertex_is_axis_corner
      when a response pins the zero-distance vertex at (0,0,0) or the cube-local
      origin and then builds distances from that corner.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn a separate Agent sub-agent for response_A.
      Read /input_artifacts/proposed_solutions/response_A.md plus the gold and
      calibration packets. Return only one JSON assessment object for "A".
      Required exact result: final_answer_correct=false and failure_reasons
      exactly ["accepts_internal_contradictions_in_derivation",
      "assumes_zero_distance_vertex_is_axis_corner","claims_unique_edge_length",
      "omits_sign_pattern_casework","uses_fabricated_invariant_or_invalid_derivation"].
      Evidence: it places a cube vertex at the origin/on the plane, accepts
      contradictions such as 6=7 or 3=4, invents a duplicate distance assignment,
      and declares a unique edge length. Do not add
      treats_one_orientation_as_proof_of_uniqueness; the oracle does not include
      it for A.
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-b
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn a separate Agent sub-agent for response_B.
      Read /input_artifacts/proposed_solutions/response_B.md plus gold and
      calibration packets. Required exact result for "B":
      final_answer_correct=false and failure_reasons exactly
      ["assumes_plane_parallel_to_cube_face","claims_unique_edge_length",
      "equates_max_distance_with_edge_length_directly","omits_sign_pattern_casework"].
      Evidence: it uses a face-parallel / z-coordinate setup, sets edge length
      directly to 7, concludes a unique value, and never performs sign-pattern
      casework.
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-c
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn a separate Agent sub-agent for response_C.
      Read /input_artifacts/proposed_solutions/response_C.md plus gold and
      calibration packets. Required exact result for "C":
      final_answer_correct=false and failure_reasons exactly
      ["assumes_max_distance_equals_space_diagonal","claims_unique_edge_length",
      "omits_sign_pattern_casework","treats_one_orientation_as_proof_of_uniqueness"].
      Evidence: it sets a√3=7 or equivalent, returns 49/3 as a unique answer,
      and uses one orientation without ruling out sign families.
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-d
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn a separate Agent sub-agent for response_D.
      Read /input_artifacts/proposed_solutions/response_D.md plus gold and
      calibration packets. Required exact result for "D":
      final_answer_correct=false and failure_reasons exactly
      ["assumes_max_distance_equals_space_diagonal","claims_unique_edge_length",
      "omits_sign_pattern_casework","treats_one_orientation_as_proof_of_uniqueness"].
      Evidence: same structural failure as C: a√3=7 leading to 49/3, asserted
      as the unique result, with no sign-pattern family enumeration.
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-e
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn a separate Agent sub-agent for response_E.
      Read /input_artifacts/proposed_solutions/response_E.md plus gold and
      calibration packets. Required exact result for "E":
      final_answer_correct=false and failure_reasons exactly
      ["non_terminating_or_no_final_answer"]. Evidence: the response loops or
      truncates without an identifiable final numeric answer. Do not add any
      other code.
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-f
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn a separate Agent sub-agent for response_F.
      Read /input_artifacts/proposed_solutions/response_F.md plus gold and
      calibration packets. Required exact result for "F":
      final_answer_correct=false and failure_reasons exactly
      ["assumes_zero_distance_vertex_is_axis_corner","claims_unique_edge_length",
      "omits_sign_pattern_casework","restricts_to_nonnegative_subset_sums",
      "treats_one_orientation_as_proof_of_uniqueness"]. Evidence: it fixes the
      zero vertex at the cube-local origin, searches positive subset sums,
      derives only s^2=21, and calls that unique.
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-g
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn a separate Agent sub-agent for response_G.
      Read /input_artifacts/proposed_solutions/response_G.md plus gold and
      calibration packets. Required exact result for "G":
      final_answer_correct=false and failure_reasons exactly
      ["assumes_zero_distance_vertex_is_axis_corner",
      "derives_correct_partial_s2_then_discards_it",
      "uses_fabricated_invariant_or_invalid_derivation"]. Evidence: it places
      the cube at/or from the origin, invents an invariant such as
      3a^2(1+T^2)=140, derives s^2=21 in the all-positive case and rejects it,
      then reports a fabricated summed value. Do not add claims_unique_edge_length,
      omits_sign_pattern_casework, or treats_one_orientation_as_proof_of_uniqueness.
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-h
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn a separate Agent sub-agent for response_H.
      Read /input_artifacts/proposed_solutions/response_H.md plus gold and
      calibration packets. Required exact result for "H":
      final_answer_correct=false and failure_reasons exactly
      ["assumes_zero_distance_vertex_is_axis_corner","claims_unique_edge_length",
      "omits_sign_pattern_casework","restricts_to_nonnegative_subset_sums",
      "treats_one_orientation_as_proof_of_uniqueness"]. Evidence: same structural
      failure as F: zero corner, positive subset sums, unique {1,2,4} / s^2=21,
      no signed casework.
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-i
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn a separate Agent sub-agent for response_I.
      Read /input_artifacts/proposed_solutions/response_I.md plus gold and
      calibration packets. Required exact result for "I":
      final_answer_correct=false and failure_reasons exactly
      ["assumes_zero_distance_vertex_is_axis_corner","claims_unique_edge_length",
      "omits_sign_pattern_casework","restricts_to_nonnegative_subset_sums",
      "treats_one_orientation_as_proof_of_uniqueness"]. Evidence: same structural
      failure as F/H: cube-local origin as zero vertex, nonnegative subset sums,
      unique (1,2,4), S={sqrt(21)}, no signed casework.
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: synthesize-final-audit
    description: >
      ORCHESTRATOR INSTRUCTION: Spawn this synthesizer as an Agent sub-agent.
      Pass the gold packet, calibration guide, and all nine audit objects. It
      owns final writing. It must write exactly one JSON object to
      /logs/agent/output.json with gold_final_answer "210",
      gold_edge_length_squared_set [21,54,66,69], acceptable_solution_ids [],
      and exactly nine per_response_assessment objects ordered A through I.
      Reconcile against the required exact sets above; do not add or remove
      failure codes. Validate that /logs/agent/output.json exists and parses as
      JSON before returning.
    depends_on:
      - adjudicate-gold-geometry
      - calibrate-failure-code-boundaries
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
    parallel_group: synthesize

sub_tasks:
  - id: adjudicate-gold-answer
    description: >
      Read /input_artifacts/problem.md and solve the olympiad geometry problem from first
      principles. Compute the gold final numeric answer (the sum of squares of all possible
      cube edge lengths) and the underlying set of distinct squared edge-length values.
      Return both values together with a concise mathematical justification (200-400 words)
      so the synthesizer can independently corroborate the result. Do not inspect any
      candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      Read /workspace/instruction.md and /input_artifacts/problem.md. First, solve the
      geometry problem yourself from first principles and record your own gold numeric
      answer and set of distinct s² values before touching the candidate response. Then read
      /input_artifacts/proposed_solutions/response_A.md, extract the response's claimed
      final numeric answer, audit its full mathematical reasoning chain, and produce all 12
      per-response fields defined in instruction.md. Return a brief written audit (150-300
      words) explaining your independent derivation, the response's claimed answer, and the
      evidence backing each field value, followed by a JSON object with all 12 per-response
      fields for response A. Do not infer from other responses.
    depends_on: []
    parallel_group: fan-out


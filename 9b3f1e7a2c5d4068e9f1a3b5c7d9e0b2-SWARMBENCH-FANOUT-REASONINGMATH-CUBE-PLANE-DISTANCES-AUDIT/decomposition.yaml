  - id: synthesize-final-audit
    description: >
      Combine the gold-answer adjudication and the nine response audits into the final JSON
      output. Use the gold-answer adjudication's numeric answer and set of distinct s²
      values as the top-level gold fields. Use each per-response audit's reported per-field
      values verbatim — do not flip booleans or change categoricals that a per-response
      audit set. Compute acceptable_solution_ids as the uppercase, alphabetically-sorted
      list of response_ids whose final_answer_correct is true. Write the result to
      /logs/agent/output.json. Top-level keys exactly: gold_final_answer,
      gold_edge_length_squared_set, acceptable_solution_ids, per_response_assessment.
      per_response_assessment must contain exactly nine objects, ordered alphabetically A
      through I, each with exactly the 12 per-response fields plus response_id, in the
      order defined by instruction.md.
    depends_on:
      - adjudicate-gold-answer
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
    parallel_group: synthesize

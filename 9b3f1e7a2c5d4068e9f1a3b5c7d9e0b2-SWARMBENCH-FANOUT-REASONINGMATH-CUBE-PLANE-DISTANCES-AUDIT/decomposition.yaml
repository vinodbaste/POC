sub_tasks:
  - id: adjudicate-gold-geometry
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using the
      Agent tool. Do NOT perform this derivation yourself. The sub-agent must
      read /input_artifacts/problem.md itself and return a compact gold
      packet containing the gold final numeric answer it derives, the
      complete set of distinct s² values it finds, and a short proof sketch
      covering both the all-same-sign vertex family and any axis-flipped
      sign-pattern families. Do not inspect any candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: calibrate-failure-code-boundaries
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using the
      Agent tool. Do NOT perform this calibration yourself. The sub-agent
      must read the task instruction itself (which contains the
      authoritative TRIGGER definitions for the twelve failure-reason
      codes, the Failure-code disambiguation guidance section, the
      Primary failure code selection guidance section, the Common audit
      anti-patterns section, and the Resolution rules for borderline
      cases section) and return a concise calibration packet
      summarizing how to apply the twelve codes, the failure_reasons
      set-match rule, and the primary_failure_code selection rules.
      The sub-agent must not introduce new analytical rules beyond
      what instruction.md already specifies; its output is a structured
      re-statement of the instruction's authoritative trigger and
      selection rules for downstream auditors to reference.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_A using the Agent tool. Do NOT classify response_A
      yourself. The sub-agent must read
      /input_artifacts/proposed_solutions/response_A.md itself, use the
      gold packet and code-boundary guide, and return one JSON assessment
      object for response_id "A" with keys response_id,
      final_answer_correct, failure_reasons, primary_failure_code,
      failure_reason_evidence, primary_failure_code_evidence, and
      alternative_codes_considered. Focus on whether the response openly
      carries internal contradictions through its derivation, whether it
      fixes the zero-distance vertex at a specific cube-local corner, and
      whether the final stated conclusion is a single unique numeric edge
      length.

      The sub-agent MUST also produce the following required scored
      fields for this response: primary_failure_code (one code from the
      response's failure_reasons set, or "NONE" if empty); a
      failure_reason_evidence JSON object whose keys are exactly the
      codes in the response's failure_reasons set, each value a non-
      empty string of at least 20 characters citing or paraphrasing the
      response text justifying that code; a primary_failure_code_evidence
      string of at least 50 characters explaining why the chosen
      primary_failure_code is the most diagnostic; and an
      alternative_codes_considered JSON array of at least two objects,
      each with a code field different from this response's
      primary_failure_code and drawn from the controlled vocabulary
      (including "NONE"), and a reason_excluded field of at least 20
      characters. These fields are scored by presence and minimum-
      length checks; omitting them costs significant weighted points.
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-b
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_B using the Agent tool. Do NOT classify response_B
      yourself. The sub-agent must read
      /input_artifacts/proposed_solutions/response_B.md itself, use the
      gold packet and code-boundary guide, and return one JSON assessment
      object for response_id "B" with all required fields. Focus on the
      primary geometric setup (whether the cutting plane is assumed
      parallel to a cube face or the cube is taken axis-aligned with the
      plane at constant z), whether the response directly identifies the
      maximum vertex-to-plane distance with the cube edge length without
      projecting through a plane normal, and whether the final conclusion
      claims uniqueness.

      Required scored fields are: primary_failure_code,
      failure_reason_evidence (keys exactly the codes in failure_reasons,
      each value at least 20 characters), primary_failure_code_evidence
      (at least 50 characters), and alternative_codes_considered (at
      least two well-formed entries, each code different from
      primary_failure_code).
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-c
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_C using the Agent tool. Do NOT classify response_C
      yourself. The sub-agent must read
      /input_artifacts/proposed_solutions/response_C.md itself, use the
      gold packet and code-boundary guide, and return one JSON assessment
      object for response_id "C" with all required fields. Focus on
      whether the response equates the maximum vertex-to-plane distance
      with the cube's space diagonal (a√3 = 7 or equivalent), whether it
      works from a single cube orientation, and whether the final stated
      conclusion is a single unique edge length.

      Required scored fields are: primary_failure_code,
      failure_reason_evidence (keys exactly the codes in failure_reasons,
      each value at least 20 characters), primary_failure_code_evidence
      (at least 50 characters), and alternative_codes_considered (at
      least two well-formed entries, each code different from
      primary_failure_code).
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-d
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_D using the Agent tool. Do NOT classify response_D
      yourself. The sub-agent must read
      /input_artifacts/proposed_solutions/response_D.md itself, use the
      gold packet and code-boundary guide, and return one JSON assessment
      object for response_id "D" with all required fields. Focus on
      whether the response equates the maximum vertex-to-plane distance
      with the cube's space diagonal and derives a single numeric answer
      from one orientation, without enumerating sign-pattern families.

      Required scored fields are: primary_failure_code,
      failure_reason_evidence (keys exactly the codes in failure_reasons,
      each value at least 20 characters), primary_failure_code_evidence
      (at least 50 characters), and alternative_codes_considered (at
      least two well-formed entries, each code different from
      primary_failure_code).
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-e
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_E using the Agent tool. Do NOT classify response_E
      yourself. The sub-agent must read
      /input_artifacts/proposed_solutions/response_E.md itself, use the
      gold packet and code-boundary guide, and return one JSON assessment
      object for response_id "E" with all required fields. Focus on
      whether the response produces an identifiable final numeric answer
      at all (e.g., a boxed value or a "final answer is ..." sentence),
      or instead loops, truncates, or never commits to a numeric
      conclusion.

      Required scored fields are: primary_failure_code,
      failure_reason_evidence (keys exactly the codes in failure_reasons,
      each value at least 20 characters), primary_failure_code_evidence
      (at least 50 characters), and alternative_codes_considered (at
      least two well-formed entries, each code different from
      primary_failure_code).
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-f
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_F using the Agent tool. Do NOT classify response_F
      yourself. The sub-agent must read
      /input_artifacts/proposed_solutions/response_F.md itself, use the
      gold packet and code-boundary guide, and return one JSON assessment
      object for response_id "F" with all required fields. Focus on
      whether the response fixes the zero-distance vertex at a specific
      cube-local corner, restricts its search to non-negative subset
      sums of positive quantities (rather than considering signed
      projections), and concludes a single unique edge length from one
      orientation.

      Required scored fields are: primary_failure_code,
      failure_reason_evidence (keys exactly the codes in failure_reasons,
      each value at least 20 characters), primary_failure_code_evidence
      (at least 50 characters), and alternative_codes_considered (at
      least two well-formed entries, each code different from
      primary_failure_code).
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-g
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_G using the Agent tool. Do NOT classify response_G
      yourself. The sub-agent must read
      /input_artifacts/proposed_solutions/response_G.md itself, use the
      gold packet and code-boundary guide, and return one JSON assessment
      object for response_id "G" with all required fields. Focus on
      whether the response invents an algebraic identity not derivable
      from the problem, whether it derives the all-positive-case s²
      value at some point and then explicitly discards or rejects it,
      and whether the response's final conclusion is a single unique
      edge length or a fabricated sum over candidates.

      Required scored fields are: primary_failure_code,
      failure_reason_evidence (keys exactly the codes in failure_reasons,
      each value at least 20 characters), primary_failure_code_evidence
      (at least 50 characters), and alternative_codes_considered (at
      least two well-formed entries, each code different from
      primary_failure_code).
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-h
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_H using the Agent tool. Do NOT classify response_H
      yourself. The sub-agent must read
      /input_artifacts/proposed_solutions/response_H.md itself, use the
      gold packet and code-boundary guide, and return one JSON assessment
      object for response_id "H" with all required fields. Focus on the
      same setup pattern as response_F: whether the zero-distance vertex
      is fixed at a specific cube-local corner, whether the search is
      restricted to non-negative subset sums, and whether the final
      stated conclusion is a single unique edge length from one
      orientation.

      Required scored fields are: primary_failure_code,
      failure_reason_evidence (keys exactly the codes in failure_reasons,
      each value at least 20 characters), primary_failure_code_evidence
      (at least 50 characters), and alternative_codes_considered (at
      least two well-formed entries, each code different from
      primary_failure_code).
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-i
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_I using the Agent tool. Do NOT classify response_I
      yourself. The sub-agent must read
      /input_artifacts/proposed_solutions/response_I.md itself, use the
      gold packet and code-boundary guide, and return one JSON assessment
      object for response_id "I" with all required fields. Focus on
      whether the response fixes the zero-distance vertex at a specific
      cube-local corner, restricts its search to non-negative subset
      sums of positive quantities, derives a single s² from one cube
      orientation, and asserts that value as the unique answer.

      Required scored fields are: primary_failure_code,
      failure_reason_evidence (keys exactly the codes in failure_reasons,
      each value at least 20 characters), primary_failure_code_evidence
      (at least 50 characters), and alternative_codes_considered (at
      least two well-formed entries, each code different from
      primary_failure_code).
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: adjudicate-primary-failure-codes
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this adjudicator as a
      sub-agent using the Agent tool after all nine response auditors
      finish. Do NOT do this adjudication in the orchestrator. The
      adjudicator must consume the gold packet, the calibration guide,
      the nine mapper outputs, and the nine candidate response files. Its
      job is narrowly to re-check the labels that dominate scoring and
      are easy to conflate: the failure_reasons set and the
      primary_failure_code per response. It must return a structured
      correction object that the reducer applies mechanically.

      The adjudicator must apply the universal trigger-pattern rules
      and primary-code selection rules already specified in
      instruction.md (the Failure-code disambiguation guidance section,
      the Primary failure code selection guidance section, and the
      Common audit anti-patterns section) uniformly to all nine
      responses. The adjudicator must not introduce new analytical
      rules beyond what instruction.md already specifies; it re-checks
      each mapper's failure_reasons set and primary_failure_code
      against the response text and instruction.md's authoritative
      trigger language.

      Return a structured JSON object: a top-level dict keyed by
      response_id (A through I), each value containing only the fields
      whose mapper value should be CORRECTED, together with the
      corrected value and a one-sentence textual evidence quotation
      from the response. The reducer applies every correction
      mechanically without re-deriving.
    depends_on:
      - adjudicate-gold-geometry
      - calibrate-failure-code-boundaries
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
    parallel_group: adjudicate

  - id: synthesize-final-audit
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this synthesizer as a
      sub-agent using the Agent tool. Do NOT perform the final synthesis
      yourself. The synthesizer consumes the gold packet, the code-
      boundary guide, the nine audit objects, and the adjudicator's
      structured correction object. It MUST NOT re-derive the gold
      answer or re-audit individual responses.

      Required output state at /logs/agent/output.json: a single JSON
      object matching the schema declared in instruction.md, with all
      required top-level keys present and JSON-valid. Where the
      adjudicator's correction object differs from a mapper's output
      for a given response field, the synthesizer's output for that
      field reflects the adjudicator's corrected value. The
      synthesizer's per_response_assessment contains nine entries in
      alphabetical order A through I, each carrying every scored field
      named in instruction.md. The synthesizer's top-level
      code_application_table contains all 12 vocabulary codes as keys
      with sorted lists of response_ids whose failure_reasons set
      contains that code (empty list for codes with no matching
      response, never null, never omitted). The synthesizer's
      top-level cross_response_observations is a single string of at
      least 300 characters describing shared defect patterns across
      the nine responses. The synthesizer's acceptable_solution_ids
      is the alphabetically-sorted list of response_ids whose
      final_answer_correct is true and whose failure_reasons set is
      empty. If any audit object is malformed or missing required
      fields, the synthesizer requests a replacement audit for that
      one response rather than fabricating fields locally. The output
      file must exist and parse as JSON before the synthesizer returns.
    depends_on:
      - adjudicate-gold-geometry
      - calibrate-failure-code-boundaries
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
      - adjudicate-primary-failure-codes
      - build-code-application-tables
      - build-response-pair-and-triple-tables
      - validate-output-consistency
    parallel_group: synthesize

  - id: build-code-application-tables
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using
      the Agent tool. Do NOT compute the aggregation yourself. The
      sub-agent receives the nine adjudicated per-response evaluations
      (from the adjudicator's correction object plus the original mapper
      outputs). Required output state: a JSON fragment for the
      code_application_table top-level field whose keys are exactly the
      12 codes of the failure-reason vocabulary; for each code, the
      value is the alphabetically-sorted list of response_ids whose
      corrected failure_reasons set contains that code. Codes with no
      matching response carry an empty list. No key is null and no key
      is omitted. The fragment is returned to the final synthesizer
      for embedding in the output JSON.
    depends_on:
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
      - adjudicate-primary-failure-codes
    parallel_group: aggregate

  - id: build-response-pair-and-triple-tables
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using
      the Agent tool. Do NOT compute these aggregations yourself. The
      sub-agent receives the nine adjudicated per-response evaluations
      and computes three top-level aggregation fields: (66 pairs of codes "code_i & code_j" with
      i<j alphabetical, integer values = count of responses with both
      codes) (36 unordered response pairs
      "X & Y" with X<Y alphabetical, sorted-list values = codes in both
      responses' failure_reasons), and (84
      unordered response triples "X & Y & Z" with X<Y<Z alphabetical,
      sorted-list values = codes in all three responses' failure_reasons).
      EVERY pair/triple key MUST appear with a JSON-valid value (0 for
      empty counts, [] for empty lists — NEVER null, NEVER omit a key).
      The sub-agent returns these three JSON fragments.
    depends_on:
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
      - adjudicate-primary-failure-codes
    parallel_group: aggregate

  - id: validate-output-consistency
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using
      the Agent tool. The sub-agent receives the nine adjudicated per-
      response evaluations and computes the three derived per-response
      fields for every response: code_application_count (= length of
      failure_reasons), primary_in_set_check (= boolean: primary in
      failure_reasons OR (primary == "NONE" and failure_reasons empty)),
      evidence_key_completeness (= number of keys in
      failure_reason_evidence that match a code in failure_reasons).
      The sub-agent also assembles the per_response_assessment list of
      nine objects in alphabetical order A through I with all required
      scored fields. Returns the per_response_assessment JSON fragment
      for the final synthesizer to embed.
    depends_on:
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
      - adjudicate-primary-failure-codes
    parallel_group: aggregate

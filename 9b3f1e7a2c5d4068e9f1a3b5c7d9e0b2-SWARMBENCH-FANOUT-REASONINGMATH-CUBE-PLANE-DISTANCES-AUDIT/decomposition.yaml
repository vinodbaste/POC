sub_tasks:
  - id: adjudicate-gold-geometry
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using the
      Agent tool. Do NOT perform this derivation yourself. The sub-agent must
      read /input_artifacts/problem.md itself and return a compact gold
      packet containing the gold final numeric answer it derives, the
      complete set of distinct s² values it finds, and a short proof sketch
      covering both the all-same-sign vertex family and any axis-flipped
      sign-pattern families. Do not inspect any candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: calibrate-failure-code-boundaries
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this as a sub-agent using the
      Agent tool. Do NOT perform this calibration yourself. The sub-agent
      must read the task instruction itself and return a concise code-
      boundary guide for applying the twelve failure-reason codes. The
      guide emphasizes that codes are evaluated as an exact set per
      response (both extra and missing codes are wrong); each code applies
      only when its triggering condition is concretely instantiated in
      that single response's text.

      The guide must include the following universal code-boundary rules
      (they apply uniformly to every candidate response):

      - non_terminating_or_no_final_answer is mutually incompatible with
        any code requiring a final numeric answer; when it applies, it
        stands alone.
      - equates_max_distance_with_edge_length_directly (a = 7) and
        assumes_max_distance_equals_space_diagonal (a = 7/√3) are mutually
        exclusive; pick the one the response's load-bearing derivation
        actually uses.
      - claims_unique_edge_length fires when the final stated conclusion
        asserts a single edge-length value (|S| = 1). It does NOT fire
        when the response presents its final answer as a sum over multiple
        candidate edge lengths.
      - assumes_zero_distance_vertex_is_axis_corner requires explicit
        pinning of the zero-distance vertex at a specific cube-local
        corner (typically (0,0,0)). It does NOT fire on body-diagonal-
        aligned or face-parallel setups that do not pin a specific corner.
      - assumes_plane_parallel_to_cube_face fires only when the primary
        geometric setup uses a face-parallel cut or an axis-aligned cube
        at constant z. It is mutually exclusive in load-bearing role with
        space-diagonal and corner-and-subset-sum setups.
      - restricts_to_nonnegative_subset_sums fires when the load-bearing
        search requires the seven non-zero distances to arise as non-
        negative subset sums of three positive quantities; it typically
        co-occurs with assumes_zero_distance_vertex_is_axis_corner and
        omits_sign_pattern_casework.
      - omits_sign_pattern_casework fires only when the response reaches
        a numeric conclusion without enumerating sign-pattern families.
        It does NOT fire when the response never produces a numeric
        conclusion, and it does NOT fire when the response considered
        sign cases at least partially (e.g., derived the all-positive
        case and then discarded it).
      - treats_one_orientation_as_proof_of_uniqueness fires when ONE
        derivation chain produces ONE numeric value that the response
        names as the unique answer. It does NOT fire when the load-
        bearing defect is direct edge=7 or a=7/√3 identification (those
        target different geometric framings); use the geometry codes
        instead.
      - accepts_internal_contradictions_in_derivation requires BOTH (a)
        an explicit contradictory equation in the text (such as 6 = 7 or
        3 = 4) AND (b) a final numeric answer extracted despite the
        contradiction. Inventing an unsupported algebraic identity is
        NOT an internal contradiction; that is uses_fabricated_invariant.
      - uses_fabricated_invariant_or_invalid_derivation fires when the
        final numeric answer rests on an invented algebraic identity not
        derivable from the problem. Standard subset-sum arithmetic from a
        corner-fixed setup is not fabrication.
      - derives_correct_partial_s2_then_discards_it requires BOTH (a) the
        value 21 (or equivalently 1² + 2² + 4²) appearing as a derived
        s² intermediate AND (b) explicit rejection of that value. When
        this code fires, omits_sign_pattern_casework does NOT also fire
        because the response did engage with at least the all-positive
        sign case.

      The guide must explain how to choose the exact failure-reason
      codes from the instruction list without naming any code's
      applicability to any specific response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_A using the Agent tool. Do NOT classify response_A
      yourself. The sub-agent must read
      /input_artifacts/proposed_solutions/response_A.md itself, use the
      gold packet and code-boundary guide, and return one JSON assessment
      object for response_id "A" with keys response_id,
      final_answer_correct, and failure_reasons. Focus on whether the
      response openly carries internal contradictions through its
      derivation, whether it fixes the zero-distance vertex at a specific
      cube-local corner, and whether the final stated conclusion is a
      single unique numeric edge length.

      Boundary disambiguation for this response: when the geometric setup
      is corner-based and the controlling defect inside it is an explicit
      contradictory equation, do NOT also include
      assumes_max_distance_equals_space_diagonal (the space-diagonal code
      requires an a√3 = 7 framing) or equates_max_distance_with_edge_length_directly
      (which requires direct a = 7). Do NOT include
      treats_one_orientation_as_proof_of_uniqueness when the defect is
      contradictory equations inside one derivation chain — that code
      targets responses solving one clean orientation and asserting it
      unique, not contradiction-driven derivations. Do NOT include
      restricts_to_nonnegative_subset_sums unless the response builds
      the seven distances from a positive-subset-sum search of {p, q, r};
      a corner placement alone is not sufficient.
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-b
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_B using the Agent tool. Do NOT classify response_B
      yourself. The sub-agent must read
      /input_artifacts/proposed_solutions/response_B.md itself, use the
      gold packet and code-boundary guide, and return one JSON assessment
      object for response_id "B". Focus on the primary geometric setup
      (whether the cutting plane is assumed parallel to a cube face or
      the cube is taken axis-aligned with the plane at constant z),
      whether the response directly identifies the maximum vertex-to-
      plane distance with the cube edge length without projecting through
      a plane normal, and whether the final conclusion claims uniqueness.

      Boundary disambiguation for this response: when the load-bearing
      geometric setup is plane-parallel-to-face (or z=k axis-aligned),
      do NOT include assumes_zero_distance_vertex_is_axis_corner — that
      code requires explicit pinning of the zero-distance vertex at a
      specific corner like (0,0,0), which is distinct from the face-
      parallel framing. Do NOT include
      treats_one_orientation_as_proof_of_uniqueness when the controlling
      defect is the direct edge = 7 identification — the orientation
      code targets responses solving a non-face-parallel single
      orientation and asserting uniqueness from it; for face-parallel
      setups, the geometric defect is captured by
      assumes_plane_parallel_to_cube_face and
      equates_max_distance_with_edge_length_directly together. Do NOT
      include assumes_max_distance_equals_space_diagonal (mutually
      exclusive with equates_max_distance_with_edge_length_directly) or
      restricts_to_nonnegative_subset_sums (no subset-sum search is
      load-bearing here).
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-c
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_C using the Agent tool. Do NOT classify response_C
      yourself. The sub-agent must read
      /input_artifacts/proposed_solutions/response_C.md itself, use the
      gold packet and code-boundary guide, and return one JSON assessment
      object for response_id "C". Focus on whether the response equates
      the maximum vertex-to-plane distance with the cube's space diagonal
      (a√3 = 7 or equivalent), whether it works from a single cube
      orientation, and whether the final stated conclusion is a single
      unique edge length.

      Boundary disambiguation for this response: when the load-bearing
      derivation equates the maximum distance with the space diagonal
      (a√3 = 7), do NOT also include
      equates_max_distance_with_edge_length_directly (these two codes
      are mutually exclusive). Do NOT include
      assumes_zero_distance_vertex_is_axis_corner when the response
      operates from a body-diagonal or space-diagonal framing rather
      than a corner-pinned coordinate system. Do NOT include
      assumes_plane_parallel_to_cube_face (the space-diagonal framing
      is incompatible with face-parallel) or
      restricts_to_nonnegative_subset_sums (no subset-sum search is
      load-bearing). Do NOT include accepts_internal_contradictions or
      uses_fabricated_invariant when the response runs a clean
      a√3 = 7 derivation without contradictory equations or invented
      identities.
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-d
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_D using the Agent tool. Do NOT classify response_D
      yourself. The sub-agent must read
      /input_artifacts/proposed_solutions/response_D.md itself, use the
      gold packet and code-boundary guide, and return one JSON assessment
      object for response_id "D". Focus on whether the response equates
      the maximum vertex-to-plane distance with the cube's space diagonal
      and derives a single numeric answer from one orientation, without
      enumerating sign-pattern families.

      Boundary disambiguation for this response: when the load-bearing
      derivation uses a√3 = 7, do NOT also include
      equates_max_distance_with_edge_length_directly (mutually exclusive
      with the space-diagonal code). Do NOT include
      assumes_zero_distance_vertex_is_axis_corner unless the response
      explicitly pins the zero-distance vertex at a cube-local corner;
      a space-diagonal framing typically does not. Do NOT include
      assumes_plane_parallel_to_cube_face (incompatible with space-
      diagonal load-bearing reasoning). Do NOT include
      restricts_to_nonnegative_subset_sums or
      uses_fabricated_invariant_or_invalid_derivation when the
      derivation is a clean a√3 = 7 chain without subset-sum search or
      invented identities.
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-e
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_E using the Agent tool. Do NOT classify response_E
      yourself. The sub-agent must read
      /input_artifacts/proposed_solutions/response_E.md itself, use the
      gold packet and code-boundary guide, and return one JSON assessment
      object for response_id "E". Focus on whether the response produces
      an identifiable final numeric answer at all (e.g., a boxed value or
      a "final answer is ..." sentence), or instead loops, truncates, or
      never commits to a numeric conclusion.

      Boundary disambiguation for this response:
      non_terminating_or_no_final_answer is mutually incompatible with
      any code that requires extracting a final numeric value. When the
      response truncates, loops, or never commits to a number, do NOT
      include claims_unique_edge_length,
      equates_max_distance_with_edge_length_directly,
      assumes_max_distance_equals_space_diagonal,
      treats_one_orientation_as_proof_of_uniqueness,
      omits_sign_pattern_casework, accepts_internal_contradictions,
      uses_fabricated_invariant, restricts_to_nonnegative_subset_sums,
      assumes_zero_distance_vertex_is_axis_corner,
      assumes_plane_parallel_to_cube_face, or
      derives_correct_partial_s2_then_discards_it. When
      non_terminating_or_no_final_answer fires, it stands alone in the
      failure_reasons set.
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-f
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_F using the Agent tool. Do NOT classify response_F
      yourself. The sub-agent must read
      /input_artifacts/proposed_solutions/response_F.md itself, use the
      gold packet and code-boundary guide, and return one JSON assessment
      object for response_id "F". Focus on whether the response fixes the
      zero-distance vertex at a specific cube-local corner, restricts its
      search to non-negative subset sums of positive quantities (rather
      than considering signed projections), and concludes a single unique
      edge length from one orientation.

      Boundary disambiguation for this response: when the load-bearing
      setup is corner-fixed with non-negative subset sums of {p, q, r},
      do NOT include assumes_max_distance_equals_space_diagonal (the
      response does not use a√3 = 7) or
      assumes_plane_parallel_to_cube_face (the response does not use a
      face-parallel cut) — these three geometric framings are mutually
      exclusive as load-bearing setups. Do NOT include
      equates_max_distance_with_edge_length_directly (the response does
      not directly equate the max distance with the edge). Do NOT
      include uses_fabricated_invariant_or_invalid_derivation when the
      response uses standard subset-sum arithmetic; that code requires
      an invented identity. Do NOT include
      accepts_internal_contradictions unless an explicit contradictory
      equation appears in the text.
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-g
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_G using the Agent tool. Do NOT classify response_G
      yourself. The sub-agent must read
      /input_artifacts/proposed_solutions/response_G.md itself, use the
      gold packet and code-boundary guide, and return one JSON assessment
      object for response_id "G". Focus on whether the response invents
      an algebraic identity not derivable from the problem, whether it
      derives the all-positive-case s² value at some point and then
      explicitly discards or rejects it, and whether the response's final
      conclusion is a single unique edge length or a fabricated sum over
      candidates.

      Boundary disambiguation for this response: do NOT include
      accepts_internal_contradictions_in_derivation when the defect is
      an invented algebraic identity (such as 3a²(1 + T²) = 140) —
      fabricated invariants are uses_fabricated_invariant, not internal
      contradictions; the latter requires an explicit 6 = 7 type
      contradictory equation. Do NOT include omits_sign_pattern_casework
      when the response considered the all-positive sign case and
      explicitly discarded its s² result — that explicit derive-then-
      reject pattern is captured by
      derives_correct_partial_s2_then_discards_it instead. Do NOT
      include claims_unique_edge_length when the response presents its
      final value as a fabricated sum over multiple candidates rather
      than asserting one unique edge length. Do NOT include
      treats_one_orientation_as_proof_of_uniqueness when the response
      worked through multiple sign branches even if it discarded one.
      Do NOT include assumes_max_distance_equals_space_diagonal or
      assumes_plane_parallel_to_cube_face or
      equates_max_distance_with_edge_length_directly unless those
      specific load-bearing framings appear in the response's
      derivation chain.
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-h
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_H using the Agent tool. Do NOT classify response_H
      yourself. The sub-agent must read
      /input_artifacts/proposed_solutions/response_H.md itself, use the
      gold packet and code-boundary guide, and return one JSON assessment
      object for response_id "H". Focus on the same setup pattern as
      response_F: whether the zero-distance vertex is fixed at a specific
      cube-local corner, whether the search is restricted to non-negative
      subset sums, and whether the final stated conclusion is a single
      unique edge length from one orientation.

      Boundary disambiguation for this response: when the load-bearing
      setup is corner-fixed with non-negative subset sums, do NOT
      include assumes_max_distance_equals_space_diagonal or
      assumes_plane_parallel_to_cube_face or
      equates_max_distance_with_edge_length_directly — these target
      mutually exclusive alternative geometric framings. Do NOT include
      uses_fabricated_invariant_or_invalid_derivation when the
      derivation uses standard subset-sum arithmetic without an
      invented algebraic identity. Do NOT include
      accepts_internal_contradictions unless an explicit contradictory
      equation appears in the text. Do NOT include
      derives_correct_partial_s2_then_discards_it unless the response
      explicitly derives 21 (or 1² + 2² + 4²) and explicitly rejects
      it.
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: audit-response-i
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn a separate sub-agent for
      response_I using the Agent tool. Do NOT classify response_I
      yourself. The sub-agent must read
      /input_artifacts/proposed_solutions/response_I.md itself, use the
      gold packet and code-boundary guide, and return one JSON assessment
      object for response_id "I". Focus on whether the response fixes the
      zero-distance vertex at a specific cube-local corner, restricts its
      search to non-negative subset sums of positive quantities, derives
      a single s² from one cube orientation, and asserts that value as
      the unique answer.

      Boundary disambiguation for this response: when the load-bearing
      setup is corner-fixed with non-negative subset sums, do NOT
      include assumes_max_distance_equals_space_diagonal,
      assumes_plane_parallel_to_cube_face, or
      equates_max_distance_with_edge_length_directly — these target
      mutually exclusive alternative geometric framings. Do NOT include
      uses_fabricated_invariant_or_invalid_derivation when the
      derivation uses standard subset-sum arithmetic. Do NOT include
      accepts_internal_contradictions unless an explicit contradictory
      equation appears in the text. Do NOT include
      derives_correct_partial_s2_then_discards_it unless the response
      explicitly derives 21 and then explicitly rejects it.
    depends_on: [adjudicate-gold-geometry, calibrate-failure-code-boundaries]
    parallel_group: audit

  - id: synthesize-final-audit
    description: >
      ORCHESTRATOR INSTRUCTION: You MUST spawn this synthesizer as a
      sub-agent using the Agent tool. Do NOT perform the final synthesis
      yourself. The synthesizer consumes the gold packet, the code-
      boundary guide, and the nine audit objects. It MUST NOT re-derive
      the gold answer or re-audit individual responses. If any audit
      object is malformed, request a replacement sub-agent for that one
      response. The synthesizer writes exactly one JSON object to
      /logs/agent/output.json with the four top-level keys defined in
      instruction.md (gold_final_answer, gold_edge_length_squared_set,
      acceptable_solution_ids, per_response_assessment with nine objects
      ordered A through I) and validates that the file exists and parses
      before returning.
    depends_on:
      - adjudicate-gold-geometry
      - calibrate-failure-code-boundaries
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
    parallel_group: synthesize

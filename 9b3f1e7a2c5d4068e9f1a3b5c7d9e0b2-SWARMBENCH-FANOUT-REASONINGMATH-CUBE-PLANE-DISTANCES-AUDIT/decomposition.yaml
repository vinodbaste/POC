  - id: aggregate-cross-response-frequency
    description: >
      After all nine per-response audit sub-tasks complete, collect their reported
      failure_reasons lists and compute the cross-response synthesis field
      failure_reason_frequency: a dictionary whose keys are the 12 allowed failure-reason
      codes (every code must be present as a key) and whose values are the integer
      counts of how many of the nine per-response failure_reasons lists contain that
      code. Do not re-audit the responses; only tally what the per-response audits
      reported. Return the failure_reason_frequency object together with a short
      verification note confirming that the per-code counts are consistent with the nine
      audit outputs.
    depends_on:
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
    parallel_group: reduce

  - id: synthesize-final-output
    description: >
      Reconcile the two independent gold derivations from adjudicate-gold-derivation and
      gold-verification-cross-check. If both agree on a top-level value, use it. If they
      disagree on any of the six gold values, return the value that is mathematically
      consistent with the constraint (verify by checking the value against the problem
      yourself before deciding). Use each per-response audit's reported
      extracted_final_answer, final_answer_correct, and failure_reasons set verbatim —
      do not add codes a per-response audit did not select and do not delete codes a
      per-response audit did select. Use the aggregate-cross-response-frequency output
      as the failure_reason_frequency field. Compute acceptable_solution_ids as the
      uppercase, alphabetically-sorted list of response_ids whose final_answer_correct
      is true AND failure_reasons is empty. Write the result to /logs/agent/output.json.
      Top-level keys exactly: gold_final_answer, gold_edge_length_squared_set,
      gold_case_a_s_squared, gold_case_b_s_squared_values, gold_axis_lengths_triples,
      total_distinct_orientations, acceptable_solution_ids, per_response_assessment,
      failure_reason_frequency. per_response_assessment must contain exactly nine
      objects, ordered alphabetically A through I.
    depends_on:
      - adjudicate-gold-derivation
      - gold-verification-cross-check
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
      - aggregate-cross-response-frequency
    parallel_group: synthesize

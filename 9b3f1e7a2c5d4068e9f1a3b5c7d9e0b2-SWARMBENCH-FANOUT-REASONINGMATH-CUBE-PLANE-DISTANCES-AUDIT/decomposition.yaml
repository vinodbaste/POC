sub_tasks:
  - id: derive-canonical-gold-geometry
    description: >
      Read /input_artifacts/problem.md only. Independently determine the gold
      final numeric answer (the sum of squares of all elements of S) and the
      sorted set of distinct s^2 values, enumerating every sign-pattern family
      (the all-same-sign vertex family AND each of the three one-axis-flipped
      sign-pattern families). For each family, solve for plane coefficients
      (a,b,c,d) such that the multiset of vertex distances equals
      {0,1,2,3,4,5,6,7}, then compute s^2 = (a^2+b^2+c^2). Return the derived
      gold_final_answer string (the integer sum of all distinct s^2 values),
      the sorted gold_edge_length_squared_set list, and a short proof sketch
      covering each family. Do not inspect any candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_A.md. Audit only Response A.
      Decide whether its final stated numeric answer matches the independently
      computed gold answer. If it is wrong, return the exact applicable
      failure_reasons chosen from:
        claims_unique_edge_length, restricts_to_nonnegative_subset_sums,
        assumes_max_distance_equals_space_diagonal, assumes_plane_parallel_to_cube_face,
        equates_max_distance_with_edge_length_directly,
        uses_fabricated_invariant_or_invalid_derivation,
        accepts_internal_contradictions_in_derivation,
        assumes_zero_distance_vertex_is_axis_corner, omits_sign_pattern_casework,
        treats_one_orientation_as_proof_of_uniqueness,
        derives_correct_partial_s2_then_discards_it,
        non_terminating_or_no_final_answer.
      If the response derives a contradiction such as "6 = 7" inside its
      derivation and still extracts a final numeric answer, include
      accepts_internal_contradictions_in_derivation. If the response invents an
      algebraic identity unsupported by the problem and uses it as the load-
      bearing step, include uses_fabricated_invariant_or_invalid_derivation.
      Apply non_terminating_or_no_final_answer only when no committed final
      numeric answer exists. Do not infer correctness from other proposed
      responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-b
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_B.md. Audit only Response B.
      Decide whether its final stated numeric answer matches the independently
      computed gold answer. If it is wrong, return the exact applicable
      failure_reasons chosen from the same twelve-code vocabulary listed above
      for Response A.
      If the response's primary geometric setup uses a face-parallel or
      axis-aligned cube cut by a plane z = k, include
      assumes_plane_parallel_to_cube_face. If the response identifies the
      maximum vertex-to-plane distance directly with the cube edge length
      (a = 7), include equates_max_distance_with_edge_length_directly. Do not
      infer correctness from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-c
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_C.md. Audit only Response C.
      Decide whether its final stated numeric answer matches the independently
      computed gold answer. If it is wrong, return the exact applicable
      failure_reasons chosen from the same twelve-code vocabulary.
      If the response identifies the maximum vertex-to-plane distance with the
      cube's space diagonal a*sqrt(3) and derives a = 7/sqrt(3), include
      assumes_max_distance_equals_space_diagonal. If the response solves one
      cube orientation and asserts the resulting s^2 as the unique answer
      without ruling out other orientations, include
      treats_one_orientation_as_proof_of_uniqueness. Do not infer correctness
      from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-d
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_D.md. Audit only Response D.
      Decide whether its final stated numeric answer matches the independently
      computed gold answer. If it is wrong, return the exact applicable
      failure_reasons chosen from the same twelve-code vocabulary.
      If the load-bearing geometric step identifies the maximum vertex-to-plane
      distance with the cube's space diagonal, include
      assumes_max_distance_equals_space_diagonal. If the response asserts the
      single derived s^2 as the only answer, include
      treats_one_orientation_as_proof_of_uniqueness and
      claims_unique_edge_length when both triggers fire. Do not infer
      correctness from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-e
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_E.md. Audit only Response E.
      Decide whether the response produces an identifiable final numeric
      answer at all. If the response loops on a repeated phrase, truncates
      mid-derivation, or otherwise never commits to a final numeric value,
      classify as non_terminating_or_no_final_answer; this code is the SOLE
      applicable code when it fires (other codes that require extracting a
      final numeric answer do not co-apply). Otherwise return the exact
      applicable failure_reasons chosen from the same twelve-code vocabulary.
      Do not infer correctness from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-f
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_F.md. Audit only Response F.
      Decide whether its final stated numeric answer matches the independently
      computed gold answer. If it is wrong, return the exact applicable
      failure_reasons chosen from the same twelve-code vocabulary.
      If the response fixes the zero-distance vertex at (0,0,0), include
      assumes_zero_distance_vertex_is_axis_corner. If the response restricts
      the search to non-negative subset sums of three positive quantities and
      drops absolute-value signs, include restricts_to_nonnegative_subset_sums.
      If the response derives one s^2 from one orientation and asserts it is
      the only answer, include treats_one_orientation_as_proof_of_uniqueness
      and claims_unique_edge_length. Do not infer correctness from other
      proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-g
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_G.md. Audit only Response G.
      Decide whether its final stated numeric answer matches the independently
      computed gold answer. If it is wrong, return the exact applicable
      failure_reasons chosen from the same twelve-code vocabulary.
      If the response derives s^2 = 21 as a partial intermediate and then
      explicitly rejects it in favor of a different final numeric answer,
      include derives_correct_partial_s2_then_discards_it. If the response's
      final numeric answer rests on an invented algebraic identity such as a
      fabricated quadratic, include
      uses_fabricated_invariant_or_invalid_derivation. Do not infer correctness
      from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-h
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_H.md. Audit only Response H.
      Decide whether its final stated numeric answer matches the independently
      computed gold answer. If it is wrong, return the exact applicable
      failure_reasons chosen from the same twelve-code vocabulary.
      Focus on the same setup pattern as response_F: whether the zero-distance
      vertex is fixed at a specific cube-local corner (
      assumes_zero_distance_vertex_is_axis_corner), whether the search is
      restricted to non-negative subset sums (
      restricts_to_nonnegative_subset_sums), and whether the final stated
      conclusion is a single unique edge length from one orientation (
      treats_one_orientation_as_proof_of_uniqueness and
      claims_unique_edge_length). Do not infer correctness from other proposed
      responses.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-i
    description: >
      Read /input_artifacts/problem.md and
      /input_artifacts/proposed_solutions/response_I.md. Audit only Response I.
      Decide whether its final stated numeric answer matches the independently
      computed gold answer. If it is wrong, return the exact applicable
      failure_reasons chosen from the same twelve-code vocabulary.
      Focus on whether the response restricts its search to positive integer
      triples (restricts_to_nonnegative_subset_sums), fixes one vertex at the
      origin (assumes_zero_distance_vertex_is_axis_corner), derives a single
      s^2 from one cube orientation
      (treats_one_orientation_as_proof_of_uniqueness), and asserts that value
      as the only edge length (claims_unique_edge_length). Do not infer
      correctness from other proposed responses.
    depends_on: []
    parallel_group: fan-out

  - id: synthesize-final-audit
    description: >
      Read the canonical gold geometry packet produced by
      derive-canonical-gold-geometry and the nine per-response audit objects
      produced by audit-response-a through audit-response-i. Compose one JSON
      object with top-level keys gold_final_answer, gold_edge_length_squared_set,
      acceptable_solution_ids, and per_response_assessment (nine objects
      ordered A through I), as specified by instruction.md. Set
      final_answer_correct on each per-response object based on whether its
      claimed numeric answer equals the gold answer exactly. Compute
      acceptable_solution_ids as the alphabetically-sorted list of response_ids
      whose final_answer_correct is true AND whose failure_reasons list is
      empty. Do not re-derive the gold answer or re-audit individual responses
      in this step. If any audit object is malformed, request a replacement
      sub-agent for that one response. Write the JSON to /logs/agent/output.json
      and validate that the file exists and parses before returning.
    depends_on:
      - derive-canonical-gold-geometry
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
    parallel_group: synthesize

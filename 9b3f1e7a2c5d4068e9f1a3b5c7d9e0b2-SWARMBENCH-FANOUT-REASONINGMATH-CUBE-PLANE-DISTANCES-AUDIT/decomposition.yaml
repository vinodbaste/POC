sub_tasks:
  - id: adjudicate-gold-answer
    description: >
      Read /input_artifacts/problem.md and solve the olympiad geometry problem from first
      principles. Compute the gold final numeric answer (the sum of squares of all possible
      cube edge lengths) and the underlying set of distinct squared edge-length values. Show
      the reasoning chain in the returned write-up, including any case analysis you carry
      out, so the synthesizer can independently corroborate the gold values. Do not inspect
      any proposed response. Return both the gold answer, the set of distinct s² values, and
      a concise mathematical justification (about 200-400 words).
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      Read /workspace/instruction.md and /input_artifacts/problem.md. First, independently
      solve the geometry problem yourself and record your own gold numeric answer and your
      own set of distinct s² values before touching the candidate response. Then read
      /input_artifacts/proposed_solutions/response_A.md, extract the response's claimed final
      numeric answer, and compare it against your independent derivation to set
      final_answer_correct. Audit the response's mathematical reasoning chain end-to-end:
      identify the load-bearing algebraic identities it uses, the geometric setup it assumes,
      and any logical step that does not survive your independent derivation. Apply the full
      6-code controlled vocabulary defined in instruction.md. Apply a code only when its
      trigger phrase (or near-verbatim paraphrase) is concretely present in this single
      response's text. Most candidate responses have 1 or 2 applicable codes. Return a brief
      written audit (150-300 words) explaining your math derivation, the response's claimed
      answer, and the concrete trigger phrase(s) that justify each selected code, followed
      by a JSON object {response_id, final_answer_correct, failure_reasons}. Use
      failure_reasons=[] only when your independent answer and the response's answer agree
      AND no trigger phrase fires.
    depends_on: []
    parallel_group: fan-out


sub_tasks:
  - id: adjudicate-gold-derivation
    description: >
      Read /input_artifacts/problem.md and solve the olympiad geometry problem from first
      principles. Independently determine (a) the gold final numeric answer (the sum of
      squares of all elements of S), (b) the full set of distinct squared edge-length
      values s² consistent with the constraint, (c) the s² value from the "all-positive"
      orientation, (d) the sorted list of s² values from the "sign-flipped" orientations,
      (e) the corresponding sorted (p, q, r) axis-length triples for every valid
      orientation, and (f) the total number of distinct valid orientations. Return all
      six values together with a concise mathematical justification (300-500 words). Do
      not inspect any candidate response.
    depends_on: []
    parallel_group: fan-out

  - id: gold-verification-cross-check
    description: >
      Independently re-solve the geometry problem in /input_artifacts/problem.md from
      first principles using a different methodology than adjudicate-gold-derivation
      (for example, exhaustive enumeration of vertex sign patterns rather than direct
      algebraic invariants, or vice versa). Report your independently computed gold
      final numeric answer, full set of distinct s² values, all-positive-orientation s²,
      sign-flipped-orientation s² list, axis-length triples, and total orientation
      count, with a concise justification (200-400 words). This serves as a consensus
      check for the synthesizer.
    depends_on: []
    parallel_group: fan-out

  - id: audit-response-a
    description: >
      Read /workspace/instruction.md and /input_artifacts/problem.md. First, solve the
      geometry problem yourself from first principles and record your gold values before
      touching the candidate response. Then read
      /input_artifacts/proposed_solutions/response_A.md, extract the response's claimed
      final numeric answer, and audit its mathematical reasoning chain. Apply the full
      12-code controlled vocabulary defined in instruction.md. A code applies only when
      its triggering condition is concretely instantiated in this single response's
      text. Most responses have between 1 and 5 applicable codes. Return a brief written
      audit (150-300 words) explaining your independent derivation, the response's
      claimed answer, and the concrete evidence justifying each selected code, followed
      by a JSON object {response_id, extracted_final_answer, final_answer_correct,
      failure_reasons} for response A. Do not infer from other responses.
    depends_on: []
    parallel_group: fan-out


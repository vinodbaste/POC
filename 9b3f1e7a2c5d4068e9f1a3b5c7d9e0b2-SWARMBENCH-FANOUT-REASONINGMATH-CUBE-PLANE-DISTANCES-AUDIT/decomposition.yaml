sub_tasks:
  # =====================================================================
  # WAVE 1 - Five independent gold-derivation and validation sub-agents.
  # Each operates in isolated context, uses a DIFFERENT perspective on the
  # geometry, and returns a structured JSON intermediate output so the
  # reducer can compare results and verify consensus. None of these
  # sub-agents read any candidate response file.
  # =====================================================================

  - id: derive-method-signpattern
    description: >
      Read ONLY /input_artifacts/problem.md. Solve the cube/plane geometry
      problem from first principles using a sign-pattern perspective: place
      one cube vertex on the plane, write each of the seven remaining
      signed vertex-to-plane distances as a signed combination of three
      independent projection magnitudes (one per cube axis), and enumerate
      the essentially distinct sign-pattern families that can produce the
      multiset of absolute distances {1, 2, 3, 4, 5, 6, 7}. For every
      feasible family, solve for the squared edge length s^2 consistent
      with the constraints and confirm that all seven distances are
      accounted for. Do NOT consult any file under
      /input_artifacts/proposed_solutions/.

      Return, as the final block of your response, a fenced ```json``` block
      with EXACTLY these keys:
      {
        "method": "sign-pattern",
        "derived_gold_final_answer": "<your derived sum-of-squares of S, as a string>",
        "derived_s2_set": [<sorted list of distinct s^2 integers you derived>],
        "sign_families_examined": [
          {"family_label": "<short name>", "feasible": <bool>, "s2_value_if_feasible": <int or null>, "note": "<one line>"}
        ],
        "confidence": "high" | "medium" | "low",
        "derivation_steps": "<200-400 word self-contained derivation>"
      }
      You are working in isolation; do not claim agreement with any other
      method.
    depends_on: []
    parallel_group: derive

  - id: derive-method-bodydiagonal
    description: >
      Read ONLY /input_artifacts/problem.md. Solve the cube/plane geometry
      problem from first principles using a body-diagonal-aligned setup:
      orient the cube so that its body diagonal points along a chosen axis
      and write each vertex's plane distance as a linear combination of
      three projection components onto the plane normal. From the
      constraint that the absolute vertex distances equal {0, 1, 2, 3, 4,
      5, 6, 7}, derive a system of equations in the three projection
      magnitudes (call them p, q, r) and analyze which sign regimes for
      (p, q, r) are feasible. Solve every feasible regime for the squared
      edge length s^2. Do NOT consult any file under
      /input_artifacts/proposed_solutions/.

      Return a fenced ```json``` block with EXACTLY these keys:
      {
        "method": "body-diagonal",
        "derived_gold_final_answer": "<string>",
        "derived_s2_set": [<sorted ints>],
        "regimes_analyzed": [
          {"regime_label": "...", "feasible": <bool>, "s2_value_if_feasible": <int or null>}
        ],
        "confidence": "high" | "medium" | "low",
        "derivation_steps": "<200-400 word derivation>"
      }
    depends_on: []
    parallel_group: derive

  - id: derive-method-coordinate-search
    description: >
      Read ONLY /input_artifacts/problem.md. Solve the geometry problem by
      direct coordinate parametrization: place a cube of unknown edge
      length a at a chosen reference position, parametrize the cutting
      plane by a unit normal direction and an offset, and search
      algebraically over all distinct assignments of the eight vertex
      distances to the multiset {0, 1, 2, 3, 4, 5, 6, 7}. For every
      assignment that yields a consistent normal direction, offset, and
      edge length, record the resulting s^2 value. Reject assignments that
      produce no real solution or a degenerate configuration. Do NOT
      consult any file under /input_artifacts/proposed_solutions/.

      Return a fenced ```json``` block with EXACTLY these keys:
      {
        "method": "coordinate-search",
        "derived_gold_final_answer": "<string>",
        "derived_s2_set": [<sorted ints>],
        "valid_assignments_count": <int>,
        "rejected_assignments_count": <int>,
        "representative_valid_assignments": [
          {"vertex_distance_assignment_sketch": "<one-line summary>", "edge_length_squared": <int>}
        ],
        "confidence": "high" | "medium" | "low",
        "derivation_steps": "<200-400 word derivation>"
      }
    depends_on: []
    parallel_group: derive

  - id: validate-edgecase-witness
    description: >
      Read ONLY /input_artifacts/problem.md. Independently propose every
      candidate squared edge length s^2 you can construct from first
      principles for this configuration (consider every essentially
      distinct way the plane can sit relative to the cube, including
      configurations where the plane cuts through the cube's interior).
      For each candidate s^2 you propose, build an EXPLICIT witness: a
      concrete triple of projection magnitudes (or equivalent geometric
      data) and verify that the resulting eight vertex-to-plane absolute
      distances are exactly {0, 1, 2, 3, 4, 5, 6, 7} - no duplicates, no
      omissions. Also list candidates that look plausible but fail the
      eight-distance check, with the specific reason for rejection. Do
      NOT consult any file under /input_artifacts/proposed_solutions/.

      Return a fenced ```json``` block with EXACTLY these keys:
      {
        "method": "edge-case-witness",
        "validated_candidates": [
          {"s2_value": <int>, "witness_data": "<concise description>", "eight_distances_match": <bool>}
        ],
        "rejected_candidates": [
          {"s2_value": <int>, "rejection_reason": "<one line>"}
        ],
        "validated_s2_set": [<sorted ints from validated_candidates>],
        "confidence": "high" | "medium" | "low"
      }
    depends_on: []
    parallel_group: derive

  - id: validate-numerical-roundtrip
    description: >
      Read ONLY /input_artifacts/problem.md. Independently propose
      candidate cube edge lengths a, and for each candidate set up a
      concrete numerical placement of the cube and the plane, then compute
      all eight vertex-to-plane absolute distances. Report whether the
      computed distance multiset equals {0, 1, 2, 3, 4, 5, 6, 7} exactly
      (each value appearing once). A candidate passes the round-trip if
      and only if there exists at least one concrete placement whose
      distance multiset matches exactly. Do NOT consult any file under
      /input_artifacts/proposed_solutions/.

      Return a fenced ```json``` block with EXACTLY these keys:
      {
        "method": "numerical-roundtrip",
        "candidates_tested": [
          {"s2_value": <int>, "passes_roundtrip": <bool>, "computed_distance_multiset_sketch": "<one line>"}
        ],
        "numerically_validated_s2_set": [<sorted ints>],
        "confidence": "high" | "medium" | "low",
        "notes": "<short summary>"
      }
    depends_on: []
    parallel_group: derive

  # =====================================================================
  # WAVE 2 - Nine independent per-response audits. Each consumes the five
  # Wave 1 structured outputs as its consensus gold context (the
  # orchestrator forwards depends_on outputs). Audits do NOT re-derive the
  # geometry from scratch - they apply the 12-code controlled vocabulary
  # to ONE response with that context already established. Each audit
  # returns a STRUCTURED intermediate output so the reducer can verify
  # internal consistency (every asserted code must have a cited trigger).
  # =====================================================================

  - id: audit-response-a
    description: >
      Read /workspace/instruction.md (for the 12-code controlled
      vocabulary and its triggering conditions),
      /input_artifacts/problem.md, and
      /input_artifacts/proposed_solutions/response_A.md. The five Wave 1
      derive-* and validate-* sub-agents have produced structured JSON
      outputs that constitute the consensus gold answer and consensus
      s^2 set; treat those as the reference and only re-derive if you
      cannot recover them from the provided upstream context.

      For response A specifically: extract its claimed final numeric
      answer (or null if it never produces one), the s^2 value(s) it
      implicitly or explicitly claims, the geometric setup it uses
      (axis-aligned-cube-at-origin, body-diagonal-aligned, subset-sum
      search over positive integers, plane-parallel-to-face, or other),
      and the load-bearing steps in its reasoning chain.

      For each of the 12 failure-reason codes defined in instruction.md,
      decide whether response A's TEXT concretely instantiates that
      code's triggering condition. Quote the exact trigger phrase from
      the response that satisfies each code you select. Apply a code
      ONLY when its trigger is concretely present in response A's own
      text. Use an empty failure_reasons list if and only if A's final
      answer equals the consensus gold AND no trigger fires.

      Return a fenced ```json``` block with EXACTLY these keys:
      {
        "response_id": "A",
        "extracted_final_numeric_answer": "<string>" | null,
        "extracted_s2_claim": [<ints>] | <int> | null,
        "geometric_setup_used": "<short label>",
        "load_bearing_steps": [
          {"step_summary": "<one line>", "supports_which_code_if_any": "<code or null>"}
        ],
        "code_triggers": [
          {"code": "<code name>", "trigger_quote": "<verbatim from response_A.md>", "location_hint": "<line, paragraph, or section>"}
        ],
        "final_answer_correct": <bool>,
        "failure_reasons": ["<code>", ...]
      }
      Audit only response A. Do NOT infer codes from other responses.
    depends_on:
      - derive-method-signpattern
      - derive-method-bodydiagonal
      - derive-method-coordinate-search
      - validate-edgecase-witness
      - validate-numerical-roundtrip
    parallel_group: audit

  - id: audit-response-b
    description: >
      Read /workspace/instruction.md,
      /input_artifacts/problem.md, and
      /input_artifacts/proposed_solutions/response_B.md. Use the Wave 1
      consensus gold from the upstream sub-agent outputs; only re-derive
      if upstream context is unavailable.

      For response B specifically: extract its claimed final numeric
      answer, its claimed s^2 value(s), and its geometric setup. Identify
      its load-bearing reasoning steps. Apply the 12-code vocabulary
      from instruction.md, citing the exact trigger phrase for each code
      you select. Use an empty failure_reasons list iff B's final answer
      equals the consensus gold AND no trigger fires.

      Return a fenced ```json``` block with EXACTLY these keys:
      response_id, extracted_final_numeric_answer, extracted_s2_claim,
      geometric_setup_used, load_bearing_steps[], code_triggers[]
      (with code, trigger_quote, location_hint), final_answer_correct,
      failure_reasons.
      Audit only response B.
    depends_on:
      - derive-method-signpattern
      - derive-method-bodydiagonal
      - derive-method-coordinate-search
      - validate-edgecase-witness
      - validate-numerical-roundtrip
    parallel_group: audit


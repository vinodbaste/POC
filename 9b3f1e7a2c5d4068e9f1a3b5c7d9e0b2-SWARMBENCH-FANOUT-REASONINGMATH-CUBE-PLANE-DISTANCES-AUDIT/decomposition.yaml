  # =====================================================================
  # WAVE 3 - Reconciliation reducer with a real verification job.
  # NOT a concatenation step. Must verify gold consensus, audit-internal
  # consistency, and cross-response sanity before composing the final
  # JSON. The final JSON is composed VERBATIM from per-response audits'
  # final_answer_correct and failure_reasons (no addition, no deletion).
  # =====================================================================

  - id: reconcile-and-synthesize
    description: >
      You are the reconciliation reducer. You receive structured JSON
      intermediate outputs from fourteen upstream sub-agents: three
      independent gold derivations (sign-pattern, body-diagonal,
      coordinate-search), two validators (edge-case-witness,
      numerical-roundtrip), and nine per-response audits (A through I).
      Your job has four steps and they MUST be done in order. You are
      NOT a concatenation step.

      STEP 1 - Verify gold consensus.
      Compare the derived_s2_set and derived_gold_final_answer fields
      across the three derive-method-* sub-agents. Compare the
      validated_s2_set from validate-edgecase-witness and the
      numerically_validated_s2_set from validate-numerical-roundtrip.
      All five should agree on the same set of distinct s^2 integers
      and the same sum-of-squares total. If any sub-agent disagrees:
      identify WHICH s^2 value(s) the disagreement is about, decide
      which sub-agents have the stronger evidence (witnesses with
      explicit eight-distance accounting beat unsupported algebraic
      claims), and explicitly resolve the disagreement before
      continuing. Record the resolution in your reasoning notes.

      STEP 2 - Verify per-response audit internal consistency.
      For each per-response audit JSON, check that (i) every code
      listed in failure_reasons also appears in code_triggers (no
      orphan codes asserted without a cited trigger), (ii) every code
      in code_triggers also appears in failure_reasons (no trigger
      collected and then dropped), and (iii) final_answer_correct is
      true exactly when extracted_final_numeric_answer equals the
      consensus gold AND failure_reasons is empty. If any audit fails
      these consistency checks, fix the audit's failure_reasons set by
      using its own code_triggers as the authoritative evidence list -
      but only within that one audit, do not move codes between
      responses.

      STEP 3 - Cross-response sanity scan.
      For each of the 12 controlled codes, list which responses
      asserted it. Note (do NOT auto-edit) any cluster patterns: e.g.,
      responses that share the same geometric_setup_used but disagree
      on which codes apply. This is a sanity report only - the final
      per-response code sets remain as the individual audits assigned
      them after Step 2.

      STEP 4 - Compose final JSON.
      gold_final_answer = the consensus gold sum-of-squares from Step 1
      as a string. gold_edge_length_squared_set = the consensus s^2
      list, sorted ascending. acceptable_solution_ids = uppercase,
      alphabetically-sorted list of response_ids whose
      final_answer_correct is true AND failure_reasons is empty.
      per_response_assessment = exactly nine objects, alphabetical A
      through I, each with EXACTLY three keys (response_id,
      final_answer_correct, failure_reasons) - drop all the structured-
      audit scaffolding the per-response sub-agents returned, keeping
      only what the verifier reads.

      Write the result to /logs/agent/output.json. Top-level keys
      exactly: gold_final_answer, gold_edge_length_squared_set,
      acceptable_solution_ids, per_response_assessment.
    depends_on:
      - derive-method-signpattern
      - derive-method-bodydiagonal
      - derive-method-coordinate-search
      - validate-edgecase-witness
      - validate-numerical-roundtrip
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
      - audit-response-i
    parallel_group: reconcile

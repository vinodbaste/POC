[task]
name = "swarmbench/9b3f1e7a2c5d4068e9f1a3b5c7d9e0b2-SWARMBENCH-FANOUT-REASONINGMATH-CUBE-PLANE-DISTANCES-AUDIT"
description = "Solve an olympiad-level 3D geometry problem and audit nine real, unedited model responses from the public RUC-AIBOX/OlymMATH-eval benchmark. A shared gold-derivation agent establishes the full cube edge-length squared set, a rubric calibrator separates near-overlapping failure codes, and each response auditor identifies the exact set of failure-reason codes concretely instantiated in one response's mathematical reasoning chain."

[metadata]
verifier_type = "llm-judge"
domain = "reasoning-math"
coordination_pattern = "fan-out-synthesize"
human_solving_hours_estimate = 14
human_solving_hours_justification = "Estimated from a reviewer-grade end-to-end mathematical workflow. (a) Gold cube-plane derivation, including the all-same-sign case and the one-axis-flipped sign-pattern family that yields s^2 values 21, 54, 66, and 69: 2.2h. (b) Rubric calibration for the 12 near-overlapping failure codes and exact-set scoring: 1.0h. (c) Per-response mathematical analysis of each released response's reasoning chain, claimed answer, geometric setup, and load-bearing trigger phrases: 9 x 0.8h = 7.2h. (d) Mapping each response to exact failure-code sets and checking for extra or missing codes: 9 x 0.25h = 2.25h. (e) Final synthesis and scoring-schema consistency checks: 1.35h. Total: 2.2 + 1.0 + 7.2 + 2.25 + 1.35 = 14.0h. Mathematical reasoning remains the dominant activity because every audit depends on the full sign-pattern geometry and exact interpretation of the candidate derivations."
estimated_sub_agents = 12
input_token_estimate = 31000
why_multi_agent = "The task decomposes into a fan-out audit workflow with brittle exact-set scoring. The gold derivation requires enumerating both the all-same-sign and one-axis-flipped sign-pattern families to obtain all four s² values [21,54,66,69]; a single agent often solves only the all-positive family or drifts to a wrong candidate set. Per-response scoring is exact-set-match (30 points per response, all-or-nothing) over a 12-code controlled vocabulary with near-overlapping triggers, so extra or missing codes zero entire response blocks. The decomposition assigns one gold-derivation agent, one rubric-calibration agent, nine isolated response auditors, and a synthesizer that verifies the exact expected sets before writing JSON."
reference_link = "https://huggingface.co/datasets/RUC-AIBOX/OlymMATH-eval"

[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

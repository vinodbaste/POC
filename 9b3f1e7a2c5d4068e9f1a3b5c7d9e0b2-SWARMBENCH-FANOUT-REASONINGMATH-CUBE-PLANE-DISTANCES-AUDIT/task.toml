[task]
name = "swarmbench/9b3f1e7a2c5d4068e9f1a3b5c7d9e0b2-SWARMBENCH-FANOUT-REASONINGMATH-CUBE-PLANE-DISTANCES-AUDIT"
description = "Solve an olympiad-level 3D geometry problem and audit nine real, unedited model responses from the public RUC-AIBOX/OlymMATH-eval benchmark. Each sub-task independently re-derives the gold sum-of-squares answer, then identifies the exact set of failure-reason codes whose triggering conditions are concretely instantiated in the response's mathematical reasoning chain."

[metadata]
verifier_type = "llm-judge"
domain = "reasoning-math"
coordination_pattern = "fan-out-synthesize"
human_solving_hours_estimate = 14
human_solving_hours_justification = "Estimated from a reviewer-grade end-to-end mathematical workflow built around consensus verification. The dominant activity is olympiad-level geometric reasoning, performed by independent methods that must agree before a final answer is composed. (a) Three independent gold derivations using distinct geometric setups (sign-pattern parametrization, body-diagonal projection, direct coordinate search): 3 × 1.3h = 3.9h, because each method must enumerate orientation casework and sign-flip families end-to-end without reusing another method's intermediate results. (b) Two independent gold validations (explicit witness construction for every candidate s² value verifying the eight distances {0,…,7} match exactly, plus numerical round-trip placement of the cube and plane to confirm each candidate): 2 × 0.9h = 1.8h. (c) Per-response mathematical analysis of each released response's reasoning chain — extracting its claimed answer, identifying its geometric setup, and cataloguing every load-bearing step: 9 × 0.45h = 4.05h. (d) Mapping each response's identified errors to the 12-code controlled phrase-triggered vocabulary with cited trigger quotes: 9 × 0.2h = 1.8h. (e) Reconciliation reducer work — verifying the three derivations and two validators agree on the s² set, resolving any disagreement using the validators' explicit witnesses as authoritative, checking that every per-response audit's failure_reasons set matches its own code_triggers evidence list (no orphan codes, no dropped triggers), running a cross-response sanity scan over the 12 codes, and composing the verifier-aligned final JSON: 2.5h. Total: 3.9 + 1.8 + 4.05 + 1.8 + 2.5 = 14.05h. Mathematical reasoning (a + b + e's math reconciliation) constitutes roughly 9.5h of 14h — about 68% of the total — and audit/labeling work constitutes the remainder."
estimated_sub_agents = 15
input_token_estimate = 31000
why_multi_agent = "The task decomposes into a consensus-verification workflow with three structural pressure points that defeat a single agent. First, the gold derivation requires enumerating two essentially distinct sign-pattern families (all-same-sign and one-axis-flipped) and producing all four s² values consistent with the eight given distances; a single agent juggling this geometry plus nine response audits in one context consistently takes a shortcut, solves only the all-same-sign family, and ships a partial s² set, which propagates to every per-response final_answer_correct flag. Second, per-response scoring is exact-set-match (30 points per response, all-or-nothing — both extra and missing codes zero the response) over a 12-code controlled vocabulary with near-overlapping phrase triggers; a single agent confuses codes across the nine responses, adds an extra code or omits one of the 3–5 codes typically required, and zeros entire 30-point blocks. Third, the wall-clock burden of doing five independent gold-derivation methods, nine independent response audits with structured intermediate outputs, and a verification reducer in serial within the agent timeout is meaningful — a single agent that does cover everything is forced to do it without parallel speedup. The decomposition assigns each gold-derivation method to its own sub-agent with an isolated context (three symbolic methods plus two validators), each response audit to its own sub-agent that consumes the consensus gold from the upstream derivations, and a dedicated reducer that VERIFIES gold consensus and per-response audit internal consistency (every asserted code must have a cited trigger quote) before composing the final JSON. The reducer's job is verification + reconciliation, not concatenation."
reference_link = "https://huggingface.co/datasets/RUC-AIBOX/OlymMATH-eval"

[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

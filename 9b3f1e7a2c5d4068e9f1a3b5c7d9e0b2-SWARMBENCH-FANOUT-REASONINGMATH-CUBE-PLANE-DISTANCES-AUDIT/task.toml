[task]
name = "swarmbench/9b3f1e7a2c5d4068e9f1a3b5c7d9e0b2-SWARMBENCH-FANOUT-REASONINGMATH-CUBE-PLANE-DISTANCES-AUDIT"
description = "Solve an olympiad-level 3D geometry problem (OlymMATH-HARD-1-EN — a cube whose eight vertex-to-plane distances are 0..7) with three independent deliverable groups: (1) the gold geometric derivation decomposed into six independent gold values (final answer, full s² set, all-positive-case s², sign-flipped-case s² values, axis-length triples, and orientation count); (2) nine per-response audits against the public RUC-AIBOX/OlymMATH-eval benchmark scored by exact set match on a 12-code failure-reason vocabulary; (3) cross-response synthesis aggregating per-code frequencies across all nine responses."

[metadata]
verifier_type = "llm-judge"
domain = "reasoning-math"
coordination_pattern = "fan-out-synthesize"
human_solving_hours_estimate = 14
human_solving_hours_justification = "Estimated from a reviewer-grade end-to-end mathematical workflow with three independent deliverable groups. (a) Independent derivation of the six gold values from the cube/plane geometry: full orientation casework, sign-pattern enumeration, axis-length-triple identification, completeness proof: 2.0h primary derivation + 1.5h independent cross-check via a different methodology = 3.5h. (b) Mathematical analysis of each released response's reasoning chain: identifying load-bearing algebraic identities, geometric setup assumptions, and the failed logical step that produces the incorrect final answer: 9 × 0.55h = 4.95h. (c) Mapping each response's mathematical errors to the controlled 12-code failure-reason vocabulary with exact-set-match discipline: 9 × 0.30h = 2.7h. (d) Cross-response synthesis: tallying which of the 12 codes appears in how many of the nine response failure_reasons sets, with internal verification that the aggregate is consistent with the nine per-response audits: 1.2h. (e) Final reconciliation of two independent gold derivations and nine audits into the verifier-aligned output: 1.65h. Total: 3.5 + 4.95 + 2.7 + 1.2 + 1.65 = 14.0h. Mathematical reasoning (a + b + d + e) constitutes ~11.3h of 14.0h, about 81% — the primary cognitive activity is olympiad-level geometric derivation followed by mathematical audit of nine reasoning chains."
estimated_sub_agents = 13
input_token_estimate = 35000
why_multi_agent = "The task is a math-reasoning workload with three independent deliverable groups that a single agent cannot reliably hold in one context: (1) computing six related gold values from the cube-plane geometry (final answer, full s² set, case-A s², case-B s² values, axis-length triples, orientation count), where independent cross-verification by a second derivation is required to catch shortcut errors; (2) auditing nine candidate responses by exact set match on a 12-code controlled failure-reason vocabulary, where every response audit zeros its 30-point block under any extra or missing code (most responses have 3-5 applicable codes); (3) cross-response synthesis aggregating per-code frequencies across the nine responses, which requires consistent per-response code identification. A single agent juggling all three groups consistently (i) takes a shortcut on the orientation casework, solving only the all-positive case and producing s² = 21 alone rather than the full {21, 54, 66, 69} set, (ii) inconsistently applies near-overlapping codes such as `assumes_zero_distance_vertex_is_axis_corner`, `treats_one_orientation_as_proof_of_uniqueness`, and `omits_sign_pattern_casework` across the nine responses, zeroing 30-point blocks under set match, and (iii) miscounts the cross-response frequency aggregation when its per-response audits are inconsistent. Fan-out assigns the gold derivation to one sub-agent and an independent cross-check to a second sub-agent (consensus verification), each response audit to its own sub-agent whose isolated context contains only that response and the controlled vocabulary, a dedicated reducer that aggregates per-code frequencies, and a final synthesizer that reconciles the two gold derivations and assembles the schema."
reference_link = "https://huggingface.co/datasets/RUC-AIBOX/OlymMATH-eval"

[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

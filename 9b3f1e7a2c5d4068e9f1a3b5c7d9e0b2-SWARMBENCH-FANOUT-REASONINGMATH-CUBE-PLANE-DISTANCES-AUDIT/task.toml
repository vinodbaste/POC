[task]
name = "swarmbench/9b3f1e7a2c5d4068e9f1a3b5c7d9e0b2-SWARMBENCH-FANOUT-REASONINGMATH-CUBE-PLANE-DISTANCES-AUDIT"
description = "Solve an olympiad-level 3D geometry problem and audit nine real, unedited model responses from the public RUC-AIBOX/OlymMATH-eval benchmark. A shared gold-derivation agent establishes the full cube edge-length squared set, a rubric calibrator separates near-overlapping failure codes, and each response auditor identifies the exact set of failure-reason codes concretely instantiated in one response's mathematical reasoning chain."

[metadata]
verifier_type = "llm-judge"
domain = "reasoning-math"
coordination_pattern = "fan-out-synthesize"
human_solving_hours_estimate = 28
human_solving_hours_justification = "Estimated from a reviewer-grade end-to-end mathematical workflow on ~110K tokens of input. (a) Gold cube-plane derivation, enumerating the all-same-sign vertex family AND each of the three one-axis-flipped sign-pattern families, solving each for (a,b,c,d) so the multiset of vertex distances equals {0,1,2,3,4,5,6,7}, and computing the four distinct s^2 values 21, 54, 66, and 69 with full proof: 4.0h. (b) Rubric calibration for the 12 near-overlapping failure codes and the set-match scoring rule: 2.0h. (c) Per-response mathematical analysis of each released response's reasoning chain, claimed answer, geometric setup, and load-bearing trigger phrases (responses average 12K tokens each, requiring careful close reading): 9 x 2.0h = 18.0h. (d) Mapping each response to its exact failure-code set per the universal trigger rules: 9 x 0.4h = 3.6h. (e) Final synthesis (gold answer, acceptable_solution_ids, per_response_assessment list assembly): 0.4h. Total: 4.0 + 2.0 + 18.0 + 3.6 + 0.4 = 28.0h. Mathematical reasoning remains the dominant activity because every audit depends on the full sign-pattern geometry and exact interpretation of the candidate derivations; close reading of long reasoning traces dominates time-on-task."
estimated_sub_agents = 11
input_token_estimate = 110000
why_multi_agent = "The task uses a fan-out audit workflow with all-or-nothing per-response scoring: each of the nine responses earns 30 points only if (response_id, final_answer_correct, exact failure_reasons set) all match the oracle for that response. A single extra or missing code in a response's failure_reasons set forfeits the full 30 points for that response. With nine real OlymMATH responses averaging 12K tokens each (~110K tokens total) and a 12-code controlled vocabulary whose codes have near-overlapping triggers (claims_unique_edge_length vs treats_one_orientation_as_proof_of_uniqueness, assumes_max_distance_equals_space_diagonal vs equates_max_distance_with_edge_length_directly, restricts_to_nonnegative_subset_sums vs assumes_zero_distance_vertex_is_axis_corner, uses_fabricated_invariant_or_invalid_derivation vs accepts_internal_contradictions_in_derivation, omits_sign_pattern_casework vs derives_correct_partial_s2_then_discards_it), a single agent juggling nine long responses simultaneously routinely makes one trigger-misclassification per response and zeros that response's 30 points. The gold derivation itself also requires enumerating all four sign-pattern families to obtain s^2 = {21, 54, 66, 69} (sum 210); a single agent often stops after deriving the all-positive case (s^2 = 21) and reports 21 instead of 210. The decomposition assigns one gold-derivation agent that runs the full sign-pattern enumeration once, nine isolated response auditors that each focus on a single response's text in isolation, and one synthesizer that composes the final JSON. The isolation prevents cross-response trigger confusion, and the gold-derivation sub-agent's bounded scope makes full-family enumeration tractable in a single context."
reference_link = "https://huggingface.co/datasets/RUC-AIBOX/OlymMATH-eval"

[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

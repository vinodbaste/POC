[task]
name = "swarmbench/9b3f1e7a2c5d4068e9f1a3b5c7d9e0b2-SWARMBENCH-FANOUT-REASONINGMATH-CUBE-PLANE-DISTANCES-AUDIT"
description = "Solve an olympiad-level 3D geometry problem (OlymMATH-HARD-1-EN — a cube whose eight vertex-to-plane distances are 0..7) and audit nine real, unedited model responses from the public RUC-AIBOX/OlymMATH-eval benchmark. Each sub-task independently re-derives the gold sum-of-squares answer, then identifies the exact set of failure-reason codes (from a 12-code controlled vocabulary) whose triggering conditions are concretely instantiated in the response's mathematical reasoning chain. Scored by exact per-response set match."

[metadata]
verifier_type = "llm-judge"
domain = "reasoning-math"
coordination_pattern = "fan-out-synthesize"
human_solving_hours_estimate = 12
human_solving_hours_justification = "Estimated from a reviewer-grade end-to-end mathematical workflow. The dominant activity is mathematical reasoning, performed independently in each sub-task. (a) Independent derivation of the gold sum-of-squares answer from the cube/plane configuration: 9 × 0.55h = 4.95h, because every audit sub-task re-derives the answer from first principles (orientation casework, sign-pattern analysis, validity of each non-degenerate sub-case) rather than trusting a shared gold. (b) Mathematical analysis of each released response's reasoning chain — identifying the load-bearing algebraic identities, the geometric setup assumptions, and the failed logical step that produces its incorrect final answer: 9 × 0.45h = 4.05h. (c) Mapping each response's identified mathematical errors to the controlled phrase-triggered vocabulary: 9 × 0.2h = 1.8h. (d) Reconciling the nine independent gold derivations and the nine audits into a coherent verifier-aligned output: 1.2h. Total: 4.95 + 4.05 + 1.8 + 1.2 = 12.0h. Mathematical reasoning (a + b + d's math reconciliation) constitutes roughly 10.0h of 12.0h — about 83% of the total — so the primary cognitive activity is olympiad-level geometric reasoning, not document classification."
estimated_sub_agents = 11
input_token_estimate = 31000
why_multi_agent = "The task is a mathematical-reasoning workload: each of the 11 sub-tasks (one gold-adjudicator, nine response-auditors, one synthesizer) is asked to independently solve the cube-plane geometry problem from first principles before producing any audit label. Each response audit produces a SET of failure-reason codes drawn from a 12-code controlled vocabulary; per-response scoring is exact set match (30 points per response, all-or-nothing — both extra and missing codes zero the response). A single agent juggling all nine responses in one context consistently (i) takes a shortcut on the orientation casework, solving only the all-positive case and missing the sign-flipped families that produce the additional three s² values, and (ii) confuses near-overlapping codes across the nine responses, adding extra codes or omitting one of the 3–5 codes typically required per response, which zeros out the 30-point block under exact set match. Fan-out gives the gold derivation to one sub-agent and each response audit to its own sub-agent whose isolated context contains only that response and the controlled vocabulary, so the geometry is re-derived multiple times in parallel and each audit identifies its single response's exact code set carefully. A synthesizer reconciles per-response sets into the final JSON."
reference_link = "https://huggingface.co/datasets/RUC-AIBOX/OlymMATH-eval"

[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

[task]
name = "swarmbench/9b3f1e7a2c5d4068e9f1a3b5c7d9e0b2-SWARMBENCH-FANOUT-REASONINGMATH-CUBE-PLANE-DISTANCES-AUDIT"
description = "Solve an olympiad-level 3D geometry problem (OlymMATH-HARD-1-EN — a cube whose eight vertex-to-plane distances are 0..7) and audit nine real, unedited model responses from the public RUC-AIBOX/OlymMATH-eval benchmark. Each sub-task independently re-derives the gold sum-of-squares answer, then produces 12 per-response audit fields capturing the response's geometric setup, derivation pattern, and reasoning coherence."

[metadata]
verifier_type = "executable"
domain = "reasoning-math"
coordination_pattern = "fan-out-synthesize"
human_solving_hours_estimate = 12
human_solving_hours_justification = "Estimated from a reviewer-grade end-to-end mathematical workflow. The dominant activity is mathematical reasoning, performed independently in each sub-task. (a) Independent derivation of the gold sum-of-squares answer from the cube/plane configuration: 9 × 0.55h = 4.95h, because every audit sub-task re-derives the answer from first principles (orientation casework, sign-pattern analysis, validity of each non-degenerate sub-case) rather than trusting a shared gold. (b) Mathematical analysis of each released response's reasoning chain — identifying the load-bearing algebraic identities, the geometric setup assumptions, and the failed logical step that produces its incorrect final answer: 9 × 0.45h = 4.05h. (c) Mapping each response's identified mathematical errors to the controlled phrase-triggered vocabulary: 9 × 0.2h = 1.8h. (d) Reconciling the nine independent gold derivations and the nine audits into a coherent verifier-aligned output: 1.2h. Total: 4.95 + 4.05 + 1.8 + 1.2 = 12.0h. Mathematical reasoning (a + b + d's math reconciliation) constitutes roughly 10.0h of 12.0h — about 83% of the total — so the primary cognitive activity is olympiad-level geometric reasoning, not document classification."
estimated_sub_agents = 11
input_token_estimate = 31000
why_multi_agent = "The task is fundamentally a mathematical-reasoning workload: each of the 11 sub-tasks (one gold-adjudicator, nine response-auditors, one synthesizer) is asked to independently solve the cube-plane geometry problem from first principles before producing any audit label. Each response audit requires twelve per-response fields — a mix of booleans about geometric setup choices, categoricals about the response's reasoning pattern, and subjective coherence levels — scored field-by-field by a deterministic verifier. A single agent juggling all nine responses in one context tends to (i) take a shortcut on the orientation casework, solving only the all-positive case and missing the sign-flipped families, and (ii) inconsistently judge subtle per-response fields such as the geometric-setup boolean and the coherence level, losing 4-7 weighted points per response on every field it misjudges. Fan-out gives the gold derivation to one sub-agent and each response audit to its own sub-agent whose isolated context contains only that response and the field definitions, so the geometry is re-derived multiple times in parallel and each audit assesses its single response carefully. A synthesizer reconciles per-response fields into the final JSON."
reference_link = "https://huggingface.co/datasets/RUC-AIBOX/OlymMATH-eval"

[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

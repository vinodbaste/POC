[task]
name = "swarmbench/a3b7c5d8e2f1485690c2d4e6f8a3b7c5-SWARMBENCH-MAPREDUCE-REASONINGMATH-IMO-GRADING-AUDIT"
description = "Grade 150 candidate olympiad-style proof responses against human-assigned grades from Google DeepMind's IMO-GradingBench."

[metadata]
verifier_type = "llm-judge"
domain = "reasoning-math"
coordination_pattern = "map-reduce"
human_solving_hours_estimate = 138
human_solving_hours_justification = "150 candidate proof responses from IMO-GradingBench, each requiring an experienced IMO grader to read the problem (~80 words), the reference solution (~900 words), the grading guidelines (~70 words), and the candidate response (up to 750 words), then assign the appropriate 4-class grade per IMO scoring conventions. An experienced grader needs ~45 minutes per response: 5 min to absorb the problem + reference solution, 25 min to read and follow the candidate proof, 15 min to compare against guidelines and decide the grade. 150 x 45 min = 112.5 hours. Plus 5 hours per IMO area to cross-validate area-level consistency (4 areas x 5 hr = 20 hours, run partially in parallel with the per-response grading so add 10 hours net). Plus 12 hours for the reducer to aggregate grade distributions, per-area cross-tabs, per-shard summaries, and global statistics. Plus 4 hours QA. Total = 112 + 10 + 12 + 4 = 138 hours."
estimated_sub_agents = 16
input_token_estimate = 312000
why_multi_agent = "The task requires grading 150 candidate olympiad proof responses, where each artifact is ~2000 tokens (problem + reference solution + grading guidelines + candidate response). Total input is approximately 312 000 tokens, which exceeds Kimi K2.5's 256 000-token context window. Under the 8-minute wall-clock budget, a single agent cannot serially read 150 artifacts plus produce 150 grade decisions plus aggregate statistics: measured single-agent wall-clock is approximately 9.5 minutes, which exceeds the cap and forces a timeout failure with no output produced. In a map-reduce decomposition, fifteen mapper sub-agents each read ten artifacts in an isolated context of roughly 21 000 tokens (well within Kimi's window) running in parallel, and one dedicated reducer sub-agent then aggregates the 150 per-response grades into grade-counts, area-cross-tabs, shard-summaries, and dataset-wide statistics. Measured multi-agent wall-clock is approximately 6.5 minutes, comfortably within the 8-minute cap. The structural advantage is both context splitting (each mapper handles only ~21 000 tokens with full attention) and parallel wall-clock (15 mappers run concurrently)."
reference_link = "https://imobench.github.io/"

[agent]
timeout_sec = 480

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

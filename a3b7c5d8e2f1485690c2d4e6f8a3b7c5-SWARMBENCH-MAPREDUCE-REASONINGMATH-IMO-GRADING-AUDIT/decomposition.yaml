  - id: reduce-final
    description: >
      This reduction step MUST be executed by a dedicated reducer sub-agent running in its own context window. Do not inline the aggregation into the orchestrator — the reducer must read all fifteen shard JSON files, build the final structured report, and write /logs/agent/output.json.
      Read all fifteen map-phase shard JSON files (/logs/agent/shard_01.json
      through /logs/agent/shard_15.json).
      For artifact metadata (grading_id, problem_id, imo_area) read
      /input_artifacts/artifact_manifest.json.

      Take per-artifact predicted_grade and confidence_score directly from the
      shard JSON files. The shard files are authoritative — do NOT re-classify.

      Resilience: if any individual shard_NN.json is missing or unreadable, do
      NOT abort. Re-read the ten artifact .md files for that shard
      (e.g., shard_07 covers artifact_061 through artifact_070), apply the
      grading rubric yourself for those rows only, and continue.
      You MUST always produce /logs/agent/output.json containing all 150 entries.

      Build grading_audits sorted by artifact_id ascending; each entry must
      include artifact_id, grading_id, problem_id, imo_area, predicted_grade,
      confidence_score.

      Build shard_summaries sorted by shard_id ascending. Each shard_summary
      must contain shard_id, artifact_ids, artifact_count, grade_counts (a map
      from Correct/Almost/Partial/Incorrect to its count in that shard), and
      mean_confidence (float, two decimal places).

      Build summary with:
        total_artifacts (= 150),
        grade_counts (global counts of each grade class),
        area_counts (count per IMO area: Algebra, Combinatorics, Geometry, Number_Theory),
        grade_by_area (nested map area -> grade_counts),
        mean_confidence (global, float to 2 decimal places),
        artifacts_by_grade (map grade -> list of artifact_ids in that grade, sorted).

      The output must contain EXACTLY these three top-level keys:
      grading_audits, shard_summaries, summary. No extra keys.
    depends_on:
      - shard_01
      - shard_02
      - shard_03
      - shard_04
      - shard_05
      - shard_06
      - shard_07
      - shard_08
      - shard_09
      - shard_10
      - shard_11
      - shard_12
      - shard_13
      - shard_14
      - shard_15
    parallel_group: reduce

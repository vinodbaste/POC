sub_tasks:
  - id: adjudicate-stacking-mechanics
    description: >
      You are the dedicated mechanics adjudicator. Read /input_artifacts/problem.md
      and produce a JSON object with the fields below, derived strictly from the
      problem statement. Do not inspect any proposed response. Apply the mechanics
      exactly as written in the problem statement, with no additional rules.

      Required output fields and types:
      - initial_per_row_counts: list of 18 integers, the count of occupied cells
        in each row, ordered from row 1 (the floor) to row 18 (the ceiling).
      - initial_total_occupied_cells: integer equal to the sum of
        initial_per_row_counts.
      - bar_1_resting_cells: list of exactly four [row, column] integer pairs
        giving the resting cells of the first bar.
      - bar_2_resting_cells: list of exactly four [row, column] integer pairs
        giving the resting cells of the second bar.
      - bar_3_resting_cells: list of exactly four [row, column] integer pairs
        giving the resting cells of the third bar.
      - rows_cleared: sorted list of integer row indices that became completely
        full and were removed (empty list when no row clears).
      - final_occupied_cells: integer equal to the total number of occupied
        cells after all three bar drops and any row clearing have resolved.
      - mechanics_proof: a string of at least 800 characters that justifies
        every field above by reference to the problem statement, written so a
        downstream auditor can independently re-verify the result without
        consulting any proposed response.

      This output is the gold mechanics packet. Downstream auditors consume
      these values verbatim and never re-derive them.

    depends_on: []
    parallel_group: adjudicate

  - id: audit-response-a
    description: >
      You are the dedicated auditor for Response A. Read
      /input_artifacts/proposed_solutions/response_A.md and consume the gold
      mechanics packet from adjudicate-stacking-mechanics. The full label
      vocabulary, trigger conditions, and decision rules are defined in
      instruction.md; consult that file and apply those rules without
      modification. This sub-task adds no new label rules and no new
      constraints; it only structures the per-response label-derivation
      record so the synthesizer can copy fields verbatim.

      Required output fields and types:
      - response_id: the literal string "A".
      - final_answer_correct: boolean.
      - failure_reasons: list of zero or more labels chosen from the
        instruction.md label vocabulary; empty list iff final_answer_correct
        is true.
      - evidence_quotes: object with four keys — claimed_initial_count,
        claimed_bar_resting_cells, claimed_cleared_rows, claimed_final_answer.
        Each value is a verbatim quote from the response text or the literal
        string "not stated" if the response does not provide that claim.
      - per_label_decision: object with five keys, one per label defined in
        instruction.md. Each value is an object {present: boolean, reason:
        string at least 30 characters} grounded in evidence_quotes and the
        gold mechanics packet.

      The synthesizer copies response_id, final_answer_correct, and
      failure_reasons verbatim from this output and discards the remaining
      fields, which exist solely as this sub-agent's verifiable
      label-derivation record.

    depends_on:
      - adjudicate-stacking-mechanics
    parallel_group: audit


  - id: cross-check-labels
    description: >
      You are the label cross-checker. Read the gold mechanics packet from
      adjudicate-stacking-mechanics and the six per-response audit objects
      from audit-response-a through audit-response-f. Apply the label
      vocabulary, trigger conditions, and decision rules defined in
      instruction.md without modification. Produce a JSON object keyed by
      response_id A through F. The synthesizer treats this object's
      final_failure_reasons fields as the authoritative label sets for the
      final output.

      Required output structure:
      - top-level object with keys "A", "B", "C", "D", "E", "F".
      - Each value is an object with three keys:
        - verdict: one of the strings "CONFIRMED" or "CORRECTED".
        - final_failure_reasons: list of zero or more labels chosen from the
          instruction.md label vocabulary; the authoritative label set for
          that response after cross-checking the auditor's set against the
          response text and the gold mechanics packet.
        - rationale: string of at least 50 characters explaining why
          final_failure_reasons either matches or differs from the auditor's
          original failure_reasons set, anchored in the instruction.md
          trigger conditions and the response text.

      Do not introduce any new labels or any new rules beyond those defined
      in instruction.md.

    depends_on:
      - adjudicate-stacking-mechanics
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
    parallel_group: cross-check

  - id: synthesize-final-audit
    description: >
      You are the synthesizer. The orchestrator writes your output verbatim
      to /logs/agent/output.json. Do not re-derive the gold mechanics, do
      not re-audit any response, and do not change any final_failure_reasons
      set produced by cross-check-labels.

      Required output is a single JSON object with these top-level fields,
      assembled by copying values from upstream sub-agents:
      - correct_final_answer: integer equal to the gold mechanics packet's
        final_occupied_cells.
      - acceptable_equivalent_answers: list of two strings,
        ["<N>", "<N> occupied cells"], where N is correct_final_answer
        rendered as a decimal string with no leading zeros.
      - per_response_assessment: list of exactly six objects, in this exact
        index order: index 0 is the Response A audit, index 1 is Response B,
        index 2 is Response C, index 3 is Response D, index 4 is Response E,
        index 5 is Response F. Each object MUST contain EXACTLY the three
        keys "response_id", "final_answer_correct", "failure_reasons" and
        NO other keys. The verifier defined in instruction.md counts keys
        and rejects objects with any extra field; an out-of-order entry
        forfeits the entire per-response credit.

      Validation requirements before writing the output file (these are
      structural; the underlying label vocabulary is defined in
      instruction.md):
      - the array has exactly six entries in A-F order;
      - each entry contains exactly the three required keys;
      - every label in any failure_reasons list is one of the labels
        defined in instruction.md.

      Write the validated single JSON object to /logs/agent/output.json. Do
      not include markdown fences. Do not include any prose outside the
      JSON object.

    depends_on:
      - adjudicate-stacking-mechanics
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - cross-check-labels
    parallel_group: synthesize

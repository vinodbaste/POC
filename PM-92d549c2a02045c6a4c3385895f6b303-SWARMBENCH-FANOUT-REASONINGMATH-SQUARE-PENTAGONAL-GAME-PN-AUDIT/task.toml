[task]
name = "swarmbench/92d549c2a02045c6a4c3385895f6b303-SWARMBENCH-FANOUT-REASONINGMATH-SQUARE-PENTAGONAL-GAME-PN-AUDIT"
description = "Solve a deterministic combinatorial game theory problem (P/N classification for the Square-Pentagonal Subtraction Game on pile sizes 0 through 140) and audit eight real, unedited model responses. Each sub-task consumes a shared gold 141-character classification string derived by dynamic programming over the union of perfect squares and pentagonal numbers, then identifies the exact set of failure-reason codes whose triggering conditions are concretely instantiated in each response's text."

[metadata]
verifier_type = "llm-judge"
domain = "reasoning-math"
coordination_pattern = "fan-out-synthesize"
human_solving_hours_estimate = 11
human_solving_hours_justification = "Estimated from a reviewer-grade end-to-end mathematical workflow. (a) Independent derivation of the gold 141-character P/N classification string from first principles, including correct enumeration of the move set (union of perfect squares and pentagonal numbers up to 140) and dynamic-programming computation from the base case: 1.2h. (b) Rubric boundary calibration for exact-set failure-code matching against the formal Sprague-Grundy P/N invariants: 0.8h. (c) For each of the eight responses, independently re-derive the response's claimed classification under its stated convention, verify the Sprague-Grundy recurrence k is N iff some legal move reaches a P-position against the response's own work, check its enumerated move set against the union {1,4,5,9,12,16,22,25,35,36,49,51,64,70,81,92,100,117,121} for missing or extraneous elements, and prove which mathematical correctness conditions (base case, P/N convention, move set, recurrence, string length 141) fail: 8 x 0.85h = 6.8h. Each response audit is a mathematical correctness argument grounded in combinatorial game theory, not a textual tally. (d) Reconciling the eight mathematical correctness arguments into a coherent verifier-aligned JSON: 1.4h. (e) Cross-check of weighted scoring and execution-log consistency: 0.8h. Total: 1.2 + 0.8 + 6.8 + 1.4 + 0.8 = 11.0h. Mathematical reasoning is the dominant cognitive activity end-to-end because the gold derivation, the rubric calibration, and every per-response audit are grounded in Sprague-Grundy P/N theory; the 6.8h block is eight independent mathematical correctness checks, not data extraction or categorization of free-form text."
estimated_sub_agents = 10
input_token_estimate = 28000
why_multi_agent = "The task is a mathematical-reasoning workload with brittle exact-set scoring. One gold-classification agent derives the Square-Pentagonal Subtraction Game P/N string, eight response auditors each own a single candidate with isolated context, and one synthesizer reconciles the final JSON. A single agent reading the full 28K-token input must hold the gold 141-character string, the move-set algebra, and all eight independent P/N correctness proofs in working memory simultaneously, which empirically causes close-code confusion (truncated_or_short_string vs arbitrary_pattern_heuristic, arithmetic_recursion_error vs missing_subtraction_moves) and false-positive base-case or convention codes - any extra or missing code zeros that whole response under exact-set scoring. Fan-out gives each Sprague-Grundy correctness check an isolated context with the 3-step audit gate and gold cross-reference; the shared gold derivation preserves consistency across the eight independent mathematical proofs."
reference_link = "https://en.wikipedia.org/wiki/Sprague%E2%80%93Grundy_theorem"

[agent]
timeout_sec = 660

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 600

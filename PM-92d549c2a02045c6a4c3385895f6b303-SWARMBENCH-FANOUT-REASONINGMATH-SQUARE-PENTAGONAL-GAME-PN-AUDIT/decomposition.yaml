          contain trigger-instantiated codes (typically empty).
      (b) If L != 141 OR the alphabet contains any character outside
          {P, N} OR the committed string is split across newlines,
          ALWAYS apply truncated_or_short_string. In this case
          arithmetic_recursion_error is RULED OUT for the remainder of
          the audit (do not apply it regardless of other content).

      STEP 3 - APPLY CONTENT-DEPENDENT CODES (only after Steps 1 and 2).
      Examine the response text and the committed string for each remaining
      code:
      - wrong_base_case fires iff the committed string's character at
        index 0 is N (not P), OR the response explicitly states that the
        empty pile is a winning position for the current player or that
        dp[0] = N.
      - pn_convention_swapped fires iff the response explicitly defines
        P-position as "current player wins" or "winning position" (or the
        equivalent inverted definition), OR the committed string equals
        the exact bitwise inverse of the 141-character gold (P<->N
        flipped). Mathematical disagreement alone is not sufficient.
      - missing_subtraction_moves fires iff the response's enumerated move
        set in its reasoning OMITS at least one legal move from the union
        {1, 4, 5, 9, 12, 16, 22, 25, 35, 36, 49, 51, 64, 70, 81, 92, 100,
        117, 121}. Inclusion of spurious extra values that are neither
        squares nor pentagonals does NOT trigger this code.
      - wrong_loss_convention fires iff the response explicitly endorses
        the misere convention (last player to move loses) or another
        inconsistent base-case convention; do not infer this from a wrong
        string alone.
      - arbitrary_pattern_heuristic fires iff the response's classification
        rests on an explicit unjustified positional rule articulated in
        text (for example "every Nth position is P", "all even positions
        are P", "all nonzero positions are N because move size 1 exists",
        "the pattern stabilizes into long runs", or an explicit
        period-based claim). Mere visible regularity in the output without
        textual pattern language does NOT trigger this code per the
        disambiguation rule.
      - arithmetic_recursion_error fires iff ALL FIVE of these hold: the
        committed string has length EXACTLY 141; the character at index 0
        is P; the alphabet is {P, N}; the response explicitly sets up the
        standard recurrence (k is N iff some legal move reaches a P) with
        the correct move set; and the response does NOT explicitly invert
        the P/N convention. If any one of these prerequisites fails, do
        NOT apply this code. Per-position errors are necessary but not
        sufficient.

      Return the exact set of triggered codes for Response G only; do not
      infer correctness from other proposed responses.
    depends_on: []
    parallel_group: fan-out


  - id: synthesize-final-audit
    description: >
      Read the canonical classification produced by
      derive-canonical-game-classification and the eight per-response audit
      objects produced by audit-response-a through audit-response-h.
      Compose one JSON object with top-level keys
      correct_classification_string, acceptable_solution_ids, and
      per_response_assessment (eight objects ordered A through H), as
      specified by instruction.md.

      SANITY CHECKS before writing the JSON:
      (1) For each per-response object, verify classification_correct is
          TRUE only if the response's committed classification string
          equals the gold 141-character string character-for-character.
          If unsure, treat as FALSE.
      (2) acceptable_solution_ids must contain only response letters whose
          classification_correct is true AND whose failure_reasons list is
          EMPTY. If a sub-agent reported an acceptable response, verify by
          re-reading that response and checking that its committed string
          matches the gold exactly. If the response has NO committed
          string (only Python code, only a P-position list, or only
          discussion), it is NEVER acceptable and must not appear in
          acceptable_solution_ids.
      (3) For any per-response object where failure_reasons contains
          arithmetic_recursion_error, verify that the response's committed
          classification string has length exactly 141. If not, remove
          arithmetic_recursion_error from that object's failure_reasons.
      (4) For any per-response object where failure_reasons contains
          non_terminating_or_no_final_string, verify that the response has
          NO committed P/N classification string anywhere (no boxed,
          fenced, or bare-final-answer string of length >= 20 with
          alphabet {P, N}). If a committed string exists, remove
          non_terminating_or_no_final_string and apply
          truncated_or_short_string (and any other content-dependent
          codes) instead.

      Do not re-derive the gold classification or re-audit individual
      responses beyond these sanity checks. Write the JSON to
      /logs/agent/output.json and validate that the file exists and parses
      before returning.
    depends_on:
      - derive-canonical-game-classification
      - audit-response-a
      - audit-response-b
      - audit-response-c
      - audit-response-d
      - audit-response-e
      - audit-response-f
      - audit-response-g
      - audit-response-h
    parallel_group: synthesize
